    : m.label.slice(0, at) + '<span class="ak">' + m.label[at] + '</span>' + m.label.slice(at + 1);
  bar.appendChild(top);

  const pop = document.createElement('div');
  pop.className = 'menu';
  pop.setAttribute('role', 'menu');
  pop.dataset.mi = mi;
  bar.appendChild(pop);
});

function paintMenu(mi) {
  const pop = bar.querySelector('.menu[data-mi="' + mi + '"]');
  pop.textContent = '';
  for (const it of MENUS[mi].items) {
    if (it.sep) { pop.appendChild(document.createElement('hr')); continue; }
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'menuitem');
    b.disabled = it.on ? !it.on() : false;

    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = it.check && it.check() ? '✓' : '';
    b.appendChild(tick);

    const txt = document.createElement('span');
    txt.textContent = typeof it.label === 'function' ? it.label() : it.label;
    b.appendChild(txt);

    const acc = document.createElement('span');
    acc.className = 'accel';
    acc.textContent = it.accel || '';
    b.appendChild(acc);

    b.addEventListener('click', () => { closeMenus(); it.run(); });
    pop.appendChild(b);
  }
  const top = bar.querySelector('.top[data-mi="' + mi + '"]');
  pop.style.left = top.offsetLeft + 'px';
}

function showMenu(mi) {
  closeMenus();
  paintMenu(mi);
  bar.querySelector('.menu[data-mi="' + mi + '"]').classList.add('open');
  bar.querySelector('.top[data-mi="' + mi + '"]').setAttribute('aria-expanded', 'true');
  openMenu = mi;
  openedByHover = false;
}

function closeMenus() {
  bar.querySelectorAll('.menu.open').forEach(p => p.classList.remove('open'));
  bar.querySelectorAll('.top').forEach(t => t.setAttribute('aria-expanded', 'false'));
  openMenu = -1;
}

let openedByHover = false;

bar.addEventListener('click', e => {
  const top = e.target.closest('.top');
  if (!top) return;
  const mi = +top.dataset.mi;
  // the pointer sliding along the bar already opened this one — the click
  // that follows should leave it open, not toggle it shut
  if (openMenu === mi && openedByHover) { openedByHover = false; return; }
  if (openMenu === mi) closeMenus(); else showMenu(mi);
});
bar.addEventListener('pointerover', e => {
  const top = e.target.closest('.top');
  if (top && openMenu >= 0 && +top.dataset.mi !== openMenu) {
    showMenu(+top.dataset.mi);
    openedByHover = true;
  }
});
document.addEventListener('pointerdown', e => {
  if (openMenu >= 0 && !e.target.closest('.menubar')) closeMenus();
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openMenu >= 0) { closeMenus(); return; }

  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    const mi = MENUS.findIndex(m => m.ak.toLowerCase() === e.key.toLowerCase());
    if (mi >= 0) { e.preventDefault(); showMenu(mi); return; }
  }

  if (openMenu >= 0 && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    showMenu((openMenu + (e.key === 'ArrowRight' ? 1 : MENUS.length - 1)) % MENUS.length);
    return;
  }
  if (openMenu >= 0 && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const items = Array.from(bar.querySelectorAll('.menu.open button:not(:disabled)'));
    if (!items.length) return;
    const at = items.indexOf(document.activeElement);
    const next = e.key === 'ArrowDown'
      ? (at + 1) % items.length
      : (at <= 0 ? items.length - 1 : at - 1);
    items[next].focus();
    return;
  }

  if (e.key === 'F5' && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    compile(e.shiftKey);
    return;
  }

  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 'o') { e.preventDefault(); openAsmPicker(); }
  else if (k === 'e') { e.preventDefault(); showView(view === 'code' ? 'sprites' : 'code'); }
  else if (k === 'g') { e.preventDefault(); showView('code'); $('#lineNo').focus(); $('#lineNo').select(); }
  else if (k === 'f') { e.preventDefault(); showView('code'); $('#find').focus(); }
  else if (k === 'b') { e.preventDefault(); compile(e.shiftKey); }
  else if (k === 's') { e.preventDefault(); saveAsm(e.shiftKey); }
  else if (e.key === 'Enter') { e.preventDefault(); applySprite(false); }
});

window.addEventListener('beforeunload', e => {
  if (FILE.tables.some((_, i) => isDirty(i)) && !FILE.saved) {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ==========================================================================
   Aba de código-fonte. O texto mostrado é o buildFile() — o .asm com os
   sprites já aplicados — então editar aqui e editar sprites são a mesma
   coisa vista de dois jeitos. Ao sair da aba (ou compilar, salvar, copiar),
   o texto volta a virar FILE.lines e as tabelas são relidas.
   ========================================================================== */

const MNEMONICS = (
  'adc and asl bcc bcs beq bit bmi bne bpl brk bvc bvs clc cld cli clv cmp cpx ' +
  'cpy dec dex dey eor inc inx iny jmp jsr lda ldx ldy lsr nop ora pha php pla ' +
  'plp rol ror rti rts sbc sec sed sei sta stx sty tax tay tsx txa txs tya ' +
  'dop top slo rla sre rra sax lax dcp isc anc alr arr xaa axs ahx shy shx tas las'
).split(' ').join('|');

const DIRECTIVES = 'byte word dc ds org rorg seg mac endm processor include incbin ' +
  'align equ set if else endif ifconst ifnconst repeat repend echo err subroutine hex';

const TOKEN = new RegExp(
  '(;[^\\n]*)' +                                   // 1 comentário
  '|(^[A-Za-z_][A-Za-z0-9_]*)' +                   // 2 label na coluna 0
  '|(\\.?\\b(?:' + DIRECTIVES + ')\\b)' +          // 3 diretiva
  '|\\b(' + MNEMONICS + ')\\b' +                   // 4 mnemônico
  '|(\\$[0-9A-Fa-f]+|%[01]+|\\b\\d+\\b)',          // 5 número
  'gmi');

const escHtml = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function highlight(text) {
  let out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(text))) {
    out += escHtml(text.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 'l' : m[3] ? 'd' : m[4] ? 'k' : 'n';
    out += '<span class="' + cls + '">' + escHtml(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  return out + escHtml(text.slice(last));
}

let codeDirty = false;      // o textarea tem edições ainda não relidas
let view = 'sprites';

const src = () => $('#src');

function paintCode() {
  const text = src().value;
  $('#hl').innerHTML = highlight(text) + '\n';

  const n = text.split('\n').length;
  const cur = lineAt(src().selectionStart);
  const nums = [];
  for (let i = 1; i <= n; i++) nums.push(i === cur ? '<b>' + i + '</b>' : String(i));
  $('#gutter').innerHTML = nums.join('\n') + '\n';

  $('#codeinfo').textContent = n + ' linhas · ' + text.length.toLocaleString('pt-BR') + ' caracteres';
  syncScroll();
}

function lineAt(pos) {
  return src().value.slice(0, pos).split('\n').length;
}

function syncScroll() {
  const ta = src();
  $('#hl').scrollTop = ta.scrollTop;
  $('#hl').scrollLeft = ta.scrollLeft;
  $('#gutter').scrollTop = ta.scrollTop;
}

/* --- ir para uma linha ---------------------------------------------------- */
function gotoLine(n, select) {
  if (view !== 'code') showView('code');
  const ta = src();
  const lines = ta.value.split('\n');
  n = Math.max(1, Math.min(lines.length, n | 0));

  let start = 0;
  for (let i = 0; i < n - 1; i++) start += lines[i].length + 1;
  const end = start + lines[n - 1].length;

  ta.focus();
  ta.setSelectionRange(start, select ? end : start);

  // a linha alvo fica a um terço da altura, não colada no topo
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 19;
  ta.scrollTop = Math.max(0, (n - 1) * lh - ta.clientHeight / 3);
  paintCode();
  say('linha ' + n + (FILE.name ? ' de ' + FILE.name : ''));
}

/* --- trocar de aba -------------------------------------------------------- */
function showView(next) {
  if (next === view) return;
  if (view === 'code') absorbCode();

  view = next;
  $('#stage').hidden = next !== 'sprites';
  $('#codeview').hidden = next !== 'code';
  $('#emuview').hidden = next !== 'emu';
  if (next === 'emu') { emuResize(); if (!emuOn) attractStart(); }
  else attractStop();
  $$('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === next)));

  if (next === 'emu') {
    say(emuRom ? emuRomName + ' pronto — ligue o console' : 'compile um fonte para gerar o cartucho');
  } else if (next === 'code') {
    src().value = hasFile() ? buildFile() : buildCode();
    codeDirty = false;
    paintCode();
    if (hasFile() && FILE.sel >= 0) gotoLine(FILE.tables[FILE.sel].from + 1);
    else say(hasFile() ? 'editando ' + FILE.name : 'sem arquivo aberto — este é o bloco do sprite atual');
  } else {
    say(hasFile() ? FILE.name + ' — ' + FILE.tables.length + ' tabelas' : 'Pronto.');
  }
}

/* Relê o texto: vira FILE.lines de novo e as tabelas são reconstruídas. Os
   EDITS já estão dentro do texto, então somem daqui. */
function absorbCode() {
  if (!codeDirty || !hasFile()) { codeDirty = false; return; }
  const label = FILE.sel >= 0 ? FILE.tables[FILE.sel].label : null;
  const name = FILE.name;
  const eol = FILE.eol;

  parseAsm(src().value, name);
  FILE.eol = eol;
  FILE.saved = false;
  FILE.dirtyText = true;
  codeDirty = false;

  renderGallery();
  renderColors();
  const back = label ? FILE.tables.findIndex(t => t.label === label) : -1;
  if (back >= 0) selectTable(back);
  updateTitle();
  say('código relido — ' + FILE.tables.length + ' tabelas .byte');
}

/* --- ligações ------------------------------------------------------------- */
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) showView(b.dataset.view);
});

src().addEventListener('input', () => { codeDirty = true; paintCode(); });
src().addEventListener('scroll', syncScroll);
src().addEventListener('click', paintCode);
src().addEventListener('keyup', e => {
  if (/^(Arrow|Page|Home|End)/.test(e.key)) paintCode();
});

/* Tab indenta em vez de sair do campo */
src().addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.ctrlKey || e.altKey) return;
  e.preventDefault();
  const ta = e.target;
  const at = ta.selectionStart;
  ta.setRangeText('\t', at, ta.selectionEnd, 'end');
  codeDirty = true;
  paintCode();
});

$('#goLine').addEventListener('click', () => gotoLine(+$('#lineNo').value, true));
$('#lineNo').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); gotoLine(+e.target.value, true); }
});

$('#findNext').addEventListener('click', () => findInCode(1));
$('#find').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); findInCode(e.shiftKey ? -1 : 1); }
});

function findInCode(dir) {
  const q = $('#find').value;
  if (!q) return;
  const ta = src();
  const hay = ta.value.toLowerCase();
  const needle = q.toLowerCase();
  let at;
  if (dir > 0) {
    at = hay.indexOf(needle, ta.selectionEnd);
    if (at < 0) at = hay.indexOf(needle);
  } else {
    at = hay.lastIndexOf(needle, Math.max(0, ta.selectionStart - 1));
    if (at < 0) at = hay.lastIndexOf(needle);
  }
  if (at < 0) { say('“' + q + '” não aparece no fonte', 'error'); return; }
  ta.focus();
  ta.setSelectionRange(at, at + q.length);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 19;
  ta.scrollTop = Math.max(0, (lineAt(at) - 1) * lh - ta.clientHeight / 3);
  paintCode();
  say('“' + q + '” na linha ' + lineAt(at));
}

$('#toSprite').addEventListener('click', () => {
  absorbCode();
  const line = lineAt(src().selectionStart);
  const hit = FILE.tables.findIndex(t => line >= t.from + 1 && line <= t.to + 1);
  if (hit < 0) { say('o cursor não está dentro de uma tabela .byte', 'error'); return; }
  showView('sprites');
  selectTable(hit);
});

/* @embutido dasm.js em src-atari */
/* ==========================================================================
   DASM.js — montador 6502 compatível com o DASM, escrito para o TIA Sprite
   Bench. Roda no navegador: o editor compila sem precisar de ajudante externo.

   A tabela de opcodes (incluindo os não documentados) foi extraída do próprio
   DASM 2.20 assemblando todas as combinações mnemônico × modo, então o que
   sai daqui bate byte a byte com `dasm fonte.asm -f3`.

       const r = DASM.assemble({ name: 'jogo.asm', source: texto });
       r.ok      -> true/false
       r.rom     -> Uint8Array com a ROM (formato -f3, cru)
       r.problems-> [{ file, line, kind: 'error'|'warning', message }]
       r.log     -> texto no formato das mensagens do DASM

   vcs.h e macro.h vêm embutidos; `includes: { 'nome.h': texto }` substitui os
   embutidos ou acrescenta outros arquivos.
   ========================================================================== */

const DASM = (() => {
  'use strict';

  const VERSION     = '1.0';
  const MAX_PASSES  = 16;
  const FILLER      = 0xff;   // o que o DASM põe nos buracos deixados por ORG
  const MAX_INCLUDE = 24;     // profundidade de include/macro, contra recursão

  /* --- opcodes -------------------------------------------------------------
     Modos: imp acc imm zp zpx zpy abs abx aby ind izx izy rel. Os ilegais são
     exatamente os que o DASM aceita — nem um a mais, para que um fonte que ele
     recusa seja recusado aqui também.
     ------------------------------------------------------------------------ */
  const OPTABLE = `
adc imm=69 zp=65 zpx=75 abs=6d abx=7d aby=79 izx=61 izy=71
and imm=29 zp=25 zpx=35 abs=2d abx=3d aby=39 izx=21 izy=31
asl acc=0a zp=06 zpx=16 abs=0e abx=1e
bcc rel=90
bcs rel=b0
beq rel=f0
bit zp=24 abs=2c
bmi rel=30
bne rel=d0
bpl rel=10
brk imp=00
bvc rel=50
bvs rel=70
clc imp=18
cld imp=d8
cli imp=58
clv imp=b8
cmp imm=c9 zp=c5 zpx=d5 abs=cd abx=dd aby=d9 izx=c1 izy=d1
cpx imm=e0 zp=e4 abs=ec
cpy imm=c0 zp=c4 abs=cc
dec zp=c6 zpx=d6 abs=ce abx=de
dex imp=ca
dey imp=88
eor imm=49 zp=45 zpx=55 abs=4d abx=5d aby=59 izx=41 izy=51
inc zp=e6 zpx=f6 abs=ee abx=fe
inx imp=e8
iny imp=c8
jmp abs=4c ind=6c
jsr abs=20
lda imm=a9 zp=a5 zpx=b5 abs=ad abx=bd aby=b9 izx=a1 izy=b1
ldx imm=a2 zp=a6 zpy=b6 abs=ae aby=be
ldy imm=a0 zp=a4 zpx=b4 abs=ac abx=bc
lsr acc=4a zp=46 zpx=56 abs=4e abx=5e
nop imp=ea imm=80 zp=04 zpx=14 abs=0c abx=1c
ora imm=09 zp=05 zpx=15 abs=0d abx=1d aby=19 izx=01 izy=11
pha imp=48
php imp=08
pla imp=68
plp imp=28
rol acc=2a zp=26 zpx=36 abs=2e abx=3e
ror acc=6a zp=66 zpx=76 abs=6e abx=7e
rti imp=40
rts imp=60
sbc imm=e9 zp=e5 zpx=f5 abs=ed abx=fd aby=f9 izx=e1 izy=f1
sec imp=38
sed imp=f8
sei imp=78
sta zp=85 zpx=95 abs=8d abx=9d aby=99 izx=81 izy=91
stx zp=86 zpy=96 abs=8e
sty zp=84 zpx=94 abs=8c
tax imp=aa
tay imp=a8
tsx imp=ba
txa imp=8a
txs imp=9a
tya imp=98
anc imm=0b
ane imm=8b
arr imm=6b
asr imm=4b
dcp zp=c7 zpx=d7 abs=cf abx=df aby=db izx=c3 izy=d3
isb zp=e7 zpx=f7 abs=ef abx=ff aby=fb izx=e3 izy=f3
las aby=bb
lax zp=a7 zpy=b7 abs=af aby=bf izx=a3 izy=b3
lxa imm=ab
rla zp=27 zpx=37 abs=2f abx=3f aby=3b izx=23 izy=33
rra zp=67 zpx=77 abs=6f abx=7f aby=7b izx=63 izy=73
sax zp=87 zpy=97 abs=8f izx=83
sbx imm=cb
sha aby=9f izy=93
shs aby=9b
shx aby=9e
shy abx=9c
slo zp=07 zpx=17 abs=0f abx=1f aby=1b izx=03 izy=13
sre zp=47 zpx=57 abs=4f abx=5f aby=5b izx=43 izy=53
`;

  const OPS = Object.create(null);
  for (const row of OPTABLE.trim().split('\n')) {
    const part = row.trim().split(/\s+/);
    const modes = Object.create(null);
    for (let i = 1; i < part.length; i++) {
      const eq = part[i].indexOf('=');
      modes[part[i].slice(0, eq)] = parseInt(part[i].slice(eq + 1), 16);
    }
    OPS[part[0]] = modes;
  }

  const SIZE = { imp: 1, acc: 1, imm: 2, zp: 2, zpx: 2, zpy: 2, izx: 2, izy: 2,
                 rel: 2, abs: 3, abx: 3, aby: 3, ind: 3 };

  /* diretivas que consomem o rótulo como nome do símbolo, não como endereço */
  const NAMED = new Set(['equ', '=', 'set', 'eqm', 'mac', 'macro']);
  /* diretivas depois das quais o rótulo vale (o PC muda na própria linha) */
  const AFTER = new Set(['org', 'align', 'rorg']);

  const isSymStart = c => c >= 'A' && c <= 'Z' || c >= 'a' && c <= 'z' || c === '_' || c === '.';
  const isSymChar  = c => isSymStart(c) || c >= '0' && c <= '9';

  class AsmError extends Error {
    constructor(msg, soft) { super(msg); this.soft = !!soft; }
  }

  /* --- texto ---------------------------------------------------------------- */

  /* tira o comentário sem se enganar com ; dentro de "texto" ou de 'c */
  function stripComment(line) {
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === ';') return line.slice(0, i);
      if (c === '"') { i++; while (i < line.length && line[i] !== '"') i++; }
      else if (c === "'") { i++; if (line[i] === "'") i++; }   // 'c ou 'c'
    }
    return line;
  }

  /* quebra "a, b+1, (c,x)" em pedaços, respeitando parênteses e aspas */
  function splitArgs(text) {
    const out = [];
    let depth = 0, start = 0;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '(' || c === '[') depth++;
      else if (c === ')' || c === ']') depth--;
      else if (c === '"') { i++; while (i < text.length && text[i] !== '"') i++; }
      else if (c === "'") { i++; if (text[i] === "'") i++; }
      else if (c === ',' && depth === 0) { out.push(text.slice(start, i)); start = i + 1; }
    }
    out.push(text.slice(start));
    return out;
  }

  /* posição do ) que fecha o ( em `from`, ou -1 */
  function matchParen(text, from) {
    let depth = 0;
    for (let i = from; i < text.length; i++) {
      const c = text[i];
      if (c === '(') depth++;
      else if (c === ')') { if (--depth === 0) return i; }
      else if (c === '"') { i++; while (i < text.length && text[i] !== '"') i++; }
      else if (c === "'") { i++; if (text[i] === "'") i++; }
    }
    return -1;
  }

  /* o operando é imediato? o DASM procura o # em qualquer posição fora de aspas */
  function hasHash(text) {
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '#') return true;
      if (c === '"') { i++; while (i < text.length && text[i] !== '"') i++; }
      else if (c === "'") { i++; if (text[i] === "'") i++; }
    }
    return false;
  }

  /* 'x' / 'y' se o texto termina em ",x" ou ",y" fora de parênteses */
  function trailingIndex(text) {
    const parts = splitArgs(text);
    if (parts.length < 2) return null;
    const last = parts[parts.length - 1].trim().toLowerCase();
    return (last === 'x' || last === 'y') ? last : null;
  }

  function dropIndex(text) {
    const parts = splitArgs(text);
    parts.pop();
    return parts.join(',');
  }

  /* nome de arquivo do include, normalizado para busca */
  function baseKey(name) {
    return String(name).replace(/^["']|["']$/g, '').replace(/\\/g, '/').split('/').pop().toLowerCase();
  }

  function parseFile(name, text) {
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    const out = new Array(lines.length);
    for (let i = 0; i < lines.length; i++) out[i] = { text: lines[i], file: name, num: i + 1 };
    return out;
  }

  /* a diretiva de uma linha, só para achar ENDM/REPEND ao capturar blocos */
  function directiveOf(item) {
    let t = stripComment(item.text);
    if (!t.trim()) return '';
    if (!/^\s/.test(t)) t = t.replace(/^[^\s:=]+:?/, '');
    const m = /^\s+(\S+)/.exec(t);
    return m ? m[1].toLowerCase().replace(/^\./, '') : '';
  }

  /* ======================================================================== */
  /*  um pass                                                                 */
  /* ======================================================================== */

  function runPass(cfg) {
    const prev  = cfg.prev;              // símbolos dos passes anteriores
    const cur   = new Map();             // definidos neste pass
    const eqm   = new Map();             // símbolos textuais (EQM)
    const macros = new Map();
    const segs  = new Map();
    const conds = [];
    const stack = [];
    const problems = [];
    const echoes  = [];
    const listing = cfg.listing ? [] : null;

    const mem  = new Uint8Array(0x10000);
    const used = new Uint8Array(0x10000);
    let minA = -1, maxA = -1;
    let filler = FILLER;
    let scope = 0, nextScope = 1;
    let hard = 0, stop = false;
    let item = null;                     // linha em processamento (para erros)
    let lineBytes = null;                // bytes que a linha atual gerou, no listing
    let shown = '';                      // o texto dela já com os {1} do macro trocados

    let seg = getSeg('INITIAL CODE SEGMENT', false);

    /* --- diagnóstico ------------------------------------------------------ */
    function say(kind, msg, soft) {
      problems.push({
        file: item ? item.file : cfg.name,
        line: item ? item.num : 0,
        kind, message: msg,
      });
      if (kind === 'error' && !soft) hard++;
    }
    const warn = msg => say('warning', msg, true);

    /* --- símbolos --------------------------------------------------------- */
    const keyOf = nm => (nm.charCodeAt(0) === 46 ? scope + ' ' + nm : nm);

    function define(nm, value, kind) {
      const key = keyOf(nm);
      const had = cur.get(key);
      if (had && kind !== 'set' && had.kind !== 'set' && had.value !== value) {
        throw new AsmError('symbol already defined: ' + nm);
      }
      cur.set(key, { name: nm, key, value: value | 0, kind, local: nm[0] === '.' });
    }

    function lookup(nm) {
      const key = keyOf(nm);
      const c = cur.get(key);
      if (c) return { value: c.value, undef: false };
      if (prev.has(key)) return { value: prev.get(key), undef: false };
      return { value: 0, undef: true };
    }

    const defined = nm => cur.has(keyOf(nm)) || prev.has(keyOf(nm));

    /* --- segmentos e PC --------------------------------------------------- */
    function getSeg(name, uninit) {
      let s = segs.get(name);
      if (!s) {
        s = { name, pc: 0, rpc: null, uninit: !!uninit, started: false };
        segs.set(name, s);
      }
      return s;
    }

    const pc = () => (seg.rpc === null ? seg.pc : seg.rpc) & 0xffff;

    /* --- modo NES ---------------------------------------------------------

       O 2600 e simples: o cartucho e exatamente o que a CPU enxerga, entao
       montar e so preencher um pedaco do espaco de 64K. No NES nao da: o
       arquivo tem cabecalho na frente, os tiles atras, e dois bancos de PRG
       moram no mesmo $8000 -- gravar por endereco de CPU faria um sobrescrever
       o outro.

       Entao no modo NES o que anda e a posicao no arquivo, e o endereco de CPU
       vira so o que os rotulos enxergam (o rpc que o RORG ja usava). O ORG
       continua recebendo endereco de CPU, como a pessoa espera; quem traduz
       para posicao no arquivo e o banco escolhido.

       O alcance e o de um arquivo inteiro de ate 64K -- NROM, mapper 0, 16 ou
       32K de PRG mais 8K de CHR. E onde todo mundo comeca, e e o que cabe
       neste modelo sem mentir. */
    let nes = null;                    // { prg, chr, mapper, mirror, banco, tipo }

    const nesJanela = b =>
      nes.prg === 1 ? 0xc000 : (b === nes.prg - 1 ? 0xc000 : 0x8000 + b * 0x4000);

    /* endereco que a maquina ve -> posicao dele dentro do arquivo */
    function nesArquivo(addr) {
      if (nes.tipo === 'chr') {
        return 16 + nes.prg * 0x4000 + nes.banco * 0x2000 + (addr & 0x1fff);
      }
      return 16 + nes.banco * 0x4000 + ((addr - nesJanela(nes.banco)) & 0xffff);
    }

    function nesTamanho() { return 16 + nes.prg * 0x4000 + nes.chr * 0x2000; }

    function doInes(operand) {
      const opc = { prg: 1, chr: 1, mapper: 0, mirror: 'h' };
      for (const par of operand.split(/[\s,]+/)) {
        if (!par.trim()) continue;
        const m = /^\s*(\w+)\s*=\s*(.+?)\s*$/.exec(par);
        if (!m) throw new AsmError('INES: esperado nome=valor, veio «' + par.trim() + '»');
        const chave = m[1].toLowerCase();
        if (!(chave in opc)) {
          throw new AsmError('INES: não conheço «' + chave + '» (use prg, chr, mapper, mirror)');
        }
        opc[chave] = chave === 'mirror' ? m[2].trim().toLowerCase() : ev(m[2]).value;
      }
      if (opc.prg < 1 || opc.prg > 2) {
        throw new AsmError('INES: prg=' + opc.prg + ' — este montador cobre 1 ou 2 bancos de 16K');
      }
      if (opc.chr < 0 || opc.chr > 1) {
        throw new AsmError('INES: chr=' + opc.chr + ' — 0 (CHR-RAM) ou 1 banco de 8K');
      }
      if (!/^[hv]/.test(opc.mirror)) {
        throw new AsmError('INES: mirror=' + opc.mirror + ' — use h (horizontal) ou v (vertical)');
      }
      nes = { prg: opc.prg, chr: opc.chr, mapper: opc.mapper & 0xff,
              mirror: opc.mirror[0], banco: 0, tipo: 'prg' };
      seg.pc = 0;
      seg.rpc = null;
      /* O preenchimento padrao do DASM e $FF, que e o certo para EPROM apagada.
         Aqui nao serve: tile que ninguem escreveu ficaria todo aceso, e a
         galeria nasceria com 256 quadrados pintados. Zero e o que os montadores
         de NES usam. Um segundo argumento no ORG continua mandando mais. */
      filler = 0;
      const flags6 = ((nes.mapper & 0x0f) << 4) | (nes.mirror === 'v' ? 1 : 0);
      const cab = [0x4e, 0x45, 0x53, 0x1a, nes.prg, nes.chr, flags6, nes.mapper & 0xf0,
                   0, 0, 0, 0, 0, 0, 0, 0];
      for (const b of cab) emit(b);
    }

    function doBank(operand, tipo) {
      const nome = tipo === 'chr' ? 'CHRBANK' : 'BANK';
      if (!nes) throw new AsmError(nome + ': falta o INES antes');
      const b = ev(operand).value;
      const quantos = tipo === 'chr' ? nes.chr : nes.prg;
      if (b < 0 || b >= quantos) {
        throw new AsmError('banco ' + b + ' não existe: o cabeçalho declarou ' + quantos);
      }
      nes.tipo = tipo;
      nes.banco = b;
      seg.rpc = tipo === 'chr' ? 0 : nesJanela(b);
      seg.pc = nesArquivo(seg.rpc);
    }

    function step(n) {
      seg.pc = (seg.pc + n) & 0xffff;
      if (seg.rpc !== null) seg.rpc = (seg.rpc + n) & 0xffff;
    }

    function emit(byte) {
      if (lineBytes) lineBytes.push(byte & 0xff);
      if (!seg.uninit) {
        const a = seg.pc & 0xffff;
        mem[a] = byte & 0xff;
        used[a] = 1;
        if (minA < 0 || a < minA) minA = a;
        if (a > maxA) maxA = a;
        seg.started = true;
      }
      step(1);
    }

    /* --- expressões ------------------------------------------------------- */
    function evaluate(text, depth) {
      text = String(text == null ? '' : text);
      let i = 0, undef = false;

      const ws = () => { while (i < text.length && (text[i] === ' ' || text[i] === '\t')) i++; };
      const at = s => text.startsWith(s, i);

      function or()   { let a = and();  for (;;) { ws(); if (at('||')) { i += 2; const b = and();  a = (a || b) ? 1 : 0; } else return a; } }
      function and()  { let a = bor();  for (;;) { ws(); if (at('&&')) { i += 2; const b = bor();  a = (a && b) ? 1 : 0; } else return a; } }
      function bor()  { let a = bxor(); for (;;) { ws(); if (text[i] === '|' && text[i + 1] !== '|') { i++; a = a | bxor(); } else return a; } }
      function bxor() { let a = band(); for (;;) { ws(); if (text[i] === '^') { i++; a = a ^ band(); } else return a; } }
      function band() { let a = eq();   for (;;) { ws(); if (text[i] === '&' && text[i + 1] !== '&') { i++; a = a & eq(); } else return a; } }

      function eq() {
        let a = cmp();
        for (;;) {
          ws();
          if (at('==')) { i += 2; a = (a === cmp()) ? 1 : 0; }
          else if (at('!=')) { i += 2; a = (a !== cmp()) ? 1 : 0; }
          else if (text[i] === '=' && text[i + 1] !== '=') { i++; a = (a === cmp()) ? 1 : 0; }
          else return a;
        }
      }

      function cmp() {
        let a = shift();
        for (;;) {
          ws();
          if (at('<=')) { i += 2; a = (a <= shift()) ? 1 : 0; }
          else if (at('>=')) { i += 2; a = (a >= shift()) ? 1 : 0; }
          else if (text[i] === '<' && text[i + 1] !== '<') { i++; a = (a < shift()) ? 1 : 0; }
          else if (text[i] === '>' && text[i + 1] !== '>') { i++; a = (a > shift()) ? 1 : 0; }
          else return a;
        }
      }

      function shift() {
        let a = add();
        for (;;) {
          ws();
          if (at('<<')) { i += 2; a = a << add(); }
          else if (at('>>')) { i += 2; a = a >> add(); }
          else return a;
        }
      }

      function add() {
        let a = mul();
        for (;;) {
          ws();
          if (text[i] === '+') { i++; a = (a + mul()) | 0; }
          else if (text[i] === '-') { i++; a = (a - mul()) | 0; }
          else return a;
        }
      }

      function mul() {
        let a = unary();
        for (;;) {
          ws();
          if (text[i] === '*') { i++; a = Math.imul(a, unary()); }
          else if (text[i] === '/') { i++; const b = unary(); a = b === 0 ? 0 : (a / b) | 0; }
          else if (text[i] === '%') { i++; const b = unary(); a = b === 0 ? 0 : (a % b) | 0; }
          else return a;
        }
      }

      function unary() {
        ws();
        const c = text[i];
        if (c === '-') { i++; return (-unary()) | 0; }
        if (c === '+') { i++; return unary(); }
        if (c === '~') { i++; return ~unary(); }
        if (c === '!') { i++; return unary() ? 0 : 1; }
        if (c === '#') { i++; return unary(); }                 // o DASM ignora o # na expressão
        if (c === '<') { i++; return unary() & 0xff; }          // byte baixo
        if (c === '>') { i++; return (unary() >> 8) & 0xff; }   // byte alto
        return primary();
      }

      function primary() {
        ws();
        const c = text[i];
        if (c === undefined) throw new AsmError('expressão incompleta');
        if (c === '(' || c === '[') {
          const close = c === '(' ? ')' : ']';
          i++;
          const v = or();
          ws();
          if (text[i] !== close) throw new AsmError('faltou ' + close);
          i++;
          return v;
        }
        if (c === '$') {
          i++; const s = i;
          while (i < text.length && /[0-9a-fA-F]/.test(text[i])) i++;
          if (i === s) throw new AsmError('$ sem dígitos hexadecimais');
          return parseInt(text.slice(s, i), 16) | 0;
        }
        if (c === '%') {
          i++; const s = i;
          while (i < text.length && (text[i] === '0' || text[i] === '1')) i++;
          if (i === s) throw new AsmError('% sem dígitos binários');
          return parseInt(text.slice(s, i), 2) | 0;
        }
        if (c === "'") {
          i++;
          const ch = text.charCodeAt(i);
          if (isNaN(ch)) throw new AsmError("' sem caractere");
          i++;
          if (text[i] === "'") i++;
          return ch | 0;
        }
        if (c === '"') {
          i++; let v = 0, n = 0;
          while (i < text.length && text[i] !== '"') { v = (v << 8) | text.charCodeAt(i); i++; n++; }
          i++;
          if (!n) throw new AsmError('texto vazio na expressão');
          return v | 0;
        }
        if (c >= '0' && c <= '9') {
          const s = i;
          while (i < text.length && text[i] >= '0' && text[i] <= '9') i++;
          return parseInt(text.slice(s, i), 10) | 0;
        }
        if (c === '.' && !isSymChar(text[i + 1] || '')) { i++; return pc(); }
        if (c === '*') { i++; return pc(); }                    // * no início de termo é o PC
        if (isSymStart(c)) {
          const s = i;
          i++;
          while (i < text.length && isSymChar(text[i])) i++;
          const name = text.slice(s, i);
          if (eqm.has(keyOf(name))) {
            if ((depth || 0) > MAX_INCLUDE) throw new AsmError('EQM recursivo: ' + name);
            const r = evaluate(eqm.get(keyOf(name)), (depth || 0) + 1);
            if (r.undef) undef = true;
            return r.value;
          }
          const r = lookup(name);
          if (r.undef) undef = true;
          return r.value;
        }
        throw new AsmError('não entendi a expressão a partir de "' + text.slice(i) + '"');
      }

      const value = or();
      ws();
      if (i < text.length) throw new AsmError('sobrou "' + text.slice(i) + '" na expressão');
      return { value: value | 0, undef };
    }

    /* atalho: avalia e já reclama de símbolo indefinido no pass final */
    function ev(text, what) {
      const r = evaluate(text, 0);
      if (r.undef && cfg.final) say('error', 'symbol not resolved: ' + String(text).trim() + (what ? ' (' + what + ')' : ''), true);
      return r;
    }

    /* --- pilha de execução ------------------------------------------------- */
    function push(frame) {
      if (stack.length >= MAX_INCLUDE * 4) throw new AsmError('aninhamento demais (include/macro/repeat)');
      frame.i = frame.i || 0;
      frame.condDepth = conds.length;
      stack.push(frame);
    }

    function popFrame() {
      const f = stack.pop();
      if (f.kind === 'repeat' && ++f.done < f.count) { f.i = 0; stack.push(f); return; }
      if (f.scopeSave !== undefined) scope = f.scopeSave;
      if (f.condDepth !== undefined && conds.length > f.condDepth) conds.length = f.condDepth;
    }

    function unwindTo(kind) {
      while (stack.length) {
        const f = stack[stack.length - 1];
        if (f.kind === kind) { f.i = f.lines.length; if (f.kind === 'repeat') f.done = f.count; popFrame(); return true; }
        f.i = f.lines.length;
        if (f.kind === 'repeat') f.done = f.count;
        popFrame();
      }
      return false;
    }

    const active = () => conds.length === 0 || conds[conds.length - 1].on;

    /* --- captura de blocos (MAC…ENDM, REPEAT…REPEND) ----------------------- */
    function grab(frame, openers, closer) {
      const body = [];
      let depth = 1;
      while (frame.i < frame.lines.length) {
        const ln = frame.lines[frame.i++];
        const d = directiveOf(ln);
        if (openers.has(d)) depth++;
        else if (d === closer && --depth === 0) return body;
        body.push(ln);
      }
      throw new AsmError('bloco sem ' + closer.toUpperCase());
    }

    const MACOPEN = new Set(['mac', 'macro']);
    const REPOPEN = new Set(['repeat']);

    /* --- dados -------------------------------------------------------------- */
    function emitData(operand, unit) {
      // ".byte" sem operando reserva um item zerado (é assim que os fontes
      // declaram variáveis dentro de um SEG.U)
      if (!operand.trim()) { for (let b = 0; b < unit; b++) emit(0); return; }
      for (const raw of splitArgs(operand)) {
        const arg = raw.trim();
        if (!arg) continue;
        if (arg[0] === '"' && arg[arg.length - 1] === '"' && arg.length >= 2) {
          const s = arg.slice(1, -1);
          for (let k = 0; k < s.length; k++) {
            const ch = s.charCodeAt(k);
            emit(ch);
            for (let b = 1; b < unit; b++) emit(0);
          }
          continue;
        }
        const r = ev(arg);
        for (let b = 0; b < unit; b++) emit((r.value >> (8 * b)) & 0xff);
      }
    }

    function doDs(operand, unit) {
      const parts = splitArgs(operand);
      const count = ev(parts[0]).value;
      const fill = parts.length > 1 ? ev(parts[1]).value : 0;
      if (count < 0) throw new AsmError('DS com contagem negativa');
      if (seg.uninit) { step(count * unit); return; }
      for (let n = 0; n < count; n++) for (let b = 0; b < unit; b++) emit((fill >> (8 * b)) & 0xff);
    }

    function doOrg(operand) {
      const parts = splitArgs(operand);
      const target = ev(parts[0]).value & 0xffff;
      if (parts.length > 1) filler = ev(parts[1]).value & 0xff;

      /* no modo NES o ORG recebe endereco de CPU, mas quem anda e o arquivo */
      if (nes && !seg.uninit) {
        const destino = nesArquivo(target);
        const limite = nes.tipo === 'chr'
          ? 16 + nes.prg * 0x4000 + (nes.banco + 1) * 0x2000
          : 16 + (nes.banco + 1) * 0x4000;
        if (destino < 16 || destino > limite) {
          throw new AsmError('ORG $' + (target >>> 0).toString(16).toUpperCase() +
            ' cai fora do banco ' + nes.banco + ' — troque de banco antes');
        }
        if (seg.started && destino > seg.pc) {
          while (seg.pc < destino) emit(filler);      // o buraco vira preenchimento
        } else {
          seg.pc = destino;
        }
        seg.rpc = target;
        return;
      }

      if (!seg.uninit && seg.started && target > seg.pc) {
        while (seg.pc < target) emit(filler);
      } else {
        if (seg.rpc !== null) seg.rpc = (seg.rpc + (target - seg.pc)) & 0xffff;
        seg.pc = target & 0xffff;
      }
    }

    function doAlign(operand) {
      const parts = splitArgs(operand);
      const n = ev(parts[0]).value;
      const fill = parts.length > 1 ? ev(parts[1]).value & 0xff : 0;
      if (n <= 1) return;
      if (seg.uninit) { while (seg.pc % n) step(1); return; }
      while (seg.pc % n) emit(fill);
    }

    /* --- instruções --------------------------------------------------------- */
    function classify(operand) {
      const op = operand.trim();
      if (!op) return { k: 'empty' };
      if (hasHash(op)) return { k: 'imm', e: op };     // ldx (#N-1) também é imediato
      if (op[0] === '(') {
        const close = matchParen(op, 0);
        if (close > 0) {
          const inner = op.slice(1, close);
          const tail = op.slice(close + 1).replace(/\s+/g, '').toLowerCase();
          if (tail === '') {
            if (trailingIndex(inner) === 'x') return { k: 'izx', e: dropIndex(inner) };
            return { k: 'ind', e: inner };
          }
          if (tail === ',y') return { k: 'izy', e: inner };
          if (tail === ',x') return { k: 'izx', e: inner };
        }
      }
      const idx = trailingIndex(op);
      if (idx === 'x') return { k: 'idxX', e: dropIndex(op) };
      if (idx === 'y') return { k: 'idxY', e: dropIndex(op) };
      return { k: 'plain', e: op };
    }

    function doInstruction(word, operand) {
      let mne = word.toLowerCase(), force = 0;      // 0 automático, 1 zp, 2 abs
      const dot = mne.indexOf('.');
      if (dot > 0) {
        const suffix = mne.slice(dot + 1);
        mne = mne.slice(0, dot);
        const s = suffix[0];                       // o DASM só olha a 1a letra: LDA.wy
        if (s === 'b' || s === 'z') force = 1;
        else if (s === 'w' || s === 'a' || s === 'u') force = 2;
        else throw new AsmError('sufixo de tamanho desconhecido: .' + suffix);
      }
      const ops = OPS[mne];
      if (!ops) return false;

      const pick = (z, a, r) => {
        if (ops[z] === undefined) return a;
        if (ops[a] === undefined) return z;
        if (force === 1) return z;
        if (force === 2) return a;
        return (!r.undef && r.value >= 0 && r.value <= 0xff) ? z : a;
      };

      const c = classify(operand);
      let mode = null, r = { value: 0, undef: false };
      switch (c.k) {
        case 'empty': mode = ops.imp !== undefined ? 'imp' : (ops.acc !== undefined ? 'acc' : null); break;
        case 'imm':   mode = 'imm'; r = ev(c.e); break;
        case 'ind':   mode = 'ind'; r = ev(c.e); break;
        case 'izx':   mode = 'izx'; r = ev(c.e); break;
        case 'izy':   mode = 'izy'; r = ev(c.e); break;
        case 'idxX':  r = ev(c.e); mode = pick('zpx', 'abx', r); break;
        case 'idxY':  r = ev(c.e); mode = pick('zpy', 'aby', r); break;
        case 'plain':
          if (ops.rel !== undefined) { mode = 'rel'; r = ev(c.e); }
          else { r = ev(c.e); mode = pick('zp', 'abs', r); }
          break;
      }
      if (mode === null || ops[mode] === undefined) {
        throw new AsmError('illegal addressing mode: ' + mne + ' ' + operand);
      }

      emit(ops[mode]);
      if (mode === 'rel') {
        const delta = (r.value | 0) - ((pc() + 1) & 0xffff);
        if (cfg.final && !r.undef && (delta > 127 || delta < -128)) {
          say('error', 'branch out of range (' + delta + ' bytes)', true);
        }
        emit(delta & 0xff);
      } else if (SIZE[mode] === 2) {
        if (mode === 'imm' && cfg.final && !r.undef && (r.value > 255 || r.value < -255)) {
          say('error', "Value in '" + mne + ' ' + operand + "' must be <$100", true);
        }
        emit(r.value & 0xff);
      } else if (SIZE[mode] === 3) {
        emit(r.value & 0xff);
        emit((r.value >> 8) & 0xff);
      }
      return true;
    }

    /* --- uma linha ---------------------------------------------------------- */
    function processLine(frame) {
      let text = stripComment(item.text);
      if (frame.args) {
        const subst = s => s.replace(/\{(\d+)\}/g, (m, d) => {
          const n = +d;
          if (n === 0) return String(frame.args.length);
          return frame.args[n - 1] !== undefined ? frame.args[n - 1] : '';
        });
        text = subst(text);
        shown = subst(item.text);      // no listing, a linha do macro sai expandida
      }
      if (!text.trim()) return;

      let label = '', rest;
      if (/^\s/.test(text)) {
        rest = text.trim();
      } else {
        const m = /^([^\s:=]+):?\s*/.exec(text);
        label = m[1];
        rest = text.slice(m[0].length).trim();
      }

      let word = '', operand = '';
      if (rest) {
        if (rest[0] === '=') { word = '='; operand = rest.slice(1).trim(); }
        else {
          const m = /^(\S+)\s*([\s\S]*)$/.exec(rest);
          word = m[1];
          operand = m[2].trim();
        }
      }
      const dir = word.toLowerCase().replace(/^\./, '');

      /* condicionais: sempre processadas, para o aninhamento não se perder */
      if (dir === 'if' || dir === 'ifconst' || dir === 'ifnconst') {
        const parentOn = active();
        let on = false;
        if (parentOn) {
          if (dir === 'if') on = ev(operand, 'IF').value !== 0;
          else {
            const nm = operand.trim().replace(/^["']|["']$/g, '');
            on = defined(nm);
            if (dir === 'ifnconst') on = !on;
          }
        }
        conds.push({ parentOn, on, taken: on });
        return;
      }
      if (dir === 'else') {
        const c = conds[conds.length - 1];
        if (!c) throw new AsmError('ELSE sem IF');
        c.on = c.parentOn && !c.taken;
        c.taken = c.taken || c.on;
        return;
      }
      if (dir === 'endif' || dir === 'eif') {
        if (!conds.length) throw new AsmError('ENDIF sem IF');
        conds.pop();
        return;
      }
      if (!active()) return;

      /* blocos */
      if (MACOPEN.has(dir)) {
        const name = (operand || label).trim().toLowerCase();
        if (!name) throw new AsmError('MAC sem nome');
        macros.set(name, grab(frame, MACOPEN, 'endm'));
        return;
      }
      if (dir === 'endm') return;                       // ENDM solto: ignora
      if (dir === 'mexit') { unwindTo('macro'); return; }
      if (dir === 'repeat') {
        const n = ev(operand, 'REPEAT').value;
        const body = grab(frame, REPOPEN, 'repend');
        if (n > 0) push({ kind: 'repeat', lines: body, done: 0, count: n, args: frame.args });
        return;
      }
      if (dir === 'repend') return;

      /* símbolos nomeados */
      if (NAMED.has(dir)) {
        if (!label) throw new AsmError(word.toUpperCase() + ' sem rótulo');
        if (dir === 'eqm') {
          eqm.set(keyOf(label), operand);
          // o DASM ainda lista o nome na tabela de símbolos, valendo zero — o
          // texto é expandido na hora do uso, não aqui
          define(label, 0, 'set');
          return;
        }
        const r = ev(operand, label);
        define(label, r.value, dir === 'set' ? 'set' : 'equ');
        return;
      }

      if (label && !AFTER.has(dir)) define(label, pc(), 'label');

      switch (dir) {
        case '':          break;                        // linha só com rótulo
        case 'processor': break;
        case 'incdir':    break;
        case 'list':      break;
        case 'trace':     break;
        case 'subroutine': scope = nextScope++; break;

        case 'seg':
        case 'seg.u': {
          const name = operand.trim() || 'INITIAL CODE SEGMENT';
          seg = getSeg(name, dir === 'seg.u');
          if (dir === 'seg.u') seg.uninit = true;
          break;
        }

        case 'ines':     doInes(operand); break;
        case 'bank':     doBank(operand, 'prg'); break;
        case 'chrbank':  doBank(operand, 'chr'); break;

        case 'org':   doOrg(operand); break;
        case 'rorg':  seg.rpc = ev(operand, 'RORG').value & 0xffff; break;
        case 'rend':  seg.rpc = null; break;
        case 'align': doAlign(operand); break;

        case 'dc': case 'dc.b': case 'byte': emitData(operand, 1); break;
        case 'dc.w': case 'word':            emitData(operand, 2); break;
        case 'dc.l': case 'long':            emitData(operand, 4); break;
        case 'ds': case 'ds.b': doDs(operand, 1); break;
        case 'ds.w':            doDs(operand, 2); break;
        case 'ds.l':            doDs(operand, 4); break;

        case 'hex':
          for (const tok of operand.split(/[\s,]+/)) {
            if (!tok) continue;
            if (!/^[0-9a-fA-F]+$/.test(tok) || tok.length % 2) throw new AsmError('HEX inválido: ' + tok);
            for (let k = 0; k < tok.length; k += 2) emit(parseInt(tok.substr(k, 2), 16));
          }
          break;

        case 'incbin': {
          const key = baseKey(operand);
          const data = cfg.binaries[key];
          if (!data) throw new AsmError('INCBIN: não achei ' + operand.trim());
          for (let k = 0; k < data.length; k++) emit(data[k]);
          break;
        }

        case 'include': {
          const key = baseKey(operand);
          const text2 = cfg.includes[key];
          if (text2 === undefined) {
            const have = Object.keys(cfg.includes).join(', ') || 'nenhum';
            throw new AsmError('include: não achei "' + key + '" (tenho: ' + have + ')');
          }
          push({ kind: 'file', lines: parseFile(key, text2) });
          break;
        }

        case 'echo':
          echoes.push(splitArgs(operand).map(a => {
            const t = a.trim();
            if (t[0] === '"' && t[t.length - 1] === '"') return t.slice(1, -1);
            const r = evaluate(t, 0);
            return r.undef ? t : String(r.value);
          }).join(' '));
          break;

        case 'err':
          say('error', 'ERR pseudo-op encountered, aborting assembly');
          stop = true;
          break;

        case 'end':
          stop = true;
          break;

        default: {
          const body = macros.get(dir) || macros.get(word.toLowerCase());
          if (body) {
            const args = operand ? splitArgs(operand).map(a => a.trim()) : [];
            push({ kind: 'macro', lines: body, args, scopeSave: scope });
            scope = nextScope++;
            break;
          }
          if (!doInstruction(word, operand)) throw new AsmError('unknown mnemonic: ' + word);
        }
      }

      if (label && AFTER.has(dir)) define(label, pc(), 'label');
    }

    /* --- roda ---------------------------------------------------------------- */
    for (const name of Object.keys(cfg.defines)) {
      try {
        const r = evaluate(String(cfg.defines[name]), 0);
        cur.set(name, { name, value: r.value, kind: 'equ', local: false });
      } catch (err) {
        say('error', '-D ' + name + ': ' + err.message);
      }
    }

    push({ kind: 'file', lines: parseFile(cfg.name, cfg.source) });
    while (stack.length && !stop) {
      const f = stack[stack.length - 1];
      if (f.i >= f.lines.length) { popFrame(); continue; }
      item = f.lines[f.i++];
      let addr0 = 0, uninit0 = false;
      if (listing) { lineBytes = []; shown = item.text; addr0 = pc(); uninit0 = seg.uninit; }
      try {
        processLine(f);
      } catch (err) {
        if (!(err instanceof AsmError)) throw err;
        say('error', err.message, err.soft);
        if (hard > 40) break;
      }
      if (listing) {
        // linha que gerou bytes mostra onde eles começam; linha que só mexeu no
        // PC (ORG, ALIGN) mostra onde ele parou, como no listing do DASM
        listing.push({ file: item.file, num: item.num, uninit: uninit0,
                       addr: lineBytes.length ? addr0 : pc(),
                       bytes: lineBytes, text: shown });
        lineBytes = null;
      }
    }
    item = null;
    if (conds.length) say('error', 'IF sem ENDIF (' + conds.length + ' aberto(s))');

    /* --- resultado ----------------------------------------------------------- */
    let rom = new Uint8Array(0);
    if (nes) {
      /* o .nes tem tamanho declarado no proprio cabecalho: o que a pessoa nao
         escreveu sai preenchido, senao o arquivo nasce truncado */
      rom = new Uint8Array(nesTamanho());
      rom.fill(filler);
      for (let a = 0; a < rom.length; a++) if (used[a]) rom[a] = mem[a];
      minA = 0;
    } else if (minA >= 0) {
      rom = new Uint8Array(maxA - minA + 1);
      for (let a = minA; a <= maxA; a++) rom[a - minA] = used[a] ? mem[a] : filler;
    }

    const table = new Map(prev);
    for (const [k, s] of cur) table.set(k, s.value);

    return { rom, origin: minA < 0 ? 0 : minA, table, cur, problems, echoes, listing, hard };
  }

  /* ======================================================================== */
  /*  API                                                                     */
  /* ======================================================================== */

  function signature(st) {
    const keys = [...st.table.keys()].sort();
    let h = 0x811c9dc5;
    const mix = n => { h = Math.imul(h ^ (n & 0xff), 0x01000193); h = Math.imul(h ^ ((n >> 8) & 0xff), 0x01000193); };
    for (const k of keys) { for (let i = 0; i < k.length; i++) mix(k.charCodeAt(i)); mix(st.table.get(k)); mix(st.table.get(k) >> 16); }
    mix(st.rom.length); mix(st.rom.length >> 16); mix(st.origin);
    for (let i = 0; i < st.rom.length; i++) mix(st.rom[i]);
    return h >>> 0;
  }

  function assemble(opts) {
    opts = opts || {};
    const name = opts.name || 'source.asm';
    const source = opts.source == null ? '' : String(opts.source);

    const includes = Object.create(null);
    for (const k of Object.keys(BUILTIN)) includes[k] = BUILTIN[k];
    const extra = opts.includes || {};
    for (const k of Object.keys(extra)) includes[baseKey(k)] = String(extra[k]);

    const binaries = Object.create(null);
    const bins = opts.binaries || {};
    for (const k of Object.keys(bins)) binaries[baseKey(k)] = bins[k];

    const defines = Object.create(null);
    const given = opts.defines || {};
    for (const k of Object.keys(given)) defines[k] = given[k] === true ? 1 : given[k];

    const base = { name, source, includes, binaries, defines, listing: false, final: false };
    let prev = new Map(), sig = null, st = null, passes = 0;

    try {
      for (let p = 1; p <= MAX_PASSES; p++) {
        st = runPass(Object.assign({}, base, { prev, final: false }));
        passes = p;
        prev = st.table;
        if (st.hard) break;
        const s = signature(st);
        if (p >= 2 && s === sig) break;
        sig = s;
      }
      if (!st.hard) {
        st = runPass(Object.assign({}, base, { prev, final: true, listing: !!opts.listing }));
        passes++;
      }
    } catch (err) {
      return {
        ok: false, rom: new Uint8Array(0), size: 0, origin: 0, passes,
        problems: [{ file: name, line: 0, kind: 'error', message: 'falha interna do montador: ' + err.message }],
        log: 'falha interna do montador: ' + err.message,
        symbols: [], echoes: [],
      };
    }

    const problems = st.problems;
    const errors = problems.filter(p => p.kind === 'error');
    const ok = errors.length === 0 && st.rom.length > 0;

    const lines = [];
    for (const e of st.echoes) lines.push(e);
    for (const p of problems) lines.push(p.file + ' (' + p.line + '): ' + p.kind + ': ' + p.message + '.');
    if (errors.length) lines.push('', 'Unrecoverable error(s) in pass, aborting assembly!');
    else if (!st.rom.length) lines.push('nenhum byte gerado — o fonte tem ORG e código?');
    else lines.push('Complete. (' + passes + ' passes, ' + st.rom.length + ' bytes)');

    // tabela acumulada dos passes: um IFNCONST só define o símbolo no primeiro,
    // e ele continua valendo depois. Rótulo local sai qualificado pelo escopo,
    // como no .sym do DASM: 3.loop
    const symbols = [];
    for (const [key, value] of st.table) {
      const m = /^(\d+) (\..+)$/.exec(key);
      symbols.push({ name: m ? m[1] + m[2] : key, value, local: !!m });
    }
    symbols.sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));

    return {
      ok,
      rom: st.rom,
      size: st.rom.length,
      origin: st.origin,
      passes,
      problems,
      symbols,
      echoes: st.echoes,
      listing: st.listing,
      log: lines.join('\n'),
    };
  }

  /* --- os dois arquivos que o DASM deixa ao lado da ROM --------------------- */

  const hex = (v, n) => (v >>> 0).toString(16).padStart(n, '0');

  /* o listing: linha, endereço, bytes gerados e o fonte. Endereço com U na
     frente é de segmento não inicializado, e * diz que a linha gerou mais bytes
     do que cabe na coluna — mesma convenção do -l do DASM. */
  function listingText(res) {
    if (!res.listing) return '';
    const out = [];
    let file = null;
    for (const l of res.listing) {
      if (l.file !== file) {
        file = l.file;
        out.push('------- FILE ' + file);
      }
      const bytes = l.bytes.slice(0, 4).map(b => hex(b, 2)).join(' ') + (l.bytes.length > 4 ? '*' : '');
      out.push(String(l.num).padStart(6) + '  ' + (l.uninit ? 'U' : ' ') + hex(l.addr, 4) +
               '  ' + bytes.padEnd(13) + l.text);
    }
    return out.join('\n') + '\n';
  }

  /* a tabela de símbolos, no formato do -s do DASM */
  function symbolText(res) {
    const out = ['--- Symbol List (sorted by symbol)'];
    for (const s of res.symbols) {
      out.push(s.name.padEnd(24) + ' ' + hex(s.value, 4) + '         (R )');
    }
    out.push('--- End of Symbol List.');
    return out.join('\n') + '\n';
  }

/* ==========================================================================
   VCS — o nucleo de Atari 2600 do Editor Emulador Atari.

   Núcleo próprio: CPU 6507 (6502 sem os pinos de endereço altos), TIA e RIOT
   6532, mais cartucho 2K/4K/F8/F6/E0/FE. Escrito olhando a documentação de
   hardware do 2600 e o comportamento do Javatari como referência, mas sem
   reaproveitar código dele (Javatari é AGPL).

   O relógio mestre é o color clock: 1 ciclo de CPU = 3 color clocks, uma
   scanline = 228 color clocks (68 de HBLANK + 160 visíveis).

       const vcs = VCS.create({ palette });   // paleta NTSC em 0xRRGGBB
       vcs.load(uint8ArrayComOFonteCompilado);
       vcs.frame();                           // roda um quadro
       vcs.pixels                             // Uint32Array 160 x LINES, ABGR
   ========================================================================== */

const VCS = (() => {
  'use strict';

  const CLOCKS_PER_LINE = 228;
  const HBLANK = 68;
  const WIDTH = 160;
  const LINES = 240;             // o que guardamos por quadro depois do VSYNC
  const AUDIO_RATE = 31400;      // 3.579545 MHz / 114
  const CLOCKS_PER_AUDIO = 114;

  /* --- escritas na TIA ---------------------------------------------------- */
  const VSYNC = 0x00, VBLANK = 0x01, WSYNC = 0x02, RSYNC = 0x03,
        NUSIZ0 = 0x04, NUSIZ1 = 0x05, COLUP0 = 0x06, COLUP1 = 0x07,
        COLUPF = 0x08, COLUBK = 0x09, CTRLPF = 0x0a, REFP0 = 0x0b, REFP1 = 0x0c,
        PF0 = 0x0d, PF1 = 0x0e, PF2 = 0x0f, RESP0 = 0x10, RESP1 = 0x11,
        RESM0 = 0x12, RESM1 = 0x13, RESBL = 0x14, AUDC0 = 0x15, AUDC1 = 0x16,
        AUDF0 = 0x17, AUDF1 = 0x18, AUDV0 = 0x19, AUDV1 = 0x1a,
        GRP0 = 0x1b, GRP1 = 0x1c, ENAM0 = 0x1d, ENAM1 = 0x1e, ENABL = 0x1f,
        HMP0 = 0x20, HMP1 = 0x21, HMM0 = 0x22, HMM1 = 0x23, HMBL = 0x24,
        VDELP0 = 0x25, VDELP1 = 0x26, VDELBL = 0x27, RESMP0 = 0x28,
        RESMP1 = 0x29, HMOVE = 0x2a, HMCLR = 0x2b, CXCLR = 0x2c;

  /* NUSIZ: deslocamento de cada cópia e a escala do jogador */
  const COPIES = [[0], [0, 16], [0, 32], [0, 16, 32], [0, 64], [0], [0, 32, 64], [0]];
  const PLAYER_SCALE = [1, 1, 1, 1, 1, 2, 1, 4];

  function create(opts) {
    opts = opts || {};
    const palette = opts.palette || new Uint32Array(128);

    /* =====================================================================
       Memória e cartucho
       ===================================================================== */
    const ram = new Uint8Array(128);
    let rom = new Uint8Array(4096);
    let romMask = 0x0fff;
    let banking = 'flat';        // flat | F8 | F6 | F4 | E0 | FE | F8SC
    let bank = 0;                // banco corrente (offset em bytes)
    let bankCount = 1;
    let extraRam = null;         // superchip
    let e0Slice = [0, 0, 0, 7];  // E0: quatro fatias de 1K

    function loadROM(bytes) {
      const n = bytes.length;
      rom = new Uint8Array(bytes);
      extraRam = null;
      bank = 0;
      if (n <= 2048) {
        banking = 'flat';
        romMask = n - 1;
        bankCount = 1;

        banking = 'flat';
        romMask = 0x0fff;
        bankCount = 1;
      } else if (n === 8192) {
        banking = 'F8';
        romMask = 0x0fff;
        bankCount = 2;
        bank = 4096;             // F8 liga no banco 1
      } else if (n === 12288) {
        banking = 'FE';
        romMask = 0x0fff;
        bankCount = 3;
      } else if (n === 16384) {
        banking = 'F6';
        romMask = 0x0fff;
        bankCount = 4;
      } else if (n === 32768) {
        banking = 'F4';
        romMask = 0x0fff;
        bankCount = 8;
      } else {
        banking = 'flat';
        romMask = (1 << Math.ceil(Math.log2(Math.max(n, 2)))) - 1;
        bankCount = 1;
      }

    }

    function cartRead(a) {
      const off = a & 0x0fff;

        const slice = e0Slice[off >> 10];

      if (extraRam) {
        if (off < 0x80) { extraRam[off] = 0; return 0; }        // janela de escrita

      const off = a & 0x0fff;

    }

    function cartHotspot(off) {

        case 'F8': if (off === 0xff8) bank = 0; else if (off === 0xff9) bank = 4096; break;
        case 'F6': if (off >= 0xff6 && off <= 0xff9) bank = (off - 0xff6) * 4096; break;

       RIOT 6532 — RAM já está acima; aqui o timer e as portas
       ===================================================================== */
    let timerValue = 0, timerInterval = 1024, timerCount = 0, timerFlag = 0;
    let swcha = 0xff, swchb = 0x3f, swacnt = 0, swbcnt = 0;

    function riotTick() {
      if (timerCount > 0) {
        timerCount--;
      } else {
        timerCount = timerInterval - 1;
        if (timerValue > 0) {
          timerValue--;
        } else {
          timerValue = 0xff;
          timerFlag = 0x80;
          timerInterval = 1;      // depois de estourar, conta de 1 em 1
        }

    }

    function riotRead(a) {
      switch (a & 7) {
        case 0: return swcha & ~swacnt | (0xff & swacnt);
        case 1: return swacnt;
        case 2: return swchb & ~swbcnt | (0xff & swbcnt);
        case 3: return swbcnt;
        case 4: case 6: timerFlag = 0; return timerValue;
        case 5: case 7: { const f = timerFlag; timerFlag = 0; return f; }

    }

    function riotWrite(a, v) {
      const r = a & 0x1f;
      if (r === 0x01) { swacnt = v; return; }
      if (r === 0x03) { swbcnt = v; return; }
      if (r >= 0x14 && r <= 0x17) {

    /* =====================================================================
       TIA
       ===================================================================== */
    const pixels = new Uint32Array(WIDTH * LINES);
    let clock = 0;               // 0..227 dentro da scanline
    let line = 0;                // linha desde o fim do VSYNC
    let frameDone = false;

    let vsync = 0, vblank = 0;
    let colup0 = 0, colup1 = 0, colupf = 0, colubk = 0;
    let ctrlpf = 0, refp0 = 0, refp1 = 0;
    let pf0 = 0, pf1 = 0, pf2 = 0, pfBits = 0;
    let nusiz0 = 0, nusiz1 = 0;
    let grp0 = 0, grp1 = 0, grp0d = 0, grp1d = 0;    // d = cópia atrasada (VDEL)
    let vdelp0 = 0, vdelp1 = 0, vdelbl = 0;
    let enam0 = 0, enam1 = 0, enabl = 0, enabld = 0;
    let resmp0 = 0, resmp1 = 0;
    let p0pos = 0, p1pos = 0, m0pos = 0, m1pos = 0, blpos = 0;
    let hmp0 = 0, hmp1 = 0, hmm0 = 0, hmm1 = 0, hmbl = 0;
    let collision = new Uint8Array(8);
    let inpt = new Uint8Array(6);    // INPT0..5, bit 7
    let wsyncHalt = false;

    function rebuildPF() {
      // 20 bits da metade esquerda: PF0 bits 4..7, PF1 bits 7..0, PF2 bits 0..7
      let b = 0;
      for (let i = 0; i < 4; i++) if (pf0 & (0x10 << i)) b |= 1 << i;
      for (let i = 0; i < 8; i++) if (pf1 & (0x80 >> i)) b |= 1 << (4 + i);
      for (let i = 0; i < 8; i++) if (pf2 & (1 << i)) b |= 1 << (12 + i);

    }

    const signedHM = v => { const s = (v >> 4) & 0x0f; return s > 7 ? s - 16 : s; };
    const wrap = p => ((p % WIDTH) + WIDTH) % WIDTH;

    function resetPos(current) {
      // RESPx durante o HBLANK encosta o objeto na borda; depois disso vale a
      // posição do feixe mais o atraso do pipeline
      return clock < HBLANK ? 3 : wrap(clock - HBLANK + 5);

    function applyHMOVE() {
      p0pos = wrap(p0pos - signedHM(hmp0));
      p1pos = wrap(p1pos - signedHM(hmp1));
      m0pos = wrap(m0pos - signedHM(hmm0));
      m1pos = wrap(m1pos - signedHM(hmm1));

    function tiaWrite(reg, v) {

        case VSYNC:

        case RSYNC: clock = 0; break;
        case NUSIZ0: nusiz0 = v; break;
        case NUSIZ1: nusiz1 = v; break;
        case COLUP0: colup0 = v & 0xfe; break;
        case COLUP1: colup1 = v & 0xfe; break;
        case COLUPF: colupf = v & 0xfe; break;
        case COLUBK: colubk = v & 0xfe; break;
        case CTRLPF: ctrlpf = v; break;
        case REFP0: refp0 = v & 8; break;
        case REFP1: refp1 = v & 8; break;

        case PF1: pf1 = v; rebuildPF(); break;
        case PF2: pf2 = v; rebuildPF(); break;

        case RESP1: p1pos = resetPos(); break;
        case RESM0: m0pos = resetPos(); break;
        case RESM1: m1pos = resetPos(); break;
        case RESBL: blpos = resetPos(); break;
        case AUDC0: aud[0].c = v & 0x0f; break;
        case AUDC1: aud[1].c = v & 0x0f; break;
        case AUDF0: aud[0].f = v & 0x1f; break;
        case AUDF1: aud[1].f = v & 0x1f; break;
        case AUDV0: aud[0].v = v & 0x0f; break;
        case AUDV1: aud[1].v = v & 0x0f; break;
        case GRP0: grp0 = v; grp1d = grp1; break;    // escrever GRP0 transfere GRP1
        case GRP1: grp1 = v; grp0d = grp0; enabld = enabl; break;
        case ENAM0: enam0 = v & 2; break;
        case ENAM1: enam1 = v & 2; break;
        case ENABL: enabl = v & 2; break;
        case HMP0: hmp0 = v; break;
        case HMP1: hmp1 = v; break;
        case HMM0: hmm0 = v; break;
        case HMM1: hmm1 = v; break;
        case HMBL: hmbl = v; break;
        case VDELP0: vdelp0 = v & 1; break;
        case VDELP1: vdelp1 = v & 1; break;
        case VDELBL: vdelbl = v & 1; break;
        case RESMP0: resmp0 = v & 2; break;
        case RESMP1: resmp1 = v & 2; break;
        case HMOVE: applyHMOVE(); break;
        case HMCLR: hmp0 = hmp1 = hmm0 = hmm1 = hmbl = 0; break;

    function tiaRead(a) {
      const r = a & 0x0f;
      if (r < 8) return collision[r];
      if (r < 14) return inpt[r - 8];

    function playerBit(gr, pos, nusiz, refl, x) {
      const scale = PLAYER_SCALE[nusiz & 7];
      const copies = COPIES[nusiz & 7];
      for (let i = 0; i < copies.length; i++) {
        const d = wrap(x - pos - copies[i]);

      if (p1 && pf) collision[3] |= 0x80;

      if (m0 && bl) collision[4] |= 0x40;
      if (m1 && pf) collision[5] |= 0x80;
      if (m1 && bl) collision[5] |= 0x40;
      if (bl && pf) collision[6] |= 0x80;
      if (p0 && p1) collision[7] |= 0x80;
      if (m0 && m1) collision[7] |= 0x40;

      const pfColor = (ctrlpf & 2) ? (half ? colup0 : colup1) : colupf;   // modo score

        if (p0 || m0) return colup0;
        if (p1 || m1) return colup1;
      } else {
        if (p0 || m0) return colup0;
        if (p1 || m1) return colup1;

    }

    /* --- áudio ------------------------------------------------------------ */
    const aud = [
      { c: 0, f: 0, v: 0, div: 0, p4: 1, p5: 1, p9: 1, out: 1, d31: 0, d6: 0, o6: 1 },
      { c: 0, f: 0, v: 0, div: 0, p4: 1, p5: 1, p9: 1, out: 1, d31: 0, d6: 0, o6: 1 },

    let audioLen = 0;
    let audioClock = 0;

    function poly4(ch) { const b = ((ch.p4 ^ (ch.p4 >> 1)) & 1); ch.p4 = (ch.p4 >> 1) | (b << 3); return ch.p4 & 1; }
    function poly5(ch) { const b = ((ch.p5 ^ (ch.p5 >> 2)) & 1); ch.p5 = (ch.p5 >> 1) | (b << 4); return ch.p5 & 1; }

      if (++ch.d6 >= 3) { ch.d6 = 0; tick6 = true; }

        case 0x0: case 0xb: ch.out = 1; break;

        case 0x3: if (poly5(ch)) ch.out = poly4(ch); break;
        case 0x4: case 0x5: ch.out ^= 1; break;
        case 0x6: case 0xa: if (tick31) ch.out ^= 1; break;
        case 0x7: case 0x9: ch.out = poly5(ch); break;
        case 0x8: ch.out = poly9(ch); break;

      // caminho — durante a CPU e durante a parada do WSYNC

    }

    /* =====================================================================
       Barramento
       ===================================================================== */
    function busRead(a) {
      a &= 0x1fff;
      if (a & 0x1000) return cartRead(a);
      if ((a & 0x80) === 0) return tiaRead(a);
      if (a & 0x200) return riotRead(a);

    function busWrite(a, v) {
      a &= 0x1fff;

       CPU 6507
       ===================================================================== */

      // corre. A espera é aqui, ANTES dos três color clocks deste ciclo: o
      // ciclo que reacorda a CPU ainda tem que acontecer inteiro depois da
      // linha virar. Cobrar os três clocks antes da espera adiantava tudo em um
      // ciclo, e aí a rotina clássica de posicionar (WSYNC, laço de -15, RESPx,
      // HMOVE) escrevia o RESPx cedo demais no primeiro bloco: o objeto saltava
      // uns pixels para trás a cada 15 colunas de movimento.
      if (wsyncHalt) {
        while (clock !== 0) tiaTick();
        wsyncHalt = false;
      }
      tiaTick(); tiaTick(); tiaTick();

    const wr = (a, v) => { tick(); busWrite(a, v); };

    const unpackP = p => { fN = (p >> 7) & 1; fV = (p >> 6) & 1; fD = (p >> 3) & 1; fI = (p >> 2) & 1; fZ = (p >> 1) & 1; fC = p & 1; };

    const push = v => { wr(0x100 | S, v); S = (S - 1) & 0xff; };
    const pull = () => { S = (S + 1) & 0xff; return rd(0x100 | S); };

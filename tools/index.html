    const aImm = () => PC++;
    const aZp = () => rd(PC++);
    const aZpX = () => { const z = rd(PC++); tick(); return (z + X) & 0xff; };
    const aZpY = () => { const z = rd(PC++); tick(); return (z + Y) & 0xff; };
    const aAbs = () => { const lo = rd(PC++), hi = rd(PC++); return lo | (hi << 8); };
    const aAbsX = w => { const lo = rd(PC++), hi = rd(PC++); const b = lo | (hi << 8);
                         const a = (b + X) & 0xffff; if (w || ((b ^ a) & 0xff00)) tick(); return a; };
    const aAbsY = w => { const lo = rd(PC++), hi = rd(PC++); const b = lo | (hi << 8);
                         const a = (b + Y) & 0xffff; if (w || ((b ^ a) & 0xff00)) tick(); return a; };
    const aIndX = () => { const z = rd(PC++); tick(); const p = (z + X) & 0xff;
                          return rd(p) | (rd((p + 1) & 0xff) << 8); };
    const aIndY = w => { const z = rd(PC++); const b = rd(z) | (rd((z + 1) & 0xff) << 8);
                         const a = (b + Y) & 0xffff; if (w || ((b ^ a) & 0xff00)) tick(); return a; };

    function branch(take) {
      const off = rd(PC++);
      if (!take) return;
      tick();
      const t = (PC + (off < 0x80 ? off : off - 256)) & 0xffff;
      if ((t ^ PC) & 0xff00) tick();
      PC = t;
    }

    function adc(v) {
      if (fD) {
        let lo = (A & 0x0f) + (v & 0x0f) + fC;
        let hi = (A >> 4) + (v >> 4);
        if (lo > 9) { lo += 6; hi++; }
        fZ = ((A + v + fC) & 0xff) === 0 ? 1 : 0;
        fN = (hi >> 3) & 1;
        fV = 0;
        if (hi > 9) hi += 6;
        fC = hi > 15 ? 1 : 0;
        A = ((hi << 4) | (lo & 0x0f)) & 0xff;
      } else {
        const r = A + v + fC;
        fV = (~(A ^ v) & (A ^ r) & 0x80) ? 1 : 0;
        fC = r > 0xff ? 1 : 0;
        A = r & 0xff;
        setZN(A);
      }
    }

    function sbc(v) {
      if (fD) {
        const r = A - v - (1 - fC);
        let lo = (A & 0x0f) - (v & 0x0f) - (1 - fC);
        let hi = (A >> 4) - (v >> 4);
        if (lo & 0x10) { lo -= 6; hi--; }
        if (hi & 0x10) hi -= 6;
        fC = r >= 0 ? 1 : 0;
        fV = ((A ^ v) & (A ^ (r & 0xff)) & 0x80) ? 1 : 0;
        setZN(r & 0xff);
        A = ((hi << 4) | (lo & 0x0f)) & 0xff;
      } else {
        adc(v ^ 0xff);
      }
    }

    const cmp = (r, v) => { const t = r - v; fC = t >= 0 ? 1 : 0; setZN(t & 0xff); };

    function step() {
      const op = rd(PC++);
      let a, v;
      switch (op) {
        /* --- carga e armazenamento --- */
        case 0xa9: A = rd(aImm()); setZN(A); break;
        case 0xa5: A = rd(aZp()); setZN(A); break;
        case 0xb5: A = rd(aZpX()); setZN(A); break;
        case 0xad: A = rd(aAbs()); setZN(A); break;
        case 0xbd: A = rd(aAbsX(0)); setZN(A); break;
        case 0xb9: A = rd(aAbsY(0)); setZN(A); break;
        case 0xa1: A = rd(aIndX()); setZN(A); break;
        case 0xb1: A = rd(aIndY(0)); setZN(A); break;

        case 0xa2: X = rd(aImm()); setZN(X); break;
        case 0xa6: X = rd(aZp()); setZN(X); break;
        case 0xb6: X = rd(aZpY()); setZN(X); break;
        case 0xae: X = rd(aAbs()); setZN(X); break;
        case 0xbe: X = rd(aAbsY(0)); setZN(X); break;

        case 0xa0: Y = rd(aImm()); setZN(Y); break;
        case 0xa4: Y = rd(aZp()); setZN(Y); break;
        case 0xb4: Y = rd(aZpX()); setZN(Y); break;
        case 0xac: Y = rd(aAbs()); setZN(Y); break;
        case 0xbc: Y = rd(aAbsX(0)); setZN(Y); break;

        case 0x85: wr(aZp(), A); break;
        case 0x95: wr(aZpX(), A); break;
        case 0x8d: wr(aAbs(), A); break;
        case 0x9d: wr(aAbsX(1), A); break;
        case 0x99: wr(aAbsY(1), A); break;
        case 0x81: wr(aIndX(), A); break;
        case 0x91: wr(aIndY(1), A); break;

        case 0x86: wr(aZp(), X); break;
        case 0x96: wr(aZpY(), X); break;
        case 0x8e: wr(aAbs(), X); break;

        case 0x84: wr(aZp(), Y); break;
        case 0x94: wr(aZpX(), Y); break;
        case 0x8c: wr(aAbs(), Y); break;

        /* --- transferências --- */
        case 0xaa: tick(); X = A; setZN(X); break;
        case 0xa8: tick(); Y = A; setZN(Y); break;
        case 0x8a: tick(); A = X; setZN(A); break;
        case 0x98: tick(); A = Y; setZN(A); break;
        case 0xba: tick(); X = S; setZN(X); break;
        case 0x9a: tick(); S = X; break;

        /* --- pilha --- */
        case 0x48: tick(); push(A); break;
        case 0x08: tick(); push(packP() | 0x10); break;
        case 0x68: tick(); tick(); A = pull(); setZN(A); break;
        case 0x28: tick(); tick(); unpackP(pull()); break;

        /* --- lógica --- */
        case 0x29: A &= rd(aImm()); setZN(A); break;
        case 0x25: A &= rd(aZp()); setZN(A); break;
        case 0x35: A &= rd(aZpX()); setZN(A); break;
        case 0x2d: A &= rd(aAbs()); setZN(A); break;
        case 0x3d: A &= rd(aAbsX(0)); setZN(A); break;
        case 0x39: A &= rd(aAbsY(0)); setZN(A); break;
        case 0x21: A &= rd(aIndX()); setZN(A); break;
        case 0x31: A &= rd(aIndY(0)); setZN(A); break;

        case 0x09: A |= rd(aImm()); setZN(A); break;
        case 0x05: A |= rd(aZp()); setZN(A); break;
        case 0x15: A |= rd(aZpX()); setZN(A); break;
        case 0x0d: A |= rd(aAbs()); setZN(A); break;
        case 0x1d: A |= rd(aAbsX(0)); setZN(A); break;
        case 0x19: A |= rd(aAbsY(0)); setZN(A); break;
        case 0x01: A |= rd(aIndX()); setZN(A); break;
        case 0x11: A |= rd(aIndY(0)); setZN(A); break;

        case 0x49: A ^= rd(aImm()); setZN(A); break;
        case 0x45: A ^= rd(aZp()); setZN(A); break;
        case 0x55: A ^= rd(aZpX()); setZN(A); break;
        case 0x4d: A ^= rd(aAbs()); setZN(A); break;
        case 0x5d: A ^= rd(aAbsX(0)); setZN(A); break;
        case 0x59: A ^= rd(aAbsY(0)); setZN(A); break;
        case 0x41: A ^= rd(aIndX()); setZN(A); break;
        case 0x51: A ^= rd(aIndY(0)); setZN(A); break;

        case 0x24: v = rd(aZp()); fZ = (A & v) === 0 ? 1 : 0; fN = (v >> 7) & 1; fV = (v >> 6) & 1; break;
        case 0x2c: v = rd(aAbs()); fZ = (A & v) === 0 ? 1 : 0; fN = (v >> 7) & 1; fV = (v >> 6) & 1; break;

        /* --- aritmética --- */
        case 0x69: adc(rd(aImm())); break;
        case 0x65: adc(rd(aZp())); break;
        case 0x75: adc(rd(aZpX())); break;
        case 0x6d: adc(rd(aAbs())); break;
        case 0x7d: adc(rd(aAbsX(0))); break;
        case 0x79: adc(rd(aAbsY(0))); break;
        case 0x61: adc(rd(aIndX())); break;
        case 0x71: adc(rd(aIndY(0))); break;

        case 0xe9: case 0xeb: sbc(rd(aImm())); break;
        case 0xe5: sbc(rd(aZp())); break;
        case 0xf5: sbc(rd(aZpX())); break;
        case 0xed: sbc(rd(aAbs())); break;
        case 0xfd: sbc(rd(aAbsX(0))); break;
        case 0xf9: sbc(rd(aAbsY(0))); break;
        case 0xe1: sbc(rd(aIndX())); break;
        case 0xf1: sbc(rd(aIndY(0))); break;

        case 0xc9: cmp(A, rd(aImm())); break;
        case 0xc5: cmp(A, rd(aZp())); break;
        case 0xd5: cmp(A, rd(aZpX())); break;
        case 0xcd: cmp(A, rd(aAbs())); break;
        case 0xdd: cmp(A, rd(aAbsX(0))); break;
        case 0xd9: cmp(A, rd(aAbsY(0))); break;
        case 0xc1: cmp(A, rd(aIndX())); break;
        case 0xd1: cmp(A, rd(aIndY(0))); break;

        case 0xe0: cmp(X, rd(aImm())); break;
        case 0xe4: cmp(X, rd(aZp())); break;
        case 0xec: cmp(X, rd(aAbs())); break;
        case 0xc0: cmp(Y, rd(aImm())); break;
        case 0xc4: cmp(Y, rd(aZp())); break;
        case 0xcc: cmp(Y, rd(aAbs())); break;

        /* --- incremento e decremento --- */
        case 0xe6: a = aZp(); v = rd(a); wr(a, v); v = (v + 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xf6: a = aZpX(); v = rd(a); wr(a, v); v = (v + 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xee: a = aAbs(); v = rd(a); wr(a, v); v = (v + 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xfe: a = aAbsX(1); v = rd(a); wr(a, v); v = (v + 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xc6: a = aZp(); v = rd(a); wr(a, v); v = (v - 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xd6: a = aZpX(); v = rd(a); wr(a, v); v = (v - 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xce: a = aAbs(); v = rd(a); wr(a, v); v = (v - 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xde: a = aAbsX(1); v = rd(a); wr(a, v); v = (v - 1) & 0xff; wr(a, v); setZN(v); break;
        case 0xe8: tick(); X = (X + 1) & 0xff; setZN(X); break;
        case 0xc8: tick(); Y = (Y + 1) & 0xff; setZN(Y); break;
        case 0xca: tick(); X = (X - 1) & 0xff; setZN(X); break;
        case 0x88: tick(); Y = (Y - 1) & 0xff; setZN(Y); break;

        /* --- deslocamentos --- */
        case 0x0a: tick(); fC = (A >> 7) & 1; A = (A << 1) & 0xff; setZN(A); break;
        case 0x06: a = aZp(); v = rd(a); wr(a, v); fC = (v >> 7) & 1; v = (v << 1) & 0xff; wr(a, v); setZN(v); break;
        case 0x16: a = aZpX(); v = rd(a); wr(a, v); fC = (v >> 7) & 1; v = (v << 1) & 0xff; wr(a, v); setZN(v); break;
        case 0x0e: a = aAbs(); v = rd(a); wr(a, v); fC = (v >> 7) & 1; v = (v << 1) & 0xff; wr(a, v); setZN(v); break;
        case 0x1e: a = aAbsX(1); v = rd(a); wr(a, v); fC = (v >> 7) & 1; v = (v << 1) & 0xff; wr(a, v); setZN(v); break;

        case 0x4a: tick(); fC = A & 1; A >>= 1; setZN(A); break;
        case 0x46: a = aZp(); v = rd(a); wr(a, v); fC = v & 1; v >>= 1; wr(a, v); setZN(v); break;
        case 0x56: a = aZpX(); v = rd(a); wr(a, v); fC = v & 1; v >>= 1; wr(a, v); setZN(v); break;
        case 0x4e: a = aAbs(); v = rd(a); wr(a, v); fC = v & 1; v >>= 1; wr(a, v); setZN(v); break;
        case 0x5e: a = aAbsX(1); v = rd(a); wr(a, v); fC = v & 1; v >>= 1; wr(a, v); setZN(v); break;

        case 0x2a: { tick(); const c = fC; fC = (A >> 7) & 1; A = ((A << 1) | c) & 0xff; setZN(A); break; }
        case 0x26: { a = aZp(); v = rd(a); wr(a, v); const c = fC; fC = (v >> 7) & 1; v = ((v << 1) | c) & 0xff; wr(a, v); setZN(v); break; }
        case 0x36: { a = aZpX(); v = rd(a); wr(a, v); const c = fC; fC = (v >> 7) & 1; v = ((v << 1) | c) & 0xff; wr(a, v); setZN(v); break; }
        case 0x2e: { a = aAbs(); v = rd(a); wr(a, v); const c = fC; fC = (v >> 7) & 1; v = ((v << 1) | c) & 0xff; wr(a, v); setZN(v); break; }
        case 0x3e: { a = aAbsX(1); v = rd(a); wr(a, v); const c = fC; fC = (v >> 7) & 1; v = ((v << 1) | c) & 0xff; wr(a, v); setZN(v); break; }

        case 0x6a: { tick(); const c = fC; fC = A & 1; A = (A >> 1) | (c << 7); setZN(A); break; }
        case 0x66: { a = aZp(); v = rd(a); wr(a, v); const c = fC; fC = v & 1; v = (v >> 1) | (c << 7); wr(a, v); setZN(v); break; }
        case 0x76: { a = aZpX(); v = rd(a); wr(a, v); const c = fC; fC = v & 1; v = (v >> 1) | (c << 7); wr(a, v); setZN(v); break; }
        case 0x6e: { a = aAbs(); v = rd(a); wr(a, v); const c = fC; fC = v & 1; v = (v >> 1) | (c << 7); wr(a, v); setZN(v); break; }
        case 0x7e: { a = aAbsX(1); v = rd(a); wr(a, v); const c = fC; fC = v & 1; v = (v >> 1) | (c << 7); wr(a, v); setZN(v); break; }

        /* --- desvios --- */
        case 0x10: branch(!fN); break;
        case 0x30: branch(fN); break;
        case 0x50: branch(!fV); break;
        case 0x70: branch(fV); break;
        case 0x90: branch(!fC); break;
        case 0xb0: branch(fC); break;
        case 0xd0: branch(!fZ); break;
        case 0xf0: branch(fZ); break;

        /* --- saltos --- */
        case 0x4c: PC = aAbs(); break;
        case 0x6c: { const p = aAbs();
                     const lo = rd(p);
                     const hi = rd((p & 0xff00) | ((p + 1) & 0xff));   // bug da página
                     PC = lo | (hi << 8); break; }
        case 0x20: { const lo = rd(PC++); tick();
                     push((PC >> 8) & 0xff); push(PC & 0xff);
                     PC = lo | (rd(PC) << 8); break; }
        case 0x60: tick(); tick(); { const lo = pull(), hi = pull(); PC = ((lo | (hi << 8)) + 1) & 0xffff; } break;
        case 0x40: tick(); tick(); unpackP(pull()); { const lo = pull(), hi = pull(); PC = lo | (hi << 8); } break;
        case 0x00: { PC++; push((PC >> 8) & 0xff); push(PC & 0xff); push(packP() | 0x10);
                     fI = 1; PC = rd(0xfffe) | (rd(0xffff) << 8); break; }

        /* --- flags --- */
        case 0x18: tick(); fC = 0; break;
        case 0x38: tick(); fC = 1; break;
        case 0x58: tick(); fI = 0; break;
        case 0x78: tick(); fI = 1; break;
        case 0xb8: tick(); fV = 0; break;
        case 0xd8: tick(); fD = 0; break;
        case 0xf8: tick(); fD = 1; break;
        case 0xea: tick(); break;

        /* --- opcodes não documentados que os jogos e o DASM usam --- */
        case 0x04: case 0x44: case 0x64: rd(aZp()); break;                       // DOP
        case 0x14: case 0x34: case 0x54: case 0x74: case 0xd4: case 0xf4: rd(aZpX()); break;
        case 0x80: case 0x82: case 0x89: case 0xc2: case 0xe2: rd(aImm()); break;
        case 0x0c: rd(aAbs()); break;                                            // TOP
        case 0x1c: case 0x3c: case 0x5c: case 0x7c: case 0xdc: case 0xfc: rd(aAbsX(0)); break;
        case 0x1a: case 0x3a: case 0x5a: case 0x7a: case 0xda: case 0xfa: tick(); break;

        case 0xa7: A = X = rd(aZp()); setZN(A); break;                            // LAX
        case 0xb7: A = X = rd(aZpY()); setZN(A); break;
        case 0xaf: A = X = rd(aAbs()); setZN(A); break;
        case 0xbf: A = X = rd(aAbsY(0)); setZN(A); break;
        case 0xa3: A = X = rd(aIndX()); setZN(A); break;
        case 0xb3: A = X = rd(aIndY(0)); setZN(A); break;

        // LXA/ATX: instável de verdade, mas o CLEAN_START do macro.h usa `lxa #0`,
        // e com operando zero todas as variantes concordam em A = X = 0. Sem isto
        // o operando virava um BRK e o programa saltava para o vetor de interrupção.
        case 0xab: A = X = rd(aImm()); setZN(A); break;

        case 0x87: wr(aZp(), A & X); break;                                       // SAX
        case 0x97: wr(aZpY(), A & X); break;
        case 0x8f: wr(aAbs(), A & X); break;
        case 0x83: wr(aIndX(), A & X); break;

        // Um opcode que eu não conheça consome o byte e segue. Se ele tinha
        // operando, o fluxo desanda — então registro quais apareceram, para o
        // problema ficar visível em vez de virar um travamento misterioso.
        default: unknownOps[op] = (unknownOps[op] || 0) + 1; tick(); break;
      }
    }

    function reset() {
      ram.fill(0);
      A = X = Y = 0; S = 0xfd;
      fC = fZ = fD = fV = fN = 0; fI = 1;
      clock = 0; line = 0; cycles = 0; riotPhase = 0;
      collision.fill(0);
      inpt.fill(0x80);
      timerValue = 0; timerInterval = 1024; timerCount = 0; timerFlag = 0;
      swcha = 0xff; swchb = 0x3f;
      pixels.fill(0);
      PC = busRead(0xfffc) | (busRead(0xfffd) << 8);
    }

    /* =====================================================================
       Quadro
       ===================================================================== */
    function frame() {
      frameDone = false;
      audioLen = 0;
      let guard = 0;
      while (!frameDone && guard++ < 40000) step();
      return { pixels, lines: Math.min(line || LINES, LINES), audio: audioBuf.subarray(0, audioLen) };
    }

    /* =====================================================================
       Entradas
       ===================================================================== */
    // SWCHA: bits 7..4 = joystick esquerdo (cima, baixo, esq, dir), 0 = pressionado
    const DIR_BIT = { up: 0x10, down: 0x20, left: 0x40, right: 0x80 };
    function joystick(dir, pressed) {
      const b = DIR_BIT[dir];
      if (!b) return;
      if (pressed) swcha &= ~b; else swcha |= b;
    }
    function fire(pressed) { if (pressed) inpt[4] &= 0x7f; else inpt[4] |= 0x80; }
    // SWCHB: bit0 reset, bit1 select, bit3 color, bits 6/7 dificuldade
    function consoleSwitch(name, pressed) {
      const b = { reset: 0x01, select: 0x02 }[name];
      if (b) { if (pressed) swchb &= ~b; else swchb |= b; return; }
      if (name === 'color') { if (pressed) swchb |= 0x08; else swchb &= ~0x08; }
      if (name === 'p0diff') { if (pressed) swchb |= 0x40; else swchb &= ~0x40; }
      if (name === 'p1diff') { if (pressed) swchb |= 0x80; else swchb &= ~0x80; }
    }

    return {
      load: loadROM,
      reset,
      frame,
      joystick,
      fire,
      consoleSwitch,
      pixels,
      get info() {
        return { banking, size: rom.length, cycles, line, pc: PC,
                 unknownOps: Object.keys(unknownOps).map(k => '$' + (+k).toString(16)) };
      },
      get audioRate() { return AUDIO_RATE; },
      WIDTH, LINES,
    };
  }

  return { create, WIDTH, LINES };
})();

/* ==========================================================================
   Aba Emulador: liga o núcleo VCS na página.

   Enquanto o console está desligado a tela roda uma atração — barras geradas
   com as cores reais do TIA, varrendo devagar — em vez de ficar preta. Ligar
   e desligar passam pela animação de varredura do tubo.
   ========================================================================== */

const EMU_W = VCS.WIDTH, EMU_LINES = VCS.LINES;
/* Proporção: '43' é a geometria de um tubo 4:3 — 160 pixels ocupando a largura
   toda, então o pixel fica mais largo que alto na medida certa para a altura
   que estiver visível. 'square' é pixel quadrado, 'fill' estica para preencher. */
let emuAspectMode = '43';
const EMU_ASPECT = 1.6;                     // usado só pela prévia dos sprites
const emuPal = Uint32Array.from(NTSC, hex => parseInt(hex, 16));

let vcs = null;
let emuRom = null, emuRomName = '';
let emuOn = false, emuPaused = false;
/* Uma tela NTSC tem 262 linhas mas só ~192 aparecem; sem cortar, um terço do
   tubo fica preto. O corte é o mesmo que uma TV faz com o overscan. */
let emuCropTop = 28, emuCropH = 200;
let emuRaf = 0, emuScale = 3;
let emuFrames = 0, emuFpsAt = 0, emuFps = 0;
let audioCtx = null, audioNode = null, audioQueue = [], audioMuted = false;

const emuCanvas = () => $('#emuCanvas');

/* --- desenho ------------------------------------------------------------- */
let emuImage = null, emuCtx = null;

function emuSetup() {
  const cv = emuCanvas();
  emuCtx = cv.getContext('2d', { alpha: false });
  emuGeometry();
}

function emuGeometry() {
  const cv = emuCanvas();
  cv.width = EMU_W;
  cv.height = emuCropH;
  emuImage = emuCtx.createImageData(EMU_W, emuCropH);
  emuResize();
}

function emuBox(availW, availH) {
  // devolve o tamanho em pixels de tela para a proporção escolhida
  if (emuAspectMode === 'fill' && availW && availH) return [availW, availH];
  const h = Math.round(emuCropH * emuScale);
  const w = emuAspectMode === 'square'
    ? Math.round(EMU_W * emuScale)
    : Math.round(h * 4 / 3);
  return [w, h];
}

function emuResize() {
  const cv = emuCanvas();
  const full = !!document.fullscreenElement;
  // na janela, "preencher" usa a largura disponível do tubo; em tela cheia, a tela
  const availW = full ? window.innerWidth : Math.max(0, $('#tube').clientWidth - 36);
  const availH = full ? window.innerHeight : Math.round(emuCropH * emuScale);
  const [w, h] = emuBox(availW, availH);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
}

/* pinta um buffer de cores 0xRRGGBB no ImageData (que é RGBA) */
function emuBlit(src) {
  const d = emuImage.data;
  const from = emuCropTop * EMU_W;
  const n = emuCropH * EMU_W;
  for (let i = 0, j = 0; i < n; i++, j += 4) {
    const c = src[from + i];
    d[j] = (c >> 16) & 255;
    d[j + 1] = (c >> 8) & 255;
    d[j + 2] = c & 255;
    d[j + 3] = 255;
  }
  emuCtx.putImageData(emuImage, 0, 0);
}

/* --- atração -------------------------------------------------------------- */
const attractBuf = new Uint32Array(EMU_W * EMU_LINES);
let attractRaf = 0, attractT = 0;

/* Barras de teste no espírito das de emissora, mas com as cores que o TIA
   realmente tem: sete hues no corpo, faixa escura no meio e a rampa de
   luminância do cinza embaixo. Uma linha de varredura passeia devagar. */
const BAR_HUES = [1, 12, 8, 13, 5, 3, 6];        // amarelo, verde, azul, ...
const BARS_TOP = 150, RAMP_TOP = 178;

function attractFrame() {
  attractT += 1;
  const sweep = (attractT * 0.55) % (EMU_LINES + 40) - 20;

  for (let y = 0; y < EMU_LINES; y++) {
    const near = Math.max(0, 1 - Math.abs(y - sweep) / 9);   // realce da varredura
    for (let x = 0; x < EMU_W; x++) {
      let c;
      if (y < BARS_TOP) {
        const bar = Math.min(BAR_HUES.length - 1, (x * BAR_HUES.length / EMU_W) | 0);
        c = emuPal[BAR_HUES[bar] * 8 + (near > .2 ? 7 : 5)];
      } else if (y < RAMP_TOP) {
        c = emuPal[(x >> 4) % 2 ? 0 : 1];                    // faixa escura xadrez
      } else {
        const step = Math.min(7, (x * 8 / EMU_W) | 0);       // rampa de cinza
        c = emuPal[step + (near > .2 ? 1 : 0)];
      }
      attractBuf[y * EMU_W + x] = c;
    }
  }
  emuBlit(attractBuf);
  emuGlow(attractBuf);
  attractRaf = requestAnimationFrame(attractFrame);
}

function attractStart() { if (!attractRaf) attractFrame(); }
function attractStop() { cancelAnimationFrame(attractRaf); attractRaf = 0; }

/* a luz que vaza atrás do tubo acompanha a cor média da imagem */
let glowAt = 0;
function emuGlow(buf) {
  const now = performance.now();
  if (now - glowAt < 300) return;
  glowAt = now;
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < buf.length; i += 997) {
    const c = buf[i];
    r += (c >> 16) & 255; g += (c >> 8) & 255; b += c & 255;
  }
  const n = Math.ceil(buf.length / 997);
  $('#tube').style.setProperty('--glow',
    'rgb(' + ((r / n) | 0) + ',' + ((g / n) | 0) + ',' + ((b / n) | 0) + ')');
}

/* --- áudio ---------------------------------------------------------------- */
function audioStart() {
  if (audioCtx || audioMuted) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  audioCtx = new Ctx();
  audioNode = audioCtx.createScriptProcessor(2048, 0, 1);
  audioNode.onaudioprocess = e => {
    const out = e.outputBuffer.getChannelData(0);
    for (let i = 0; i < out.length; i++) out[i] = audioQueue.length ? audioQueue.shift() : 0;
  };
  audioNode.connect(audioCtx.destination);
}

function audioPush(samples) {
  if (!audioCtx || audioMuted || !samples.length) return;
  // reamostra do relógio do TIA para o do navegador
  const ratio = vcs.audioRate / audioCtx.sampleRate;
  for (let i = 0; i < samples.length; i += ratio) audioQueue.push(samples[i | 0]);
  if (audioQueue.length > 8192) audioQueue.splice(0, audioQueue.length - 4096);
}

function audioStop() {
  if (audioNode) { audioNode.disconnect(); audioNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  audioQueue.length = 0;
}

/* --- laço principal ------------------------------------------------------- */
function emuLoop() {
  if (!emuOn) return;
  emuRaf = requestAnimationFrame(emuLoop);
  if (emuPaused) return;

  const out = vcs.frame();
  emuBlit(out.pixels);
  emuGlow(out.pixels);
  audioPush(out.audio);

  emuFrames++;
  const now = performance.now();
  if (now - emuFpsAt >= 500) {
    emuFps = Math.round(emuFrames * 1000 / (now - emuFpsAt));
    emuFrames = 0;
    emuFpsAt = now;
    $('#emuFps').textContent = emuFps;
    $('#emuLines').textContent = out.lines;
  }
}

/* --- ligar e desligar ----------------------------------------------------- */
function emuPowerOn() {
  if (!emuRom) { say('compile alguma coisa antes de ligar o console', 'error'); return; }
  if (emuOn) return;

  attractStop();
  vcs = VCS.create({ palette: emuPal });
  vcs.load(emuRom);
  emuOn = true;
  emuPaused = false;
  $('#tube').classList.remove('off');
  const inner = $('#tubeInner');
  inner.classList.remove('dying');
  inner.classList.add('powering');
  setTimeout(() => inner.classList.remove('powering'), 400);
  audioStart();
  emuFpsAt = performance.now();
  emuFrames = 0;
  emuLoop();
  emuButtons();
  say(emuRomName + ' rodando — ' + vcs.info.size + ' bytes, banco ' + vcs.info.banking, 'ok');
}

function emuPowerOff(quiet) {
  if (!emuOn) return;
  emuOn = false;
  cancelAnimationFrame(emuRaf);
  audioStop();
  const inner = $('#tubeInner');
  inner.classList.add('dying');
  setTimeout(() => {
    inner.classList.remove('dying');
    $('#tube').classList.add('off');
    attractStart();
  }, 240);
  emuButtons();
  if (!quiet) say('console desligado');
}

function emuReset() {
  if (!emuOn) return;
  vcs.reset();
  say(emuRomName + ' reiniciado');
}

function emuPause() {
  if (!emuOn) return;
  emuPaused = !emuPaused;
  emuButtons();
  say(emuPaused ? 'pausado' : 'rodando');
}

function emuButtons() {
  $('#emuPause').textContent = emuPaused ? 'Continuar' : 'Pausar';
  $('#emuPower').textContent = emuOn ? 'Desligar' : 'Ligar';
  ['#emuPause', '#emuReset', '#emuSelect', '#emuStart'].forEach(s => { $(s).disabled = !emuOn; });
  $('#emuState').textContent = !emuRom ? 'sem ROM'
    : !emuOn ? 'desligado' : emuPaused ? 'pausado' : 'ligado';
}

/* --- a ROM que veio da compilação ----------------------------------------- */
function emuLoadRom(bytes, name, autostart) {
  emuRom = bytes;
  emuRomName = name;
  $('#cartName').textContent = name;
  $('#cartMeta').textContent = bytes.length + ' bytes';
  emuButtons();
  if (autostart) {
    if (emuOn) { vcs.load(emuRom); say(name + ' recarregado no console', 'ok'); }
    else emuPowerOn();
  } else if (emuOn) {
    vcs.load(emuRom);
  }
}

/* --- teclado -------------------------------------------------------------- */
const EMU_KEYS = {
  ArrowUp: ['joy', 'up'], ArrowDown: ['joy', 'down'],
  ArrowLeft: ['joy', 'left'], ArrowRight: ['joy', 'right'],
  KeyW: ['joy', 'up'], KeyS: ['joy', 'down'], KeyA: ['joy', 'left'], KeyD: ['joy', 'right'],
  Space: ['fire'], KeyZ: ['fire'], ControlLeft: ['fire'],
  Enter: ['sw', 'reset'], ShiftLeft: ['sw', 'select'],
};

function emuKey(e, down) {
  if (view !== 'emu' || !emuOn) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  // T, P e F ficam fora do WASD para funcionarem também em tela cheia,
  // onde o painel lateral não existe
  if (!e.ctrlKey && !e.altKey && !e.metaKey && (e.code === 'KeyT' || e.code === 'KeyP' || e.code === 'KeyF')) {
    if (down) {
      e.preventDefault();
      if (e.code === 'KeyT') cycleAspect();
      else if (e.code === 'KeyP') { emuPause(); $('#osdPause').textContent = emuPaused ? 'Continuar' : 'Pausar'; }
      else $('#emuFull').click();
    }
    return;
  }
  const m = EMU_KEYS[e.code];
  if (!m) return;
  e.preventDefault();
  if (m[0] === 'joy') vcs.joystick(m[1], down);
  else if (m[0] === 'fire') vcs.fire(down);
  else vcs.consoleSwitch(m[1], down);
}
window.addEventListener('keydown', e => emuKey(e, true));
window.addEventListener('keyup', e => emuKey(e, false));

/* --- controles da página --------------------------------------------------- */
$('#emuPower').addEventListener('click', () => (emuOn ? emuPowerOff() : emuPowerOn()));
$('#powerBig').addEventListener('click', emuPowerOn);
$('#emuReset').addEventListener('click', emuReset);
$('#emuPause').addEventListener('click', emuPause);

const hold = (sel, name) => {

  el.addEventListener('pointerdown', () => set(true));
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => set(false)));
};
hold('#emuSelect', 'select');
hold('#emuStart', 'reset');

$('#emuScale').addEventListener('change', e => { emuScale = +e.target.value; emuResize(); });
const ASPECT_NAME = { 43: '4:3 de TV', square: 'pixel quadrado', fill: 'esticada' };
const ASPECT_ORDER = ['43', 'square', 'fill'];

function setAspect(mode) {
  emuAspectMode = mode;
  press('#emuAspect', 'aspect', mode);
  press('#osdAspect', 'aspect', mode);
  if (document.fullscreenElement) refitFullscreen();
  else emuResize();

}

['#emuAspect', '#osdAspect'].forEach(sel => $(sel).addEventListener('click', e => {

$('#osdPause').addEventListener('click', () => { emuPause(); $('#osdPause').textContent = emuPaused ? 'Continuar' : 'Pausar'; });
$('#osdExit').addEventListener('click', () => document.exitFullscreen && document.exitFullscreen());

/* A barra aparece ao entrar em tela cheia, mostra o que dá para fazer e some.
   Durante o jogo ela não volta sozinha: tecla é jogo, e o mouse passeando pela
   tela não é pedido de menu. Um clique na imagem chama ela de volta, para quem
   não quer decorar que T, P e Esc fazem o mesmo. */
let osdTimer = 0;
function osdWake(ms) {

$('#emuCrop').addEventListener('change', e => {

  else { emuCropTop = 0; emuCropH = EMU_LINES; }
  emuGeometry();
});

  $('#tubeInner').style.setProperty('--crt', e.target.checked ? '1' : '0');
});
$('#emuMute').addEventListener('change', e => {

});
$('#emuFull').addEventListener('click', () => {
  const t = $('#tube');
  if (document.fullscreenElement) document.exitFullscreen();
  else t.requestFullscreen ? t.requestFullscreen() : say('tela cheia não disponível aqui', 'error');
});
function refitFullscreen() {
  if (document.fullscreenElement) {
    const perLine = emuAspectMode === 'square' ? EMU_W : emuCropH * 4 / 3;
    const fit = Math.min(window.innerWidth / perLine, window.innerHeight / emuCropH);
    emuScale = Math.max(1, fit);
  } else {
    emuScale = +$('#emuScale').value;
  }

document.addEventListener('fullscreenchange', () => {
  const full = !!document.fullscreenElement;
  $('#emuFull').textContent = full ? 'Sair da tela cheia' : 'Tela cheia';
  refitFullscreen();
  // um tempo a mais na primeira aparição: é a única chance de ler os botões
  if (full) { osdWake(4500); say('tela cheia — T troca a proporção, P pausa, Esc sai'); }
});
window.addEventListener('resize', () => { if (document.fullscreenElement) refitFullscreen(); });

/* ==========================================================================
   Aba Cores — onde o jogo decide as cores.

   No 2600 a tabela .byte de um sprite guarda só a forma; a cor vem do que o
   kernel escreve em COLUP0/COLUP1/COLUPF/COLUBK. Esse valor sempre nasce de
   um byte do fonte, e ele costuma estar num de três lugares:

     1. uma tabela de cor      ShipCol:  .byte $34, $36, ...
     2. um literal no código   LDA #$1C  /  STA COLUPF
     3. uma constante          YELLOW = $1C

   O scanner acha os três em qualquer fonte e deixa trocar o valor.
   ========================================================================== */

const COLOR_REGS = /\b(COLUP0|COLUP1|COLUPF|COLUBK)\b/i;
/* Para tabelas o nome tem de falar de COR mesmo: "Blue" em BlueMazeTop é um
   labirinto, e "cor" cabe dentro de "Score". Só "col"/"color"/"palet" valem.
   Para constantes o nome solto da cor serve, porque YELLOW = $1C é isso mesmo. */
const TABLE_WORD = /(col|colou?r|palet)/i;
const CONST_WORD = /(col|colou?r|palet|black|white|red|green|blue|yellow|orange|purple|violet|gr[ae]y|brown|pink|cyan)/i;
const NUM = /(\$[0-9a-fA-F]{1,2}|%[01]{8}|\b\d{1,3}\b)/;

const parseNum = t => t[0] === '$' ? parseInt(t.slice(1), 16)
                    : t[0] === '%' ? parseInt(t.slice(1), 2)
                    : parseInt(t, 10);

/* devolve o texto reescrito com o novo valor no mesmo formato do original */
function swapNum(line, oldTok, value) {
  const hex = '$' + value.toString(16).toUpperCase().padStart(2, '0');
  // troca preservando o formato; quando o que estava ali era um nome de
  // constante (BROWN, LIGHT_GREEN), escreve em hex — decimal ficaria estranho
  const fmt = oldTok[0] === '$' ? hex
            : oldTok[0] === '%' ? '%' + value.toString(2).padStart(8, '0')
            : /^\d+$/.test(oldTok) ? String(value)
            : hex;
  const at = line.indexOf(oldTok);
  return line.slice(0, at) + fmt + line.slice(at + oldTok.length);
}

let colorSites = [], colorSel = -1;

/* Constantes do fonte: muita tabela de cor é escrita com nome
   (`.byte BROWN, LIGHT_GREEN, ...`), então sem resolver os símbolos essas
   tabelas ficam invisíveis. */
/* Fonte de 2600 quase sempre tem IF NTSC / ELSE / ENDIF, e os dois ramos
   definem as mesmas cores com valores diferentes. Sem olhar a condição, a
   varredura pega o ramo errado — o verde do River Raid saía rosa. */
function activeLines(sym) {
  const lines = FILE.lines;
  const active = new Array(lines.length).fill(true);
  const stack = [];
  let live = true;

  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (/^ifn?const\b/i.test(t)) { stack.push(live); active[i] = false; continue; }
    const mIf = t.match(/^if\s+(.+?)\s*(;.*)?$/i);
    if (mIf) {
      stack.push(live);
      live = live && condTrue(mIf[1], sym);
      active[i] = false;
      continue;
    }
    if (/^else\b/i.test(t)) {
      const parent = stack.length ? stack[stack.length - 1] : true;
      live = parent && !live;
      active[i] = false;
      continue;
    }
    if (/^end?if\b/i.test(t) || /^endif\b/i.test(t)) {
      live = stack.length ? stack.pop() : true;
      active[i] = false;
      continue;
    }
    active[i] = live;
  }
  return active;
}

function condTrue(expr, sym) {
  const t = expr.trim();
  const lit = t.match(new RegExp('^' + NUM.source + '$'));
  if (lit) return parseNum(lit[1]) !== 0;
  const id = t.match(/^([A-Za-z_]\w*)$/);
  if (id) return sym.has(id[1]) ? sym.get(id[1]) !== 0 : true;
  return true;      // condição que não entendo: assume que monta
}

function buildSymbols() {
  const sym = new Map();
  // duas passadas: constantes derivadas de outras (BROWN = YELLOW - $C)
  // só resolvem depois que a base existe
  const pend = [];
  // 1ª volta ignora as condições, só para descobrir coisas como NTSC = 1
  const rough = new Map();
  for (const line of FILE.lines) {
    const m = line.match(/^([A-Za-z_]\w*)\s*=\s*([^;]+?)\s*(;.*)?$/);
    if (m && !rough.has(m[1])) {
      const v = evalConst(m[2], rough);
      if (v !== null) rough.set(m[1], v);
    }
  }
  const live = activeLines(rough);

  for (let i = 0; i < FILE.lines.length; i++) {
    if (!live[i]) continue;
    const m = FILE.lines[i].match(/^([A-Za-z_]\w*)\s*=\s*([^;]+?)\s*(;.*)?$/);
    if (!m) continue;
    const v = evalConst(m[2], sym);
    if (v === null) pend.push([m[1], m[2]]);
    else sym.set(m[1], v);
  }
  for (let pass = 0; pass < 3; pass++) {
    for (const [name, expr] of pend) {
      if (sym.has(name)) continue;
      const v = evalConst(expr, sym);
      if (v !== null) sym.set(name, v);
    }
  }
  return sym;
}

/* aceita um literal, um nome já conhecido, ou "nome ± literal" */
function evalConst(expr, sym) {
  const t = expr.trim();
  const lit = t.match(new RegExp('^' + NUM.source + '$'));
  if (lit) return parseNum(lit[1]);
  const id = t.match(/^([A-Za-z_]\w*)$/);
  if (id) return sym.has(id[1]) ? sym.get(id[1]) : null;
  const op = t.match(/^([A-Za-z_]\w*)\s*([+-])\s*(\$[0-9a-fA-F]{1,2}|%[01]{8}|\d{1,3})$/);
  if (op && sym.has(op[1])) {
    const base = sym.get(op[1]);
    const d = parseNum(op[3]);
    return ((op[2] === '+' ? base + d : base - d) + 256) & 0xff;
  }
  return null;
}

/* devolve [{tok, value}] de uma linha .byte, resolvendo nomes conhecidos */
function colorTokens(body, sym) {
  const out = [];
  for (const part of body.split(',')) {
    const t = part.trim();
    if (!t) continue;
    const num = t.match(new RegExp('^' + NUM.source + '$'));
    if (num) { out.push({ tok: num[1], value: parseNum(num[1]) }); continue; }
    // nome ou expressão: YELLOW, YELLOW+2, GREEN-8
    const v = evalConst(t, sym);
    if (v !== null) out.push({ tok: t, value: v, symbol: true });
  }
  return out;
}

function scanColors() {
  const lines = FILE.lines;
  const sym = buildSymbols();
  const live = activeLines(sym);
  const sites = [];

  // --- 1. tabelas .byte sob um label que fala de cor ----------------------
  // varre as linhas direto: assim pega também as tabelas escritas com
  // constantes, que o parser de sprites ignora por não ter número nenhum
  let label = null;
  for (let i = 0; i < lines.length; i++) {
    if (!live[i]) continue;
    const raw = lines[i];
    const lm = raw.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*:?\s*(;.*)?$/);
    if (lm && !/^[ \t]/.test(raw)) { label = lm[1]; continue; }
    if (!label || !TABLE_WORD.test(label)) continue;
    const bm = raw.match(/^\s+\.?byte\b(.*)$/i);
    if (!bm) { if (raw.trim() && !raw.trim().startsWith(';')) label = null; continue; }
    colorTokens(bm[1].replace(/;.*$/, ''), sym).forEach(t => {
      if (t.value >= 0 && t.value <= 255) {
        sites.push({ kind: 'tabela', group: label, line: i, tok: t.tok,
                     value: t.value & 0xfe, symbol: !!t.symbol });
      }
    });
  }

  // --- 2. literal carregado e escrito num registrador de cor -------------
  for (let i = 0; i < lines.length; i++) {
    if (!live[i]) continue;
    const body = lines[i].replace(/;.*$/, '');
    const ld = body.match(/^\s*(?:\w+\s+)?(lda|ldx|ldy)\s+#(\$[0-9a-fA-F]{1,2}|%[01]{8}|\d{1,3})\b/i);
    if (!ld) continue;
    let target = null;
    for (let j = i + 1; j <= i + 6 && j < lines.length; j++) {
      const nxt = lines[j].replace(/;.*$/, '');
      const st = nxt.match(/^\s*(?:\w+\s+)?st[axy]\s+(\w+)/i);
      if (!st) continue;
      if (COLOR_REGS.test(st[1])) target = st[1].toUpperCase();
      break;
    }
    if (!target) continue;
    sites.push({ kind: 'código', group: target, line: i, tok: ld[2], value: parseNum(ld[2]) & 0xfe });
  }

  // --- 3. constantes com cara de cor -------------------------------------
  for (let i = 0; i < lines.length; i++) {
    if (!live[i]) continue;
    const eq = lines[i].match(/^([A-Za-z_]\w*)\s*=\s*(\$[0-9a-fA-F]{1,2}|%[01]{8}|\d{1,3})\s*(;.*)?$/);
    if (!eq || !CONST_WORD.test(eq[1])) continue;
    const v = parseNum(eq[2]);
    if (v < 0 || v > 255) continue;
    sites.push({ kind: 'constante', group: eq[1], line: i, tok: eq[2], value: v & 0xfe });
  }

  colorSites = sites;
  return sites;
}

function renderColors() {
  const box = $('#colorList');
  box.textContent = '';
  $('#colorPanel').hidden = !hasFile();
  if (!hasFile()) { $('#colorCount').textContent = ''; return; }

  scanColors();
  const groups = new Map();
  colorSites.forEach((s, i) => {
    const key = s.kind + ' · ' + s.group;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });

  $('#colorCount').textContent = colorSites.length + ' valores em ' + groups.size + ' lugares';
  if (!colorSites.length) {
    box.innerHTML = '<p class="note">Não achei tabela de cor, literal antes de ' +
      '<code>STA COLUPx</code> nem constante com nome de cor neste fonte.</p>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const [key, idxs] of groups) {
    const card = document.createElement('div');
    card.className = 'cgroup';

    const head = document.createElement('div');
    head.className = 'cgroup-head';
    const label = key.split(' · ')[1];
    head.innerHTML = '<span class="cname">' + label + '</span>' +
      '<span class="ckind">' + key.split(' · ')[0] + '</span>' +
      '<span class="cline">L' + (colorSites[idxs[0]].line + 1) + '</span>';
    card.appendChild(head);

    const linked = key.startsWith('tabela') ? spritesOfColor(label) : [];
    if (linked.length) {
      const who = document.createElement('div');
      who.className = 'ckind';
      who.style.margin = '-4px 0 8px';
      who.textContent = 'colore ' + linked.slice(0, 4).join(', ') +
        (linked.length > 4 ? ' +' + (linked.length - 4) : '');
      card.appendChild(who);
    }

    const strip = document.createElement('div');
    strip.className = 'cstrip';
    idxs.forEach((i, n) => {
      const s = colorSites[i];
      const b = document.createElement('button');
      b.className = 'cswatch';
      b.type = 'button';
      b.dataset.site = i;
      b.style.background = rgbOf(s.value);
      // mostra o que está escrito no fonte: reconhecer "YELLOW" ajuda a achar
      b.title = 'entrada ' + n + ': ' + s.tok + ' = ' + hex2(s.value) +
                ' — linha ' + (s.line + 1);
      b.setAttribute('aria-pressed', String(colorSel === i));
      strip.appendChild(b);
    });
    card.appendChild(strip);
    frag.appendChild(card);
  }
  box.appendChild(frag);
}

/* um clique em qualquer quadradinho — da lista ou do bloco do sprite — passa
   a paleta para o modo "cor do jogo" */
function selectColorSite(i) {
  gameSel = i;
  $$('#colorList .cswatch, #linkStrip .cswatch').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.site === i)));
  const s = colorSites[i];
  say(s.group + ' · ' + s.kind + ' · linha ' + (s.line + 1));
}

$('#colorList').addEventListener('click', e => {
  const sw = e.target.closest('.cswatch');
  if (!sw) return;
  selectColorSite(+sw.dataset.site);
  openSwatchPop(+sw.dataset.site, sw);
});


/* ==========================================================================
   Vínculo sprite → cor.

   Fonte de 2600 batiza as coisas em par: PlaneA/PlaneB desenham, PlaneCol
   colore. Tirando o sufixo dos dois nomes (Col/Color/Tab de um lado, Gfx/
   Shape/dígito/A/B do outro) e comparando o que sobra, o par aparece. Testado
   no riverraid e no pitfall: casou todas as tabelas de cor com seus sprites.
   ========================================================================== */

const STRIP_COL = /(colou?r|col|tab|table)+$/i;
const STRIP_SPR = /(gfx|graphics?|shape|sprite|data|tab|table|ptr)?[0-9]*[ab]?$/i;

const normColor = n => n.replace(STRIP_COL, '').toLowerCase();
const normSprite = n => n.replace(STRIP_SPR, '').toLowerCase();

function linkedColorGroup(spriteLabel) {
  if (!spriteLabel || TABLE_WORD.test(spriteLabel)) return null;   // não casa consigo
  const ns = normSprite(spriteLabel);
  if (ns.length < 3) return null;

  const groups = new Map();
  colorSites.forEach((s, i) => {
    if (s.kind !== 'tabela') return;
    if (!groups.has(s.group)) groups.set(s.group, []);
    groups.get(s.group).push(i);
  });

  for (const [label, idxs] of groups) {
    const nc = normColor(label);
    if (nc.length < 3) continue;
    if (ns.startsWith(nc) || nc.startsWith(ns)) return { label, idxs };
  }
  return null;
}

/* sprites que uma tabela de cor colore — usado nos cartões da aba Cores */
function spritesOfColor(label) {
  const nc = normColor(label);
  if (nc.length < 3) return [];
  return FILE.tables
    .filter(t => {
      if (TABLE_WORD.test(t.label)) return false;      // tabela de cor não é sprite
      const ns = normSprite(t.label);
      return ns.length >= 3 && (ns.startsWith(nc) || nc.startsWith(ns));
    })
    .map(t => t.label);
}

let gameLink = null, gameSel = -1;

function refreshLink() {
  const box = $('#linkBox');
  gameLink = null;
  gameSel = -1;

  if (!hasFile() || FILE.sel < 0) { box.hidden = true; return; }
  scanColors();
  gameLink = linkedColorGroup(FILE.tables[FILE.sel].label);
  if (!gameLink) { box.hidden = true; return; }

  box.hidden = false;
  $('#linkName').textContent = gameLink.label;
  $('#linkLine').textContent = 'L' + (colorSites[gameLink.idxs[0]].line + 1);

  const strip = $('#linkStrip');
  strip.textContent = '';
  gameLink.idxs.forEach((i, n) => {
    const b = document.createElement('button');
    b.className = 'cswatch';
    b.type = 'button';
    b.dataset.site = i;
    b.style.background = rgbOf(colorSites[i].value);
    b.title = 'entrada ' + n + ': ' + colorSites[i].tok + ' = ' +
              hex2(colorSites[i].value) + ' — linha ' + (colorSites[i].line + 1);
    strip.appendChild(b);
  });

  // a prévia passa a usar a cor que o jogo usa de verdade
  const vals = gameLink.idxs.map(i => colorSites[i].value);
  if (vals.length === S.rows.length) {
    S.colors = vals.slice();
    setMode('scanline');
  } else {
    S.ink = vals[0];
    if (S.mode === 'single') S.colors = S.colors.map(() => S.ink);
  }
}

$('#linkStrip').addEventListener('click', e => {
  const sw = e.target.closest('.cswatch');
  if (!sw) return;
  selectColorSite(+sw.dataset.site);
  openSwatchPop(+sw.dataset.site, sw);
});

/* grava a cor escolhida na linha do fonte e refaz tudo que depende dela */
function applyGameColor(v) {
  const s = colorSites[gameSel];
  const old = hex2(s.value);
  FILE.lines[s.line] = swapNum(FILE.lines[s.line], s.tok, v);
  FILE.dirtyText = true;
  FILE.saved = false;

  const label = s.group, line = s.line, tok = s.tok;
  renderColors();
  refreshLink();
  gameSel = colorSites.findIndex(x => x.line === line && x.group === label);
  if (gameSel >= 0) {
    $$('#colorList .cswatch, #linkStrip .cswatch').forEach(b =>
      b.setAttribute('aria-pressed', String(+b.dataset.site === gameSel)));
  }
  updateTitle();
  render();
  toast(label + ': ' + old + ' → ' + hex2(v) +
        (s.symbol ? ' (' + s.tok + ' virou literal aqui)' : '') +
        ' — compile para ver no jogo', 3500, 'ok');
}

/* ==========================================================================
   Escolha de cor no lugar: clicar num quadradinho abre a paleta ali mesmo,
   sem depender do painel lateral. A cor é aplicada no fonte na hora, e o
   pop-up fica aberto para você experimentar várias.
   ========================================================================== */

let popSite = -1, popPreview = null, popX = 0, popY = 0;

function buildPopPalette() {
  const grid = $('#popPal');
  if (grid.childElementCount) return;
  for (let h = 0; h < 16; h++) {
    for (let l = 0; l < 8; l++) {
      const v = (h << 4) | (l << 1);
      const b = document.createElement('button');
      b.className = 'psw';
      b.type = 'button';
      b.dataset.val = v;
      b.style.background = rgbOf(v);
      b.title = hex2(v);
      b.setAttribute('aria-label', 'cor ' + hex2(v));
      grid.appendChild(b);
    }
  }
}

const PREVIEW_NAME = { ink: 'Sprite', bg: 'Fundo (COLUBK)', pf: 'Playfield (COLUPF)' };

/* alvo = { site: n } para um byte do fonte, ou { preview: 'ink'|'bg'|'pf' } */
function openSwatchPop(target, anchor) {
  buildPopPalette();
  const pop = $('#swatchPop');
  popSite = -1;
  popPreview = null;

  if (typeof target === 'number' || (target && target.site !== undefined)) {
    popSite = typeof target === 'number' ? target : target.site;
    const s = colorSites[popSite];
    $('#popWhat').innerHTML = '<b>' + s.group + '</b> · ' + s.kind +
      (s.symbol ? ' · <b>' + s.tok + '</b>' : '') + ' · linha ' + (s.line + 1);
    $('#popSrc').textContent = FILE.lines[s.line].trim();
    $('#popSrc').hidden = false;
    $('#popHint').innerHTML = 'A cor é gravada no fonte na hora. <b>F5</b> para ver no jogo.';
  } else {
    popPreview = target.preview;
    $('#popWhat').innerHTML = '<b>' + PREVIEW_NAME[popPreview] + '</b> · só da prévia';
    $('#popSrc').hidden = true;
    $('#popHint').innerHTML = popPreview === 'ink' && gameLink
      ? 'Isto pinta só a prévia. A cor no jogo é <b>' + gameLink.label + '</b>, no bloco abaixo.'
      : 'Isto pinta só a prévia desta página, não o fonte.';
  }
  paintPop();

  // posiciona ao lado do quadradinho, sem sair da janela
  if (anchor) {
    const r = anchor.getBoundingClientRect();
    popX = r.left;
    popY = r.bottom + 8;
  }
  pop.hidden = false;
  const pr = pop.getBoundingClientRect();
  const x = Math.max(8, Math.min(popX, window.innerWidth - pr.width - 8));
  const y = popY + pr.height > window.innerHeight - 8
    ? Math.max(8, popY - pr.height - 24)
    : popY;
  pop.style.left = x + 'px';
  pop.style.top = y + 'px';
  $('#popPal').focus({ preventScroll: true });
}

function paintPop() {
  const v = popSite >= 0 ? colorSites[popSite].value
          : popPreview ? S[popPreview] : -1;
  if (v < 0) return;
  $('#popNow').style.background = rgbOf(v);
  $('#popNowVal').textContent = hex2(v);
  $$('#popPal .psw').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.val === v)));
}

function closeSwatchPop() {
  $('#swatchPop').hidden = true;
  popSite = -1;
  popPreview = null;
}

$('#popPal').addEventListener('click', e => {
  const sw = e.target.closest('.psw');
  if (!sw) return;
  const v0 = +sw.dataset.val;

  if (popPreview) {
    if (popPreview === 'ink') {
      S.ink = v0;
      if (S.mode === 'single') S.colors = S.colors.map(() => v0);
    } else {
      S[popPreview] = v0;
    }
    render();
    paintPop();
    return;
  }
  if (popSite < 0) return;
  const s = colorSites[popSite];
  const line = s.line, group = s.group, old = hex2(s.value);
  const v = +sw.dataset.val;

  FILE.lines[line] = swapNum(FILE.lines[line], s.tok, v);
  FILE.dirtyText = true;
  FILE.saved = false;

  renderColors();
  refreshLink();
  popSite = colorSites.findIndex(x => x.line === line && x.group === group);
  updateTitle();
  render();
  paintPop();
  $('#popSrc').textContent = FILE.lines[line].trim();
  toast(group + ': ' + old + ' → ' + hex2(v) + ' — F5 para ver no jogo', 3000, 'ok');
});

$('#popClose').addEventListener('click', closeSwatchPop);

document.addEventListener('pointerdown', e => {
  if ($('#swatchPop').hidden) return;
  if (e.target.closest('#swatchPop') || e.target.closest('.cswatch')) return;
  closeSwatchPop();
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#swatchPop').hidden) { e.preventDefault(); closeSwatchPop(); }
});
window.addEventListener('resize', () => { if (!$('#swatchPop').hidden) closeSwatchPop(); });

/* say what Ctrl+S can actually do in this particular view */
function describeSave() {
  $('#aboutSave').textContent = CAN_FS
    ? 'Ctrl+S grava direto no arquivo que você abriu.'
    : hostSave
      ? 'Ctrl+S baixa o .asm alterado (com .txt no fim, que é o que esta página pode entregar — é só renomear). Abrindo tools/sprite-editor.html localmente, ele grava direto por cima do arquivo.'
      : CAN_DOWNLOAD
        ? 'Ctrl+S baixa o .asm alterado.'
        : 'Aqui o navegador não deixa gravar arquivos: Ctrl+S copia o .asm alterado para a área de transferência.';
}
describeSave();
downloadsApi().then(describeSave);

emuSetup();
emuButtons();
renderColors();
buildGrid();
render();
updateTitle();
$('#aboutBuild').textContent = APP_BUILD;
$('#sver').textContent = 'v' + APP_BUILD.replace(/[^0-9]/g, '').slice(0, 12);
say('Pronto. Arquivo ▸ Abrir .asm para editar os sprites de um fonte.');
</script>
</template>

    O montador é o mesmo do editor de Atari, com três diretivas
    a mais: <b>ines</b> escreve o cabeçalho e diz quantos bancos existem,

    para a parte dos tiles. Depois disso o <b>org</b> recebe endereço de CPU

    <b>Shift</b> é Select, e a <b>barra de espaço</b> também é o A —
    é com ela que a nave do exemplo atira.
    O que você desenhar entra na ROM que está rodando —
    é só clicar em Rodar de novo. Use <b>Tela cheia</b> para ampliar o jogo;
    <b>Esc</b> volta. O som sai pelos cinco canais da APU —

<!-- o exemplo que a aba Fonte carrega; e o mesmo Arq_asm/nes-nave.asm -->
<script type="text/plain" id="exemploAsm">
; =============================================================================
; nes-nave-2.asm -- agora ha o que derrubar
;
; O que mudou do -1 para ca:
;   * uma nave inimiga cruza o alto da tela, da esquerda para a direita
;   * o tiro derruba ela; depois de um tempo ela volta pela borda
;   * a colisao e conta de caixa, feita no codigo -- o NES so tem deteccao de
;     hardware para o sprite 0, e ela nao serve para isto
;   * sprite 2 e o inimigo, tile 4 o desenho, e ele usa a paleta 1 de sprites,
;     que e o que o byte de atributo escolhe
;
; O -0 e o mesmo programa que o nave.asm do 2600, para os dois serem lidos em
; par. Daqui em diante os numeros contam o que foi mudando -- diff entre dois
; deles e a explicacao mais curta que existe.
;
; No 2600 voce desenha a tela linha a linha, contando ciclos, e o programa e o
; kernel. Aqui nao: a PPU desenha sozinha a partir do que voce deixou na
; memoria dela, e o programa vira "arrume tudo antes do quadro comecar". Por
; isso o corpo do jogo mora na NMI, que chega uma vez por quadro, e o laco
; principal fica esperando.
;
; A outra troca: o 2600 tem 5 objetos e voce inventa o resto; o NES tem 64
; sprites e uma grade de 32x30 tiles, todos vindos do CHR -- que aqui e montado
; por tabelas no fim do arquivo, editaveis na aba Tiles.
;
; Dominio publico. Faca o que quiser com isto.
; =============================================================================

        processor 6502

; O cabecalho iNES: 1 banco de 16K de codigo, 1 de 8K de tiles, mapper 0
; (NROM, o cartucho sem troca de banco) e espelhamento vertical.
        ines prg=1 chr=1 mapper=0 mirror=v

; --- os registradores que a PPU e a APU expoem -------------------------------
PPUCTRL         = $2000
PPUMASK         = $2001
PPUSTATUS       = $2002
OAMADDR         = $2003
PPUSCROLL       = $2005
PPUADDR         = $2006
PPUDATA         = $2007
OAMDMA          = $4014
APUSTATUS       = $4015
JOY1            = $4016
JOY2            = $4017

; --- botoes, na ordem em que o controle entrega ------------------------------
; O laco de leitura entrega o A primeiro e o Direita por ultimo, e cada um
; entra por baixo -- entao o A acaba no bit de cima.
BOTAO_DIREITA   = %00000001
BOTAO_ESQUERDA  = %00000010
BOTAO_A         = %10000000

; --- ajustes do jogo ---------------------------------------------------------
NAVE_Y          = 180           ; altura em que a nave voa
NAVE_TILE       = 1             ; qual tile do CHR e a nave
VELOCIDADE      = 2             ; pixels por quadro
X_MIN           = 8
X_MAX           = 240

TIRO_TILE       = 3             ; qual tile do CHR e o tiro
TIRO_VEL        = 4             ; sobe mais rapido do que a nave anda
TIRO_TOPO       = 16            ; acima disto o tiro some
TIRO_FORA       = 0             ; tiroY = 0 quer dizer "nenhum tiro na tela"

INIMIGO_TILE    = 4
INIMIGO_Y       = 40            ; a altura em que ele cruza
INIMIGO_VEL     = 1             ; devagar: da tempo de mirar
INIMIGO_ESPERA  = 90            ; quadros ate voltar depois de cair
PERTO           = 8             ; a caixa da colisao tem a largura de um tile

CHAO            = $2000 + 26*32 ; onde na grade do fundo o chao comeca

; --- a memoria de trabalho ---------------------------------------------------
; A pagina zero e a memoria rapida do 6502, igual no 2600. A diferenca e que
; aqui sobra: o NES tem 2K de RAM contra os 128 bytes do 2600.
        seg.u zeropage
        org $0000

naveX           ds 1            ; coluna da nave
botoes          ds 1            ; o que o controle 1 esta segurando
antes           ds 1            ; o que ele segurava no quadro passado
novos           ds 1            ; os que acabaram de ser apertados
pronto          ds 1            ; a NMI avisa aqui que o quadro passou
tiroX           ds 1            ; coluna do tiro
tiroY           ds 1            ; linha do tiro; 0 = nao ha tiro
inimigoX        ds 1            ; coluna do inimigo
inimigoVivo     ds 1            ; 0 = caiu, esperando voltar
espera          ds 1            ; quantos quadros faltam para ele voltar

; A pagina 2 inteira e o rascunho dos 64 sprites: 4 bytes cada (y, tile,
; atributo, x). Uma vez por quadro ela e copiada para a PPU de um golpe so.
        seg.u oam
        org $0200
sprites         ds 256

; =============================================================================
        seg code
        bank 0
        org $C000

; -----------------------------------------------------------------------------
; Arranque
; -----------------------------------------------------------------------------
reset   subroutine
        sei                     ; sem interrupcao ate estarmos prontos
        cld                     ; o 2A03 nao tem modo decimal, mas o habito fica
        ldx #$FF
        txs                     ; pilha no topo da pagina 1
        inx                     ; x = 0
        stx PPUCTRL             ; desliga a NMI enquanto arrumamos a casa
        stx PPUMASK             ; e a tela
        stx APUSTATUS           ; e o som

        ; A PPU leva dois quadros para acordar. Ate la ela ignora escrita, e
        ; quem nao espera acaba com paleta pela metade.
        bit PPUSTATUS
.espera1
        bit PPUSTATUS
        bpl .espera1

        jsr limparRam
        jsr esconderSprites

.espera2
        bit PPUSTATUS
        bpl .espera2

        jsr carregarPaleta
        jsr desenharChao

        lda #128
        sta naveX
        lda #1
        sta inimigoVivo         ; ele ja comeca cruzando

        ; Rolagem zerada. Sao duas escritas no mesmo registrador: a primeira e
        ; o x, a segunda o y. Sem isto a tela nasce deslocada, porque as
        ; escritas em PPUADDR ali em cima mexeram no mesmo par interno.
        lda #0
        sta PPUSCROLL
        sta PPUSCROLL

        lda #%10000000          ; liga a NMI de cada quadro
        sta PPUCTRL
        lda #%00011110          ; mostra fundo e sprites, inclusive na borda
        sta PPUMASK
        cli

; -----------------------------------------------------------------------------
; O laco principal so espera o quadro virar. Todo o trabalho esta na NMI --
; e la que da para mexer na PPU sem sujar a imagem.
; -----------------------------------------------------------------------------
laco    subroutine
        lda pronto
        beq laco
        lda #0
        sta pronto
        jmp laco

; -----------------------------------------------------------------------------
; NMI: chega uma vez por quadro, quando o feixe sai da tela
; -----------------------------------------------------------------------------
nmi     subroutine
        pha                     ; a NMI interrompe qualquer coisa: guarde tudo
        txa
        pha
        tya
        pha

        ; Copiar os 256 bytes do rascunho para a memoria de sprites da PPU.
        ; Isto tem que vir primeiro: e a operacao mais cara do quadro, e so
        ; cabe enquanto o feixe esta fora da tela.
        lda #0
        sta OAMADDR
        lda #>sprites
        sta OAMDMA

        jsr lerControle
        jsr moverNave
        jsr atirar
        jsr moverTiro
        jsr moverInimigo
        jsr colidir
        jsr montarSprites

        lda #0                  ; a rolagem se perde a cada quadro: reponha
        sta PPUSCROLL
        sta PPUSCROLL

        lda #1
        sta pronto

        pla
        tay
        pla
        tax
        pla
irq     rti                     ; nao usamos IRQ; o vetor cai num rti

; -----------------------------------------------------------------------------
; Le o controle 1. O trinco pede uma foto dos botoes, e depois cada leitura
; entrega um botao, do A ao Direita -- oito no total.
; -----------------------------------------------------------------------------
lerControle subroutine
        lda #1
        sta JOY1                ; trinca
        lda #0
        sta JOY1                ; solta: a foto ficou guardada
        ldx #8
.proximo
        lda JOY1
        lsr                     ; o bit 0 entra no carry
        rol botoes              ; e o carry entra por baixo em botoes
        dex
        bne .proximo

        ; Quais botoes ACABARAM de ser apertados: os que estao ligados agora e
        ; nao estavam antes. Sem isto, segurar o A metralharia -- um tiro por
        ; quadro, sessenta por segundo.
        lda antes
        eor #$FF                ; ~antes
        and botoes
        sta novos
        lda botoes
        sta antes
        rts

; -----------------------------------------------------------------------------
; Anda com a nave, respeitando as bordas
; -----------------------------------------------------------------------------
moverNave subroutine
        lda botoes
        and #BOTAO_ESQUERDA
        beq .direita
        lda naveX
        sec
        sbc #VELOCIDADE
        cmp #X_MIN
        bcc .direita            ; bateu na borda: nao anda
        sta naveX
.direita
        lda botoes
        and #BOTAO_DIREITA
        beq .fim
        lda naveX
        clc
        adc #VELOCIDADE
        cmp #X_MAX
        bcs .fim
        sta naveX
.fim    rts

; -----------------------------------------------------------------------------
; Dispara, se o A acabou de ser apertado e nao ha tiro na tela
; -----------------------------------------------------------------------------
atirar  subroutine
        lda novos
        and #BOTAO_A
        beq .fim                ; nao apertou agora
        lda tiroY
        bne .fim                ; ja tem um tiro voando
        lda naveX               ; sai do meio da nave
        sta tiroX
        lda #NAVE_Y - 6         ; e logo acima dela
        sta tiroY
.fim    rts

; -----------------------------------------------------------------------------
; Sobe o tiro, e o apaga quando chega no alto
; -----------------------------------------------------------------------------
moverTiro subroutine
        lda tiroY
        beq .fim                ; nao ha tiro
        sec
        sbc #TIRO_VEL
        cmp #TIRO_TOPO
        bcc .some
        sta tiroY
        rts
.some   lda #TIRO_FORA
        sta tiroY
.fim    rts

; -----------------------------------------------------------------------------
; O inimigo cruza a tela; caido, conta os quadros ate voltar
; -----------------------------------------------------------------------------
moverInimigo subroutine
        lda inimigoVivo
        beq .caido

        lda inimigoX
        clc
        adc #INIMIGO_VEL
        sta inimigoX
        cmp #248                ; saiu pela direita? volta pela esquerda
        bcc .fim
        lda #0
        sta inimigoX
        rts

.caido  lda espera
        beq .volta
        dec espera
        rts
.volta  lda #1
        sta inimigoVivo
        lda #0
        sta inimigoX            ; entra de novo pela esquerda
.fim    rts

; -----------------------------------------------------------------------------
; O tiro acertou o inimigo?
;
; O NES tem deteccao de colisao no hardware, mas so para o sprite 0 contra o
; fundo -- serve para dividir a tela, nao para isto. Entao a conta e no codigo,
; e a mais barata que existe: se as duas caixas se encostam nos dois eixos,
; bateu. Como o 6502 nao tem valor absoluto, a distancia sai da subtracao e, se
; der negativo, do complemento de dois.
; -----------------------------------------------------------------------------
colidir subroutine
        lda inimigoVivo
        beq .fim                ; nao ha o que acertar
        lda tiroY
        beq .fim                ; nao ha tiro

        lda tiroX               ; distancia horizontal
        sec
        sbc inimigoX
        bcs .semSinal
        eor #$FF                ; deu negativo: inverte o sinal
        adc #1                  ; (o carry esta limpo aqui, entao isto e +1)
.semSinal
        cmp #PERTO
        bcs .fim                ; longe demais de lado

        lda tiroY               ; distancia vertical
        sec
        sbc #INIMIGO_Y
        bcs .semSinal2
        eor #$FF
        adc #1
.semSinal2
        cmp #PERTO
        bcs .fim                ; passou por cima ou ainda esta longe

        lda #0                  ; acertou: os dois somem
        sta inimigoVivo
        sta tiroY
        lda #INIMIGO_ESPERA
        sta espera
.fim    rts

; -----------------------------------------------------------------------------
; Monta os tres sprites no rascunho: quatro bytes cada, nesta ordem
; -----------------------------------------------------------------------------
montarSprites subroutine
        lda #NAVE_Y
        sta sprites+0           ; y
        lda #NAVE_TILE
        sta sprites+1           ; qual tile
        lda #0
        sta sprites+2           ; atributo: paleta 0, sem espelho
        lda naveX
        sta sprites+3           ; x

        ; O tiro e o sprite 1. Sem tiro na tela, y = $FF o esconde -- e o mesmo
        ; truque do esconderSprites.
        lda tiroY
        bne .tem
        lda #$FF
        sta sprites+4
        jmp .inimigo            ; sem tiro, mas o inimigo continua la
.tem    sta sprites+4           ; y
        lda #TIRO_TILE
        sta sprites+5
        lda #0
        sta sprites+6
        lda tiroX
        sta sprites+7           ; x

.inimigo
        ; O sprite 2 e o inimigo. O byte de atributo dele nao e mais zero: o 1
        ; escolhe a segunda paleta de sprites, e e so por isso que ele tem cor
        ; propria sem gastar tile nenhum a mais.
        lda inimigoVivo
        bne .vivo
        lda #$FF
        sta sprites+8
        rts
.vivo   lda #INIMIGO_Y
        sta sprites+8           ; y
        lda #INIMIGO_TILE
        sta sprites+9
        lda #1                  ; paleta 1 de sprites
        sta sprites+10
        lda inimigoX
        sta sprites+11          ; x
        rts

; -----------------------------------------------------------------------------
; Manda os 64 sprites para fora da tela. Y=$FF os esconde; sem isto o jogo
; nasce com lixo espalhado, porque a memoria acorda suja.
; -----------------------------------------------------------------------------
esconderSprites subroutine
        lda #$FF
        ldx #0
.proximo
        sta sprites,x
        inx
        inx
        inx
        inx
        bne .proximo
        rts

; -----------------------------------------------------------------------------
; Zera a RAM toda
; -----------------------------------------------------------------------------
limparRam subroutine
        lda #0
        ldx #0
.proximo
        sta $0000,x
        sta $0300,x
        sta $0400,x
        sta $0500,x
        sta $0600,x
        sta $0700,x
        inx
        bne .proximo
        rts

; -----------------------------------------------------------------------------
; A paleta mora em $3F00 dentro da PPU: 16 cores para o fundo, 16 para os
; sprites. Escrever la e sempre a mesma dança -- endereco alto, endereco
; baixo, e depois os bytes seguidos.
; -----------------------------------------------------------------------------
carregarPaleta subroutine
        bit PPUSTATUS           ; zera o meio-a-meio do PPUADDR
        lda #$3F
        sta PPUADDR
        lda #$00
        sta PPUADDR
        ldx #0
.proximo
        lda paleta,x
        sta PPUDATA
        inx
        cpx #32
        bne .proximo
        rts

; -----------------------------------------------------------------------------
; Desenha o chao: a grade de tiles do fundo tem 32 colunas por 30 linhas e
; mora em $2000 dentro da PPU. Aqui so as quatro ultimas linhas viram grama.
; -----------------------------------------------------------------------------
desenharChao subroutine
        bit PPUSTATUS
        ; A grade do fundo comeca em $2000 e tem 32 tiles por linha, entao a
        ; linha 26 fica em $2000 + 26*32. Os sinais < e > pegam o byte de baixo
        ; e o de cima de um endereco -- a PPU quer os dois, nesta ordem.
        lda #>CHAO
        sta PPUADDR
        lda #<CHAO
        sta PPUADDR
        ldy #4                  ; quatro linhas de grama
.linha
        ldx #32                 ; cada uma com 32 tiles
.coluna
        lda #2                  ; o tile 2 e a grama
        sta PPUDATA
        dex
        bne .coluna
        dey
        bne .linha
        rts

; -----------------------------------------------------------------------------
; As cores. Cada grupo de quatro e uma paleta; a primeira cor de todas e o
; fundo da tela, e o NES a repete em todas elas.
; -----------------------------------------------------------------------------
paleta
        ; fundo -- a cor 0 e o ceu, e o NES a repete em todas as paletas
        .byte $21,$0F,$1A,$2A   ; ceu, preto, verde escuro, verde claro
        .byte $21,$0F,$1A,$2A
        .byte $21,$0F,$1A,$2A
        .byte $21,$0F,$1A,$2A
        ; sprites -- a 0 e a nave, a 1 e o inimigo
        .byte $21,$30,$0F,$16   ; ceu, branco, preto, vermelho
        .byte $21,$27,$0F,$14   ; ceu, laranja, preto, roxo
        .byte $21,$30,$0F,$16
        .byte $21,$30,$0F,$16

; -----------------------------------------------------------------------------
; Os vetores, no fim do banco. O do meio e o reset: e o unico endereco que o
; NES conhece ao ligar, e por ele que tudo comeca.
; -----------------------------------------------------------------------------
        org $FFFA
        .word nmi
        .word reset
        .word irq

; =============================================================================
; Os tiles. Cada um sao 16 bytes: oito para o plano de baixo da cor, oito para
; o de cima. Um pixel com 1 nos dois planos usa a cor 3 da paleta.
;
; Da para desenhar por cima destes bytes na aba Tiles e ver o resultado
; rodando na mesma pagina.
; =============================================================================
        chrbank 0
        org $0000

        ; tile 0: vazio
        .byte $00,$00,$00,$00,$00,$00,$00,$00
        .byte $00,$00,$00,$00,$00,$00,$00,$00

        ; tile 1: a nave
        .byte %00011000
        .byte %00111100
        .byte %00111100
        .byte %01111110
        .byte %01111110
        .byte %11111111
        .byte %11011011
        .byte %10000001
        .byte %00011000       ; o segundo plano acende so o miolo, que fica
        .byte %00011000       ; com a cor 3 -- o vermelho da paleta
        .byte %00011000
        .byte %00011000
        .byte %00111100
        .byte %00111100
        .byte %00011000
        .byte %00000000

        ; tiles 3 e 4 vem depois da grama, la embaixo.

        ; tile 2: grama. O plano de cima esta todo aceso, entao nenhum pixel
        ; cai na cor 0 (que seria o ceu vazando); o de baixo salpica os que
        ; sobem para a cor 3, o verde claro.
        .byte %10001000
        .byte %00100010
        .byte %10001000
        .byte %00100010
        .byte %10001000
        .byte %00100010
        .byte %10001000
        .byte %00100010
        .byte %11111111
        .byte %11111111
        .byte %11111111
        .byte %11111111
        .byte %11111111
        .byte %11111111
        .byte %11111111
        .byte %11111111

        ; tile 3: o tiro. So o plano de cima, entao ele sai inteiro na cor 2 --
        ; que na paleta de sprites e o preto do contorno. Dois pixels de largura
        ; no meio do tile, para sair do centro da nave.
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00011000
        .byte %00011000
        .byte %00011000
        .byte %00011000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000

        ; tile 4: a nave inimiga, um disco. O plano de baixo desenha o corpo
        ; inteiro (cor 1, o laranja da paleta 1); o de cima acende so a cupula,
        ; que vira cor 3, o roxo.
        .byte %00111100
        .byte %01111110
        .byte %11111111
        .byte %11111111
        .byte %01111110
        .byte %00111100
        .byte %01000010
        .byte %00000000
        .byte %00111100
        .byte %00111100
        .byte %00011000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
        .byte %00000000
</script>

<script>
/* ==========================================================================
   O montador, o mesmo do editor de Atari: aqui ele serve ao painel de Código,
   que desmonta o PRG e monta de volta a linha reescrita.
   ========================================================================== */
/* @embutido dasm.js em src-nes */
/* ==========================================================================
   DASM.js — montador 6502 compatível com o DASM, escrito para o TIA Sprite
   Bench. Roda no navegador: o editor compila sem precisar de ajudante externo.

   A tabela de opcodes (incluindo os não documentados) foi extraída do próprio
   DASM 2.20 assemblando todas as combinações mnemônico × modo, então o que
   sai daqui bate byte a byte com `dasm fonte.asm -f3`.

       const r = DASM.assemble({ name: 'jogo.asm', source: texto });
       r.ok      -> true/false
       r.rom     -> Uint8Array com a ROM (formato -f3, cru)
       r.problems-> [{ file, line, kind: 'error'|'warning', message }]
       r.log     -> texto no formato das mensagens do DASM

   vcs.h e macro.h vêm embutidos; `includes: { 'nome.h': texto }` substitui os
   embutidos ou acrescenta outros arquivos.
   ========================================================================== */

const DASM = (() => {
  'use strict';

  const VERSION     = '1.0';
  const MAX_PASSES  = 16;
  const FILLER      = 0xff;   // o que o DASM põe nos buracos deixados por ORG
  const MAX_INCLUDE = 24;     // profundidade de include/macro, contra recursão

  /* --- opcodes -------------------------------------------------------------
     Modos: imp acc imm zp zpx zpy abs abx aby ind izx izy rel. Os ilegais são
     exatamente os que o DASM aceita — nem um a mais, para que um fonte que ele
     recusa seja recusado aqui também.
     ------------------------------------------------------------------------ */
  const OPTABLE = `
adc imm=69 zp=65 zpx=75 abs=6d abx=7d aby=79 izx=61 izy=71
and imm=29 zp=25 zpx=35 abs=2d abx=3d aby=39 izx=21 izy=31
asl acc=0a zp=06 zpx=16 abs=0e abx=1e
bcc rel=90
bcs rel=b0
beq rel=f0
bit zp=24 abs=2c
bmi rel=30
bne rel=d0
bpl rel=10
brk imp=00
bvc rel=50
bvs rel=70
clc imp=18
cld imp=d8

function stop() {
  running = false;
  audioStop();
  cancelAnimationFrame(raf);
  $('#btRun').textContent = 'Rodar';

}

function loop() {
  if (!running) return;
  const out = nes.frame();
  audioPush(out.audio);
  const d = img.data;
  for (let i = 0; i < out.pixels.length; i++) {
    const c = out.pixels[i], p = i * 4;
    d[p] = (c >> 16) & 255; d[p + 1] = (c >> 8) & 255; d[p + 2] = c & 255; d[p + 3] = 255;
  }
  sctx.putImageData(img, 0, 0);
  const info = nes.info;
  $('#emuInfo').innerHTML = 'quadro <b>' + info.frame + '</b> · mapper ' + info.mapper +
    (info.unknownOps.length ? ' · <b>opcodes não implementados:</b> ' + info.unknownOps.join(' ') : '');
  raf = requestAnimationFrame(loop);
}

/* --- o painel de código -------------------------------------------------------

   A ROM nao traz fonte, entao o caminho e o inverso: desmontar os bytes do PRG
   de volta em instrucoes. A tabela de opcodes ja existe -- e a mesma que o
   montador usa -- entao aqui e so inverte-la, de byte para (mnemonico, modo).

   Para gravar de volta a linha reescrita passa pelo montador de verdade, o
   mesmo DASM.assemble do editor de Atari. Sai de graca toda a sintaxe: #$, <, >,
   expressoes. A unica regra e caber: a instrucao nova nao pode ocupar mais
   bytes que a antiga, senao tudo que vem depois se desloca e o jogo quebra.
------------------------------------------------------------------------------ */

const bytesSujos = new Set();          // offsets do arquivo que voce reescreveu

/* byte do opcode -> { nome, modo }, invertendo a tabela do montador. Os
   ilegais vem depois na tabela, entao o primeiro a chegar e sempre o legal. */
const PORBYTE = (() => {
  const t = [];
  for (const nome of Object.keys(DASM.OPS)) {
    const modos = DASM.OPS[nome];
    for (const modo of Object.keys(modos)) {
      const b = modos[modo];
      if (t[b] === undefined) t[b] = { nome, modo };
    }
  }
  return t;
})();

const TAMANHO = { imp: 1, acc: 1, imm: 2, zp: 2, zpx: 2, zpy: 2, rel: 2, izx: 2,
                  izy: 2, abs: 3, abx: 3, aby: 3, ind: 3 };

const hx = (v, n) => v.toString(16).toUpperCase().padStart(n, '0');

/* os registradores que so o NES tem: sem isso a leitura nao anda */
const REGS = {
  0x2000: 'PPUCTRL', 0x2001: 'PPUMASK', 0x2002: 'PPUSTATUS', 0x2003: 'OAMADDR',
  0x2004: 'OAMDATA', 0x2005: 'PPUSCROLL', 0x2006: 'PPUADDR', 0x2007: 'PPUDATA',
  0x4014: 'OAMDMA', 0x4015: 'APUSTATUS', 0x4016: 'JOY1', 0x4017: 'JOY2/FRAME',
  0x4000: 'PULSE1', 0x4004: 'PULSE2', 0x4008: 'TRI', 0x400c: 'NOISE', 0x4010: 'DMC',
};

let cdBanco = 0, cdInicio = 0, cdPilha = [], cdEditando = -1;
let cdDesistir = null;                 // fecha o campo aberto, se houver

const bancosPrg = () => Math.max(1, prgLen >> 14);

/* Endereco de CPU -> posicao no arquivo.

   Quem manda e o endereco, nao o banco escolhido: a metade de cima ($C000 em
   diante) e onde quase todo mapper prende o ultimo banco -- e onde ficam os
   vetores, entao e sempre de la que o jogo arranca. A metade de baixo e a
   janela que troca, e ai sim vale o banco escolhido na barra. Com PRG de 16K
   nao ha escolha nenhuma: o unico banco aparece nas duas metades. */
function cdOffset(addr) {
  if (addr < 0x8000 || addr > 0xffff) return -1;
  const bancos = bancosPrg();
  if (bancos === 1) return prgStart + (addr & 0x3fff);
  if (addr >= 0xc000) return prgStart + (bancos - 1) * 0x4000 + (addr - 0xc000);
  return prgStart + cdBanco * 0x4000 + (addr - 0x8000);
}
const cdFixo = addr => bancosPrg() > 1 && addr >= 0xc000;

/* os tres vetores moram no fim do ultimo banco */
function cdVetor(qual) {
  const fim = prgStart + prgLen;
  const p = fim - (qual === 'nmi' ? 6 : qual === 'reset' ? 4 : 2);
  return rom[p] | (rom[p + 1] << 8);
}

function cdMontarSelects() {
  const bs = $('#cdBanco');
  bs.innerHTML = '';
  for (let i = 0; i < bancosPrg(); i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = i + (i === bancosPrg() - 1 ? ' (último)' : '');
    bs.appendChild(o);
  }
  cdBanco = 0;
  bs.value = 0;
  bs.disabled = bancosPrg() < 2;
}

/* Desenha uma tela de instrucoes a partir de cdInicio. Sem varrer o banco
   inteiro: so o que cabe na vista, senao ROM de 512K trava a pagina. */
function cdDesenhar() {
  const box = $('#cdLista');
  box.innerHTML = '';
  if (!rom) { $('#cdInfo').textContent = 'abra uma ROM'; return; }

  let addr = cdInicio;
  const frag = document.createDocumentFragment();
  for (let n = 0; n < 120; n++) {
    const off = cdOffset(addr);
    if (off < 0 || off >= prgStart + prgLen) break;
    const b = rom[off];
    const op = PORBYTE[b];
    const tam = op ? TAMANHO[op.modo] : 1;
    const linha = document.createElement('span');
    linha.className = 'ln';
    linha.dataset.addr = addr;
    linha.dataset.off = off;
    linha.dataset.tam = tam;

    let mudou = false;
    let bytes = '';
    for (let i = 0; i < 3; i++) {
      bytes += i < tam ? hx(rom[off + i], 2) + ' ' : '   ';
      if (i < tam && bytesSujos.has(off + i)) mudou = true;
    }

    let mn = '???', alvo = -1, nota = '';
    if (op) {
      const arg = op.modo === 'rel'
        ? (addr + 2 + ((rom[off + 1] ^ 0x80) - 0x80)) & 0xffff
        : tam === 3 ? rom[off + 1] | (rom[off + 2] << 8) : rom[off + 1];
      mn = op.nome + (cdTexto(op.modo, arg) ? ' ' + cdTexto(op.modo, arg) : '');
      if (op.modo === 'rel' || (op.modo === 'abs' && /^(jmp|jsr)$/.test(op.nome))) alvo = arg;
      if (tam === 3 && REGS[arg]) nota = '  ; ' + REGS[arg];
      else if (op.modo === 'rel') nota = '';
    }
    const ilegal = op && !/^(adc|and|asl|bcc|bcs|beq|bit|bmi|bne|bpl|brk|bvc|bvs|clc|cld|cli|clv|cmp|cpx|cpy|dec|dex|dey|eor|inc|inx|iny|jmp|jsr|lda|ldx|ldy|lsr|nop|ora|pha|php|pla|plp|rol|ror|rti|rts|sbc|sec|sed|sei|sta|stx|sty|tax|tay|tsx|txa|txs|tya)$/.test(op.nome);

    linha.innerHTML =
      '<span class="ad">' + hx(addr, 4) + '</span>  ' +
      '<span class="by' + (mudou ? ' mud' : '') + '">' + bytes + '</span> ' +
      (alvo >= 0
        ? '<span class="' + (ilegal ? 'il' : 'mn') + '">' + mn.split(' ')[0] + '</span> ' +
          '<span class="al" data-ir="' + alvo + '">$' + hx(alvo, 4) + '</span>'
        : '<span class="' + (ilegal ? 'il' : 'mn') + '">' + mn + '</span>') +
      '<span class="cm">' + nota + '</span>';
    frag.appendChild(linha);
    addr = (addr + tam) & 0xffff;
    if (addr < cdInicio) break;                     // deu a volta
  }
  box.appendChild(frag);
  $('#cdInfo').innerHTML =
    (bancosPrg() === 1
      ? 'banco único, espelhado nas duas metades'
      : cdFixo(cdInicio)
        ? 'banco <b>' + (bancosPrg() - 1) + '</b>, o fixo de $C000'
        : 'banco <b>' + cdBanco + '</b>, na janela de $8000') +
    ' · reset <b>$' +
    hx(cdVetor('reset'), 4) + '</b> · nmi <b>$' + hx(cdVetor('nmi'), 4) + '</b> · irq <b>$' +
    hx(cdVetor('irq'), 4) + '</b>' +
    (bytesSujos.size ? ' · <b>' + bytesSujos.size + ' byte(s) reescritos</b>' : '');
}

function cdTexto(modo, v) {
  switch (modo) {
    case 'imp': return '';
    case 'acc': return 'A';
    case 'imm': return '#$' + hx(v, 2);
    case 'zp':  return '$' + hx(v, 2);
    case 'zpx': return '$' + hx(v, 2) + ',X';
    case 'zpy': return '$' + hx(v, 2) + ',Y';
    case 'izx': return '($' + hx(v, 2) + ',X)';
    case 'izy': return '($' + hx(v, 2) + '),Y';
    case 'abs': return '$' + hx(v, 4);
    case 'abx': return '$' + hx(v, 4) + ',X';
    case 'aby': return '$' + hx(v, 4) + ',Y';
    case 'ind': return '($' + hx(v, 4) + ')';
    case 'rel': return '$' + hx(v, 4);
  }
  return '';
}

function cdIrPara(addr, guardar) {
  if (guardar !== false && rom) cdPilha.push(cdInicio);
  $('#cdVoltar').disabled = !cdPilha.length;
  cdInicio = addr & 0xffff;
  cdDesenhar();
}

/* --- reescrever uma instrucao ------------------------------------------------- */
function cdEditar(linha) {
  if (cdDesistir) cdDesistir();        // clicar em outra linha larga a de agora
  const off = +linha.dataset.off, addr = +linha.dataset.addr, tam = +linha.dataset.tam;
  cdEditando = off;
  const antes = linha.innerHTML;
  const texto = linha.textContent.slice(6).replace(/^[0-9A-F ]{9}/, '').split(';')[0].trim();
  linha.innerHTML = '<span class="ad">' + hx(addr, 4) + '</span>  ';
  const cx = document.createElement('input');
  cx.value = texto;
  linha.appendChild(cx);
  cx.focus();
  cx.select();

  const desistir = () => { cdEditando = -1; cdDesistir = null; linha.innerHTML = antes; };
  cdDesistir = desistir;
  cx.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Escape') { desistir(); return; }
    if (e.key !== 'Enter') return;
    const r = DASM.assemble({
      name: 'linha.asm',
      source: '  processor 6502\n  seg code\n  org $' + hx(addr, 4) + '\n  ' + cx.value + '\n',
    });
    if (!r.ok || !r.size) {
      say('não montou: ' + (r.problems[0] ? r.problems[0].message || r.problems[0] : 'linha inválida'), true);
      return;
    }
    if (r.size > tam) {
      say('«' + cx.value.trim() + '» ocupa ' + r.size + ' bytes e a instrução antiga tem ' +
          tam + ' — não cabe sem empurrar o resto do código', true);
      return;
    }
    for (let i = 0; i < tam; i++) {
      const novo = i < r.size ? r.rom[i] : 0xea;      // o que sobra vira nop
      if (rom[off + i] !== novo) bytesSujos.add(off + i);
      rom[off + i] = novo;
    }
    cdEditando = -1;
    cdDesistir = null;
    $('#btSave').disabled = false;
    updateDirty();
    cdDesenhar();
    say('$' + hx(addr, 4) + ': ' + cx.value.trim() +
        (r.size < tam ? ' (+' + (tam - r.size) + ' nop)' : ''));
  });
  cx.addEventListener('blur', () => { if (cdEditando === off) desistir(); });
}

$('#cdLista').addEventListener('mousedown', e => {
  const ir = e.target.closest('.al');
  if (ir) { e.preventDefault(); cdIrPara(+ir.dataset.ir); return; }
  const linha = e.target.closest('.ln');
  if (linha && rom) { e.preventDefault(); cdEditar(linha); }
});

$('#cdBanco').addEventListener('change', e => {
  cdBanco = +e.target.value; cdPilha.length = 0; $('#cdVoltar').disabled = true; cdDesenhar();
});
$('#cdVoltar').addEventListener('click', () => {
  if (!cdPilha.length) return;
  cdInicio = cdPilha.pop();
  $('#cdVoltar').disabled = !cdPilha.length;
  cdDesenhar();
});
$('#cdIr').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key !== 'Enter' || !rom) return;
  const t = e.target.value.trim().toLowerCase();
  if (/^(reset|nmi|irq)$/.test(t)) { cdIrPara(cdVetor(t)); return; }
  const v = parseInt(t.replace(/^\$|^0x/, ''), 16);
  if (isNaN(v)) { say('não entendi «' + t + '» — use $C123, reset, nmi ou irq', true); return; }
  cdIrPara(v);
});

/* --- a aba Fonte: escrever, montar e rodar sem sair da pagina ------------------

   O montador aqui e o mesmo do editor de Atari -- o dasm.js inteiro. O que ele
   ganhou para o NES foram tres diretivas: ines escreve o cabecalho, bank e
   chrbank escolhem para onde vao os bytes seguintes. O resto e DASM de sempre.

   Montou, o resultado entra pelo mesmo caminho de um arquivo aberto: os tiles
   aparecem na galeria, o codigo na aba Codigo, e o jogo comeca a rodar. Um
   ciclo fechado -- escreve, ve, mexe no tile, roda de novo.
------------------------------------------------------------------------------ */
function montarFonte() {
  const fonte = $('#fonte').value;
  if (!fonte.trim()) { say('não há nada para montar', true); return; }

  const t0 = performance.now();
  let r;
  try {
    r = DASM.assemble({ name: 'jogo.asm', source: fonte });
  } catch (e) {
    $('#fnInfo').textContent = 'o montador parou: ' + e.message;
    say('o montador parou: ' + e.message, true);
    return;
  }

  const caixa = $('#fnProbs');
  caixa.innerHTML = '';
  for (const p of r.problems) {
    const d = document.createElement('div');
    if (p.kind === 'warning') d.className = 'aviso';
    d.textContent = 'linha ' + p.line + ': ' + p.message;
    d.addEventListener('click', () => irParaLinha(p.line));
    caixa.appendChild(d);
  }

  if (!r.ok) {
    const erros = r.problems.filter(p => p.kind !== 'warning').length;
    $('#fnInfo').textContent = erros
      ? 'não montou: ' + erros + ' erro(s)'
      : 'não montou: ' + (r.log || '').split('\n').pop();
    say('não montou — veja a lista acima', true);
    if (r.problems.length) irParaLinha(r.problems[0].line);
    return;
  }

  const ms = Math.round(performance.now() - t0);
  try {
    openRom(r.rom, 'jogo.nes');
  } catch (e) {
    $('#fnInfo').textContent = 'montou ' + r.size + ' bytes, mas não é um .nes válido: ' + e.message;
    say(e.message, true);
    return;
  }
  $('#fnInfo').textContent =
    'montou ' + r.size + ' bytes em ' + r.passes + ' passes (' + ms + ' ms) · ' +
    r.symbols.length + ' símbolos';
  $('#btRun').click();
  say('montou e está rodando — ' + r.size + ' bytes');
}

/* leva o cursor para uma linha do fonte, e rola ate ela */
function irParaLinha(n) {
  const cx = $('#fonte');
  const linhas = cx.value.split('\n');
  let p = 0;
  for (let i = 0; i < n - 1 && i < linhas.length; i++) p += linhas[i].length + 1;
  cx.focus();
  cx.setSelectionRange(p, p + (linhas[n - 1] || '').length);
  const alturaLinha = cx.scrollHeight / linhas.length;
  cx.scrollTop = Math.max(0, (n - 6) * alturaLinha);
}

$('#fnMontar').addEventListener('click', montarFonte);

$('#fnExemplo').addEventListener('click', () => {
  $('#fonte').value = $('#exemploAsm').textContent.replace(/^\n/, '');
  $('#fnInfo').textContent = 'exemplo carregado — clique em Montar e rodar';
  say('este é o mesmo nave.asm do Atari, refeito para o NES: compare os dois');
});

$('#fnAbrir').addEventListener('click', () => $('#asmFile').click());
$('#asmFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  $('#fonte').value = await f.text();
  $('#fnInfo').textContent = f.name + ' · ' + f.size + ' bytes';
  e.target.value = '';
});

$('#fnSalvar').addEventListener('click', () => {
  const b = new Blob([$('#fonte').value], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'jogo.asm';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* Ctrl+Enter monta, venha de onde vier o foco */
$('#fonte').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); montarFonte(); }
});

/* --- as abas ------------------------------------------------------------------- */
$('#abas').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  for (const o of $('#abas').children) o.classList.toggle('on', o === b);
  const qual = b.dataset.aba;
  const m = document.querySelector('main');
  m.classList.toggle('modo-codigo', qual === 'codigo');
  m.classList.toggle('modo-fonte', qual === 'fonte');
  $('#secCode').hidden = qual !== 'codigo';
  $('#secFonte').hidden = qual !== 'fonte';
  if (qual === 'codigo' && rom) {
    if (!cdInicio) cdIrPara(cdVetor('reset'), false); else cdDesenhar();
  }
});

buildSwatches();
buildPalette();
drawGallery();
</script>
</template>

<script>
'use strict';

const CASCA_BUILD = '2026-08-22 12:13';

const CONSOLES = {
  atari: { tpl: 'src-atari', nome: 'Atari 2600',
           diz: 'sprites de player, montador do DASM e emulador de 2600' },
  nes:   { tpl: 'src-nes', nome: 'NES',
           diz: 'tiles da CHR de um .nes, e o jogo rodando com o que voce mudou' },
};

const app = document.getElementById('app');
const pick = document.getElementById('pick');
const oque = document.getElementById('oque');

function escolher(alvo, guardar) {
  const c = CONSOLES[alvo] || CONSOLES.atari;
  if (app.dataset.alvo !== alvo) {
    /* O srcdoc recria o documento a cada troca. E de proposito: assim nada
       fica rodando escondido atras -- emulador parado, som calado. */
    app.srcdoc = '<!doctype html>' + document.getElementById(c.tpl).innerHTML;
    app.dataset.alvo = alvo;
  }
  oque.textContent = c.diz;
  for (const b of pick.children) b.classList.toggle('on', b.dataset.alvo === alvo);
  document.title = c.nome + ' \u2014 Editores de 8 bits';
  if (location.hash.slice(1) !== alvo) history.replaceState(null, '', '#' + alvo);
  if (guardar) { try { localStorage.setItem('console', alvo); } catch (e) { /* modo privado */ } }
  setTimeout(() => app.focus(), 60);
}

pick.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) escolher(b.dataset.alvo, true);
});
addEventListener('hashchange', () => escolher(location.hash.slice(1), true));

let inicial = location.hash.slice(1);
if (!CONSOLES[inicial]) {
  try { inicial = localStorage.getItem('console'); } catch (e) { inicial = null; }
}
escolher(CONSOLES[inicial] ? inicial : 'atari', false);
</script>
</body>

<title>Editores de 8 bits</title>
<!-- O icone: a tela dividida entre os dois consoles -- o azul da TIA de um
     lado, o vermelho do NES do outro. Grade de 8 para dividir certo em 16,
     32 e 64. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%228%22 height=%228%22 rx=%221%22 fill=%22%230d1319%22/%3E%3Crect x=%221%22 y=%222%22 width=%222%22 height=%224%22 fill=%22%23183b9d%22/%3E%3Crect x=%223%22 y=%222%22 width=%221%22 height=%224%22 fill=%22%23ececec%22/%3E%3Crect x=%225%22 y=%222%22 width=%222%22 height=%224%22 fill=%22%23f83800%22/%3E%3C/svg%3E">

<style>
/* ---------------------------------------------------------------------------
   Tudo mora neste arquivo: a barra de cima, e os dois editores inteiros
   guardados em <template>. Ao escolher um console, o conteudo do template vai
   para a moldura pelo srcdoc -- que herda a origem desta pagina, entao o
   editor la dentro continua com acesso a arquivo.

   Sao documentos separados de proposito: os dois editores definem $, say,
   toast e uma pilha de outros nomes, e no mesmo escopo um pisaria no outro.
--------------------------------------------------------------------------- */
:root {
  --ground: #0d1319;
  --panel:  #141c24;
  --edge:   #24303c;
  --ink:    #dfe7ef;
  --dim:    #8a97a6;
  --atari:  #4aa3ff;
  --nes:    #f8785a;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --sans: 'Archivo', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 14px/1.5 var(--sans);
  display: flex; flex-direction: column;
}
.bar {
  display: flex; align-items: center; gap: 14px;
  padding: 6px 14px; background: var(--panel);
  border-bottom: 1px solid var(--edge); flex: none;
}
.bar h1 { margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; }
.spacer { flex: 1; }
.sub { color: var(--dim); font-size: 12px; font-family: var(--mono); }
.sub a { color: var(--dim); }
.pick { display: flex; gap: 2px; background: #1b2530; border: 1px solid var(--edge);
        border-radius: 8px; padding: 2px; }
.pick button {
  font: 600 13px var(--sans); color: var(--dim); background: transparent;
  border: 0; border-radius: 6px; padding: 5px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
}
.pick button:hover { color: var(--ink); }
.pick button.on { background: #24303c; color: var(--ink); }
.pick i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.pick .atari i { background: var(--atari); }
.pick .nes i { background: var(--nes); }
iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--ground); }
</style>
</head>
<body>

<div class="bar">
  <h1>Editores de 8 bits</h1>
  <div class="pick" id="pick">
    <button class="atari on" data-alvo="atari"><i></i>Atari 2600</button>
    <button class="nes" data-alvo="nes"><i></i>NES</button>
  </div>
  <span class="sub" id="oque"></span>
  <span class="spacer"></span>
  <span class="sub"><a href="https://github.com/Project-Special/atari2600-toolchain-js">codigo no GitHub</a></span>
</div>

<iframe id="app" title="editor" allow="fullscreen" allowfullscreen></iframe>

<template id="src-atari">

<title>Editor Emulador Atari</title>
<!-- O icone da aba: a nave do Arq_asm/nave.asm, oito por oito pixels, em
     branco sobre o azul da TIA. A grade de 8 divide certo em 16, 32 e 64,
     entao o desenho sai com pixel inteiro em qualquer tamanho de aba. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%228%22 height=%228%22 rx=%221%22 fill=%22%23183b9d%22/%3E%3Cg fill=%22%23ececec%22%3E%3Crect x=%223%22 y=%221%22 width=%222%22 height=%222%22/%3E%3Crect x=%222%22 y=%223%22 width=%224%22 height=%221%22/%3E%3Crect x=%221%22 y=%224%22 width=%221%22 height=%221%22/%3E%3Crect x=%223%22 y=%224%22 width=%222%22 height=%221%22/%3E%3Crect x=%226%22 y=%224%22 width=%221%22 height=%221%22/%3E%3Crect x=%220%22 y=%225%22 width=%228%22 height=%221%22/%3E%3Crect x=%221%22 y=%226%22 width=%226%22 height=%221%22/%3E%3Crect x=%222%22 y=%227%22 width=%224%22 height=%221%22/%3E%3C/g%3E%3C/svg%3E">

<style>
/* ---------------------------------------------------------------------------
   The chrome is deliberately monochrome. Every saturated colour on this page
   comes from the TIA palette itself, so the swatches read true.
   Single theme on purpose: you judge sprite colours against a dark screen.
--------------------------------------------------------------------------- */
:root {
  --ground:   #0d1319;
  --panel:    #141c24;
  --raised:   #1b242e;
  --sunken:   #0a1016;
  --line:     #26323e;
  --line-hi:  #3a4a5a;
  --text:     #e3eaf1;
  --muted:    #8fa1b2;
  --faint:    #5d6e7e;
  --ring:     #9fb6cb;

  --cell: 26px;
  --cell-h: 26px;

  --sans: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}

* { box-sizing: border-box; }

/* an author `display` beats the UA rule for [hidden], and .check sets one */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* --- shell ---------------------------------------------------------------- */

.bar {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 18px;
  padding: 18px 22px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.bar h1 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.015em;
}
.bar .sub {
  color: var(--muted);
  font-size: 13px;
}
.bar .spacer { flex: 1 1 auto; }
.bar .stat {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.bar .stat b { color: var(--text); font-weight: 600; }

.stage {
  display: grid;
  grid-template-columns: 404px minmax(320px, 1fr) 264px;
  align-items: start;
  gap: 16px;
  padding: 16px 22px 56px;   /* espaço para a barra de status */
  max-width: 1560px;
}
@media (max-width: 1180px) {
  .stage { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px;
}
.panel > h2 {
  margin: 0 0 12px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
}
.panel .note {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.45;
  color: var(--muted);
}
.panel .note code { font-family: var(--mono); color: var(--text); }

/* --- controls ------------------------------------------------------------- */

.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row + .row { margin-top: 10px; }
/* wrapped controls line up under the first one instead of under the label */
.grp { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 0; min-width: 0; }

.lbl {
  flex: 0 0 auto;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  min-width: 62px;
}

.btn {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 10px;
  cursor: pointer;
  transition: background 90ms linear, border-color 90ms linear;
  font-size: 13px;
}
.btn:hover { background: #222d38; border-color: var(--line-hi); }
.btn:active { background: #182029; }
.btn.icon { font-family: var(--mono); padding: 5px 8px; min-width: 30px; }
.btn.wide { flex: 1 1 auto; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button {
  background: var(--raised);
  border: 0;
  border-right: 1px solid var(--line);
  padding: 5px 10px;
  cursor: pointer;
  font-size: 12px;
  transition: background 90ms linear;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { background: #222d38; }
.seg button[aria-pressed="true"] {
  background: #2d3b49;
  color: #fff;
  box-shadow: inset 0 -2px 0 var(--ring);
}

select, input[type="text"], input[type="number"], textarea {
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 8px;
}
select { cursor: pointer; }
input[type="text"], input[type="number"] { font-family: var(--mono); }
input[type="number"] { width: 62px; }

.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.check input { accent-color: var(--ring); }

/* --- editor grid ---------------------------------------------------------- */

.editor-wrap { overflow-x: auto; }

.grid {
  display: grid;
  grid-template-columns: 30px 18px repeat(8, var(--cell)) 46px;
  gap: 0;
  width: max-content;
  user-select: none;
  touch-action: none;
}

.gnum, .ghex {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  display: flex;
  align-items: center;
  height: var(--cell-h);
  font-variant-numeric: tabular-nums;
}
.gnum { justify-content: flex-end; padding-right: 7px; }
.ghex { justify-content: flex-start; padding-left: 8px; letter-spacing: 0.02em; }
.gnum.mark { color: var(--muted); }

.gchip {
  height: var(--cell-h);
  width: 18px;
  border: 0;
  padding: 0;
  cursor: pointer;
  position: relative;
}
.gchip::after {
  content: "";
  position: absolute;
  inset: 1px 5px 1px 2px;
  border-radius: 1px;
  background: var(--chip);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
}
.grid.single .gchip { cursor: default; }
.grid.single .gchip::after { inset: 1px 6px 1px 3px; opacity: .55; }

.px {
  height: var(--cell-h);
  width: var(--cell);
  border: 0;
  padding: 0;
  cursor: crosshair;
  background: var(--off);
  box-shadow: inset -1px -1px 0 rgba(0,0,0,.55);
  transition: background 60ms linear;
}
.px[data-on="1"] { background: var(--on); }
.px.gl { box-shadow: inset -1px -1px 0 rgba(0,0,0,.55), inset 0 1px 0 var(--line-hi); }
.px:hover { filter: brightness(1.35); }

/* --- preview -------------------------------------------------------------- */

.screen {
  background: #000;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 10px;
  display: flex;
  justify-content: center;
  overflow-x: auto;
}
#tv { display: block; image-rendering: pixelated; flex: 0 0 auto; }

/* --- palette -------------------------------------------------------------- */

.targets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.target {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 7px 8px;
  cursor: pointer;
  text-align: left;
  display: grid;
  gap: 5px;
  transition: border-color 90ms linear;
}
.target:hover { border-color: var(--line-hi); }
.target[aria-pressed="true"] { border-color: var(--ring); background: #212c37; }
.target .tname {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}
.target[aria-pressed="true"] .tname { color: var(--text); }
.target .tsw {
  height: 20px;
  border-radius: 2px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.5);
}
.target .tval { font-family: var(--mono); font-size: 11px; color: var(--muted); }

.target { cursor: pointer; }
.target:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
/* --- colour finder -------------------------------------------------------- */

#colorList {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
  gap: 10px;
  max-height: 320px;
  overflow-y: auto;
}
.cgroup {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px;
}
.cgroup-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.cgroup-head .cname {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cgroup-head .ckind {
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
}
.cgroup-head .cline {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
}
.cstrip { display: flex; flex-wrap: wrap; gap: 3px; }
.cswatch {
  width: 26px;
  height: 22px;
  border: 0;
  border-radius: 2px;
  padding: 0;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .45);
}
.cswatch:hover { transform: scale(1.12); }
.cswatch[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ring);
  position: relative;
  z-index: 1;
}

.linkbox {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.linkbox .lhead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.linkbox .lhead .lname { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.linkbox .lhead .lline { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--faint); }
.linkbox .cstrip { margin-bottom: 8px; }
.linkbox.flash {
  animation: link-flash 1.4s ease-out;
  border-radius: 4px;
}
@keyframes link-flash {
  0%, 100% { background: transparent; box-shadow: none; }
  15%      { background: #223141; box-shadow: 0 0 0 2px var(--ring); }
  60%      { background: #1b2733; box-shadow: 0 0 0 2px var(--ring); }
}
@media (prefers-reduced-motion: reduce) { .linkbox.flash { animation: none; } }

/* --- escolha de cor no lugar ----------------------------------------------- */

.swatch-pop {
  position: fixed;
  z-index: 70;
  width: 260px;
  padding: 12px;
  background: #18212b;
  border: 1px solid var(--line-hi);
  border-radius: 5px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .62);
}
.swatch-pop .phead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.swatch-pop .pwhat { font-size: 11px; color: var(--muted); }
.swatch-pop .pwhat b { color: var(--text); font-family: var(--mono); }
.swatch-pop .pclose {
  margin-left: auto;
  background: none;
  border: 0;
  color: var(--faint);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px;
}
.swatch-pop .pclose:hover { color: var(--text); }
.swatch-pop .pnow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
#popNow {
  width: 34px;
  height: 22px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5);
}
#popNowVal { font-family: var(--mono); font-size: 12px; }
#popSrc {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 7px;
  margin: 0 0 9px;
  overflow-x: auto;
  white-space: pre;
}
#popPal {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 2px;
}
.psw {
  aspect-ratio: 1 / 1;
  border: 0;
  border-radius: 2px;
  padding: 0;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .4);
}
.psw:hover { transform: scale(1.2); position: relative; z-index: 1; }
.psw[aria-pressed="true"] {
  box-shadow: 0 0 0 2px #18212b, 0 0 0 4px var(--ring);
  position: relative;
  z-index: 2;
}
.swatch-pop .phint { margin: 9px 0 0; font-size: 10px; color: var(--faint); }

/* --- emulator ------------------------------------------------------------- */
/* A tela de atração é feita com a própria paleta do TIA: as barras são cores
   reais do chip, não um gradiente qualquer. O tubo liga e desliga com a
   animação de varredura de um CRT. */

.emuview {
  margin: 0 22px 40px;
  max-width: 1560px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 1100px) {
  .emuview { grid-template-columns: 1fr; }
}

.tube {
  position: relative;
  background: #05080b;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px;
  display: grid;
  place-items: center;
  overflow: hidden;
  min-height: 420px;
}
/* brilho difuso atrás do tubo, na cor média do que está na tela */
.tube::before {
  content: "";
  position: absolute;
  inset: -30%;
  background: radial-gradient(ellipse at center, var(--glow, #16324a) 0%, transparent 62%);
  opacity: .5;
  transition: background 600ms linear;
  pointer-events: none;
}
.tube.off::before { opacity: .18; }

.tube-inner {
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 0 0 1px #1d2a36, 0 18px 50px rgba(0, 0, 0, .75);
  background: #000;
  line-height: 0;
}
#emuCanvas {
  display: block;
  image-rendering: pixelated;
  transform-origin: center center;
}
/* varredura do tubo ligando/desligando */
.tube-inner.powering #emuCanvas { animation: crt-on 340ms cubic-bezier(.2, .8, .3, 1); }
.tube-inner.dying #emuCanvas { animation: crt-off 260ms ease-in forwards; }
@keyframes crt-on {
  0%   { transform: scaleY(.004) scaleX(1.1); filter: brightness(4); }
  45%  { transform: scaleY(.05) scaleX(1); filter: brightness(2.2); }
  100% { transform: scaleY(1) scaleX(1); filter: brightness(1); }
}
@keyframes crt-off {
  0%   { transform: scaleY(1); filter: brightness(1); }
  60%  { transform: scaleY(.04); filter: brightness(2.6); }
  100% { transform: scaleY(.002) scaleX(.4); filter: brightness(5); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .tube-inner.powering #emuCanvas, .tube-inner.dying #emuCanvas { animation: none; }
}

/* vinheta e máscara de linhas, por cima do canvas */
.tube-inner::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%);
  opacity: var(--crt, 1);
}

/* cartão sobre a tela quando o console está desligado */
.attract {
  position: absolute;
  inset: 0;
  line-height: 1.5;   /* .tube-inner zera para colar o canvas; aqui volta */
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  background: linear-gradient(180deg, rgba(5,8,11,.55) 0%, rgba(5,8,11,.82) 50%, rgba(5,8,11,.94) 100%);
  backdrop-filter: blur(2px) saturate(.8);
}
.tube:not(.off) .attract { display: none; }

.cart {
  background: linear-gradient(160deg, #23303c 0%, #161f28 100%);
  border: 1px solid #35485a;
  border-radius: 6px;
  padding: 12px 20px 14px;
  min-width: 240px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
}
.cart .cart-rail {
  height: 4px;
  border-radius: 2px;
  margin-bottom: 10px;
  background: linear-gradient(90deg,
    #fcfc54 0 14%, #fc9090 14% 28%, #ec8ce0 28% 42%,
    #8490fc 42% 56%, #84e0fc 56% 70%, #90fc90 70% 85%, #fce070 85% 100%);
}
.cart .cart-name {
  font-family: var(--mono);
  line-height: 1.3;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .01em;
}
.cart .cart-meta {
  font-family: var(--mono);
  line-height: 1.4;
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

.power {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #e8eef4;
  color: #101820;
  border: 0;
  border-radius: 999px;
  padding: 11px 26px 11px 20px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .45);
  transition: transform 120ms ease-out, box-shadow 120ms ease-out;
}
.power:hover { transform: translateY(-1px); box-shadow: 0 14px 32px rgba(0, 0, 0, .55); }
.power:active { transform: translateY(1px); }
.power .glyph { font-size: 17px; line-height: 1; }

.attract .hint {
  font-size: 12px;
  color: var(--muted);
  max-width: 380px;
  line-height: 1.5;
}
.attract .hint kbd {
  font-family: var(--mono);
  font-size: 11px;
  background: rgba(255, 255, 255, .07);
  border: 1px solid var(--line-hi);
  border-radius: 3px;
  padding: 1px 5px;
}

/* --- painel lateral do console -------------------------------------------- */
.console-panel { display: grid; gap: 12px; }

.console-panel .keys {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 12px;
  font-size: 12px;
  align-items: baseline;
}
.console-panel .keys dt { font-family: var(--mono); color: var(--text); }
.console-panel .keys dd { margin: 0; color: var(--muted); }

.switch-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

.meter {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.meter b { color: var(--text); font-weight: 600; font-size: 13px; }

/* Em tela cheia o painel lateral some, então os controles que importam
   aparecem numa barra flutuante sobre a imagem. Ela se esconde sozinha e
   volta ao mexer o mouse ou apertar uma tecla. */
.osd {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(12, 18, 24, .88);
  border: 1px solid var(--line-hi);
  border-radius: 999px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .6);
  z-index: 5;
  transition: opacity 260ms linear;
}
#tube:fullscreen .osd { display: flex; }
#tube:fullscreen .osd.idle { opacity: 0; pointer-events: none; }
.osd .osd-label {
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
}
.osd .seg button { padding: 4px 12px; }
#tube:fullscreen .attract { padding-bottom: 90px; }

/* --- source view ---------------------------------------------------------- */
/* Regra do resto da página: cor só vem da paleta TIA. Aqui abre exceção — sem
   nenhuma diferenciação o fonte fica ilegível — mas com tons dessaturados, e
   as duas telas nunca aparecem juntas. */

.tabs {
  display: flex;
  gap: 2px;
  margin: 16px 22px 0;
  max-width: 1560px;
}
.tabs button {
  background: var(--panel);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 4px 4px 0 0;
  padding: 7px 16px;
  font-size: 13px;
  cursor: pointer;
  color: var(--muted);
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] {
  background: var(--raised);
  color: var(--text);
  box-shadow: inset 0 2px 0 var(--ring);
}
.tabs .tabinfo {
  margin-left: auto;
  align-self: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
}

.codeview {
  margin: 0 22px 40px;
  max-width: 1560px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 0 4px 4px 4px;
  padding: 12px;
}
.codeview .row { margin-bottom: 10px; }
.codeview input[type="number"] { width: 78px; }
.codeview input[type="search"] {
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 8px;
  width: 170px;
}

.pad {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
  --code-line: 19px;
  --code-pad: 10px;
  /* a altura é do painel, não do conteúdo: sem isto a coluna de números
     cresce até a altura do arquivo inteiro e não rola junto com o texto */
  --code-h: 62vh;
  --code-min: 380px;
}

.gutter {
  font-family: var(--mono);
  font-size: 12px;
  line-height: var(--code-line);
  padding: var(--code-pad) 8px var(--code-pad) 10px;
  margin: 0;
  text-align: right;
  color: var(--faint);
  background: #080d12;
  border-right: 1px solid var(--line);
  height: var(--code-h);
  min-height: var(--code-min);
  overflow: hidden;
  user-select: none;
  white-space: pre;
  font-variant-numeric: tabular-nums;
}
.gutter b { color: var(--ring); font-weight: 500; }

.slab {
  position: relative;
  height: var(--code-h);
  min-height: var(--code-min);
  overflow: hidden;
}

.hl, #src {
  font-family: var(--mono);
  font-size: 12px;
  line-height: var(--code-line);
  padding: var(--code-pad) 12px;
  margin: 0;
  border: 0;
  white-space: pre;
  tab-size: 8;
  width: 100%;
  height: 100%;
}
.hl {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  color: var(--text);
}
#src {
  position: relative;
  display: block;
  overflow: auto;
  background: transparent;
  color: transparent;
  caret-color: var(--text);
  resize: none;
}
/* o texto visível está na camada de baixo, então a seleção precisa ser
   translúcida — opaca, ela apagaria a linha selecionada */
#src::selection { background: rgba(94, 148, 200, .32); color: transparent; }
#src:focus { outline: none; }
.pad:focus-within { box-shadow: inset 0 0 0 1px var(--line-hi); }

/* tokens do 6502 / DASM */
.hl .c { color: #5d7385; font-style: italic; }   /* comentário */
.hl .l { color: #d7e3ee; font-weight: 600; }     /* label na coluna 0 */
.hl .d { color: #c2a06a; }                       /* diretiva */
.hl .k { color: #93b6d1; }                       /* mnemônico */
.hl .n { color: #86b8a4; }                       /* número */
.hl mark { background: #33465a; color: inherit; border-radius: 2px; }

/* --- status bar ----------------------------------------------------------- */
/* Toda ação deixa rastro aqui, para nada ficar parecendo que "não aconteceu". */

.statusbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 16px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-size: 12px;
}
.statusbar .spacer { flex: 1 1 auto; }
.statusbar .smsg {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.statusbar .sinfo {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.statusbar .sinfo b { color: var(--text); font-weight: 500; }

/* estado semântico, separado do resto do cromo monocromático */
.sdot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--faint);
}
.sdot[data-kind="work"]  { background: #d9a441; }
.sdot[data-kind="ok"]    { background: #5bb98b; }
.sdot[data-kind="error"] { background: #e06a6a; }
.statusbar[data-kind="error"] .smsg { color: #f0a3a3; }

/* --- menu bar ------------------------------------------------------------- */

.menubar {
  display: flex;
  align-items: stretch;
  gap: 0;
  padding: 0 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 40;
  user-select: none;
}
.menubar > .top {
  background: none;
  border: 0;
  padding: 6px 11px;
  font-size: 13px;
  cursor: default;
  color: var(--text);
  border-bottom: 2px solid transparent;
}
.menubar > .top:hover { background: var(--raised); }
.menubar > .top[aria-expanded="true"] {
  background: var(--raised);
  border-bottom-color: var(--ring);
}
.menubar .ak { text-decoration: underline; text-underline-offset: 2px; }

.menu {
  position: absolute;
  top: 100%;
  min-width: 262px;
  padding: 4px;
  background: #1a232d;
  border: 1px solid var(--line-hi);
  border-radius: 3px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, .55);
  display: none;
}
.menu.open { display: block; }

.menu button {
  display: grid;
  grid-template-columns: 16px 1fr auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: none;
  border: 0;
  border-radius: 2px;
  padding: 5px 8px;
  text-align: left;
  font-size: 13px;
  cursor: default;
  color: var(--text);
}
.menu button:hover:not(:disabled),
.menu button:focus-visible { background: #2b3947; }
.menu button:disabled { color: var(--faint); }
.menu button .tick { font-size: 11px; color: var(--ring); }
.menu button:disabled .tick { color: var(--faint); }
.menu button .accel {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  padding-left: 18px;
}
.menu hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 4px 6px;
}

/* --- dialogs -------------------------------------------------------------- */

dialog {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--line-hi);
  border-radius: 4px;
  padding: 0;
  max-width: 480px;
  width: calc(100% - 32px);
}
dialog::backdrop { background: rgba(6, 10, 14, .68); }
dialog h3 {
  margin: 0;
  padding: 13px 18px;
  font-size: 14px;
  border-bottom: 1px solid var(--line);
}
dialog .body { padding: 14px 18px; font-size: 13px; line-height: 1.6; }
dialog .body p { margin: 0 0 10px; color: var(--muted); }
dialog .body p:last-child { margin-bottom: 0; }
dialog .body code, dialog .body kbd {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text);
}
dialog kbd {
  background: var(--raised);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: 1px 5px;
}
dialog dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 7px 16px;
  margin: 0;
  align-items: baseline;
}
dialog dt { justify-self: start; }
dialog dd { margin: 0; color: var(--muted); }
dialog pre {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 9px 11px;
  margin: 0;
  max-height: 220px;
  overflow: auto;
  white-space: pre-wrap;
  color: var(--text);
}
dialog footer {
  padding: 11px 18px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* --- file gallery --------------------------------------------------------- */

.filebar {
  margin: 16px 22px 0;
  max-width: 1560px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
}
.filebar-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 11px 14px;
}
.filebar-head .fname {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
}
.filebar-head .fmeta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.filebar-head .spacer { flex: 1 1 auto; }
.filebar-head input[type="search"] {
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 5px 8px;
  width: 150px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 8px;
  padding: 0 14px 14px;
  max-height: 268px;
  overflow-y: auto;
}
.filebar.shut .gallery { display: none; }

.card {
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 8px 6px 6px;
  cursor: pointer;
  display: grid;
  justify-items: center;
  gap: 5px;
  position: relative;
  transition: border-color 90ms linear, background 90ms linear;
}
.card:hover { border-color: var(--line-hi); background: #212c37; }
.card[aria-pressed="true"] { border-color: var(--ring); background: #26323e; }
.card canvas {
  image-rendering: pixelated;
  max-width: 100%;
  max-height: 62px;
  align-self: end;
}
.card .cname {
  font-family: var(--mono);
  font-size: 10px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}
.card .cmeta { font-family: var(--mono); font-size: 9px; color: var(--faint); }
.card .dot {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ring);
  display: none;
}
.card.dirty .dot { display: block; }

.empty { padding: 14px; font-size: 13px; color: var(--muted); }

body.dragging::after {
  content: "solte o arquivo";
  position: fixed;
  inset: 0;
  background: rgba(13,19,25,.86);
  border: 2px dashed var(--ring);
  display: grid;
  place-items: center;
  font-size: 18px;
  letter-spacing: .04em;
  z-index: 50;
  pointer-events: none;
}

/* --- code ----------------------------------------------------------------- */

.code-grid {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 720px) {
  .code-grid { grid-template-columns: 1fr; }
}

/* the middle column stacks the screen above the code */
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }

pre.out, textarea.in {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.55;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 10px 12px;
  margin: 0;
  overflow: auto;
  white-space: pre;
  tab-size: 4;
}
pre.out { height: 420px; }
textarea.in { height: 132px; }
textarea.in { width: 100%; resize: vertical; white-space: pre; }
.out .cm { color: var(--faint); }
.out .kw { color: var(--muted); }

.stack { display: grid; gap: 8px; }
.head-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.head-line h3 {
  margin: 0;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 600;
}

.drop-hint {
  border: 1px dashed var(--line-hi);
  border-radius: 3px;
  padding: 9px 10px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.drop-hint.hot { border-color: var(--ring); color: var(--text); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 48px;
  transform: translateX(-50%) translateY(14px);
  background: var(--raised);
  border: 1px solid var(--line-hi);
  border-radius: 3px;
  padding: 8px 16px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 140ms linear, transform 140ms ease-out;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
"use strict";

/* --- TIA NTSC palette, 16 hues x 8 luminances ----------------------------- */
/* Values lifted from Stella's PaletteHandler.cxx. Index i is colour i*2.     */
const NTSC = [
  '000000','4a4a4a','6f6f6f','8e8e8e','aaaaaa','c0c0c0','d6d6d6','ececec',
  '484800','69690f','86861d','a2a22a','bbbb35','d2d240','e8e84a','fcfc54',
  '7c2c00','904811','a26221','b47a30','c3903d','d2a44a','dfb755','ecc860',
  '901c00','a33915','b55328','c66c3a','d5824a','e39759','f0aa67','fcbc74',
  '940000','a71a1a','b83232','c84848','d65c5c','e46f6f','f08080','fc9090',
  '840064','97197a','a8308f','b846a2','c659b3','d46cc3','e07cd2','ec8ce0',
  '500084','68199a','7d30ad','9246c0','a459d0','b56ce0','c57cee','d48cfc',
  '140090','331aa3','4e32b5','6848c6','7f5cd5','956fe3','a980f0','bc90fc',
  '000094','181aa7','2d32b8','4248c8','545cd6','656fe4','7580f0','8490fc',
  '001c88','183b9d','2d57b0','4272c2','548ad2','65a0e1','75b5ef','84c8fc',
  '003064','185080','2d6d98','4288b0','54a0c5','65b7d9','75cceb','84e0fc',
  '004030','18624e','2d8169','429e82','54b899','65d1ae','75e7c2','84fcd4',
  '004400','1a661a','328432','48a048','5cba5c','6fd26f','80e880','90fc90',
  '143c00','355f18','527e2d','6e9c42','87b754','9ed065','b4e775','c8fc84',
  '303800','505916','6d762b','88923e','a0ab4f','b7c25f','ccd86e','e0ec7c',
  '482c00','694d14','866a26','a28638','bb9f47','d2b656','e8cc63','fce070',
];

const rgbOf = v => '#' + NTSC[v >> 1];
const hex2  = v => '$' + v.toString(16).toUpperCase().padStart(2, '0');

/* --- state ---------------------------------------------------------------- */
const START_HEIGHT = 16;   // an empty sprite, a common player height tall

/* Carimbo desta página. F5 aqui compila, então quem recarrega é Ctrl+R —
   sem isso não dava para saber se a aba aberta é a versão nova. */
const APP_BUILD = '2026-08-22 17:50';

const S = {
  rows:   new Array(START_HEIGHT).fill(0),
  colors: new Array(START_HEIGHT).fill(0x9E),
  ink:    0x9E,
  bg:     0x00,
  pf:     0xC6,
  mode:   'single',
  target: 'ink',
  nusiz:  0,
  refp:   false,
  aspect: 'square',
  zoom:   2,
  base:   'bin',
};

const undoStack = [];
const redoStack = [];

const snapshot = () => ({ rows: S.rows.slice(), colors: S.colors.slice() });
const restore  = s => { S.rows = s.rows.slice(); S.colors = s.colors.slice(); };

function commit() {
  undoStack.push(snapshot());
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
}

/* --- element helpers ------------------------------------------------------ */
const $  = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function press(group, attr, value) {
  $$(group + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] === value)));
}

/* say() escreve na barra de status e fica lá; toast() é o aviso passageiro.
   Todo toast também vira status, para nenhuma ação parecer silenciosa.      */
function say(msg, kind) {
  $('#smsg').textContent = msg;
  $('#sdot').dataset.kind = kind || 'info';
  $('#statusbar').dataset.kind = kind || 'info';
}

let toastTimer = 0;
function toast(msg, ms, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 1600);
  say(msg, kind);
}

/* --- the pixel grid ------------------------------------------------------- */
const grid = $('#grid');

function buildGrid() {
  grid.textContent = '';
  const frag = document.createDocumentFragment();

  for (let r = 0; r < S.rows.length; r++) {
    const num = document.createElement('div');
    num.className = 'gnum' + (r % 8 === 0 ? ' mark' : '');
    num.textContent = r;
    frag.appendChild(num);

    const chip = document.createElement('button');
    chip.className = 'gchip';
    chip.dataset.chip = r;
    chip.type = 'button';
    chip.title = 'linha ' + r + ' — clique para pintar com a cor atual';
    frag.appendChild(chip);

    for (let c = 0; c < 8; c++) {
      const px = document.createElement('button');
      px.className = 'px' + (r % 8 === 0 ? ' gl' : '');
      px.type = 'button';
      px.dataset.r = r;
      px.dataset.c = c;
      frag.appendChild(px);
    }

    const hx = document.createElement('div');
    hx.className = 'ghex';
    hx.dataset.hex = r;
    frag.appendChild(hx);
  }
  grid.appendChild(frag);
  paintGrid();
}

function paintGrid() {
  grid.classList.toggle('single', S.mode === 'single');
  grid.style.setProperty('--off', '#1b242e');

  for (let r = 0; r < S.rows.length; r++) {
    const byte = S.rows[r];
    const col  = rgbOf(S.mode === 'single' ? S.ink : S.colors[r]);

    grid.querySelector('[data-chip="' + r + '"]').style.setProperty('--chip', col);
    grid.querySelector('[data-hex="' + r + '"]').textContent = hex2(byte);

    for (let c = 0; c < 8; c++) {
      const on = (byte >> (7 - c)) & 1;
      const px = grid.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
      px.dataset.on = on;
      px.style.setProperty('--on', col);
    }
  }
}

/* painting ----------------------------------------------------------------- */
let painting = null;   // 0 or 1: the value being written this stroke
let chipping = false;

grid.addEventListener('pointerdown', e => {
  const px = e.target.closest('.px');
  const chip = e.target.closest('.gchip');

  if (px) {
    commit();
    const r = +px.dataset.r, c = +px.dataset.c;
    painting = ((S.rows[r] >> (7 - c)) & 1) ? 0 : 1;
    setPixel(r, c, painting);
    grid.setPointerCapture(e.pointerId);
  } else if (chip && S.mode === 'scanline') {
    commit();
    chipping = true;
    S.colors[+chip.dataset.chip] = S.ink;
    render();
    grid.setPointerCapture(e.pointerId);
  }
});

grid.addEventListener('pointermove', e => {
  if (painting === null && !chipping) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return;
  if (painting !== null && el.classList.contains('px')) {
    setPixel(+el.dataset.r, +el.dataset.c, painting);
  } else if (chipping && el.classList.contains('gchip')) {
    S.colors[+el.dataset.chip] = S.ink;
    render();
  }
});

const endStroke = () => { painting = null; chipping = false; };
grid.addEventListener('pointerup', endStroke);

/* keyboard: Enter/Space on a pixel fires a click with detail 0 */
grid.addEventListener('click', e => {
  if (e.detail !== 0) return;
  const px = e.target.closest('.px');
  if (px) {
    commit();
    const r = +px.dataset.r, c = +px.dataset.c;
    setPixel(r, c, ((S.rows[r] >> (7 - c)) & 1) ? 0 : 1);
  } else {
    const chip = e.target.closest('.gchip');
    if (chip && S.mode === 'scanline') { commit(); S.colors[+chip.dataset.chip] = S.ink; render(); }
  }
});
grid.addEventListener('pointercancel', endStroke);
window.addEventListener('pointerup', endStroke);

function setPixel(r, c, on) {
  const bit = 1 << (7 - c);
  const next = on ? (S.rows[r] | bit) : (S.rows[r] & ~bit);
  if (next === S.rows[r]) return;
  S.rows[r] = next;
  render();
}

/* --- transforms ----------------------------------------------------------- */
const reverseBits = b => {
  let out = 0;
  for (let i = 0; i < 8; i++) if (b & (1 << i)) out |= 1 << (7 - i);
  return out;
};

const ACTIONS = {
  'h-':    () => setHeight(S.rows.length - 1),
  'h+':    () => setHeight(S.rows.length + 1),
  left:    () => { commit(); S.rows = S.rows.map(b => ((b << 1) | (b >> 7)) & 0xFF); },
  right:   () => { commit(); S.rows = S.rows.map(b => ((b >> 1) | (b << 7)) & 0xFF); },
  up:      () => { commit(); S.rows.push(S.rows.shift()); S.colors.push(S.colors.shift()); },
  down:    () => { commit(); S.rows.unshift(S.rows.pop()); S.colors.unshift(S.colors.pop()); },
  fliph:   () => { commit(); S.rows = S.rows.map(reverseBits); },
  flipv:   () => { commit(); S.rows.reverse(); S.colors.reverse(); },
  invert:  () => { commit(); S.rows = S.rows.map(b => ~b & 0xFF); },
  clear:   () => { commit(); S.rows = S.rows.map(() => 0); },
  applyall:() => { commit(); S.colors = S.colors.map(() => S.ink); if (S.mode === 'single') setMode('scanline'); },
  undo:    () => {
    if (!undoStack.length) return toast('nada para desfazer');
    redoStack.push(snapshot());
    restore(undoStack.pop());
  },
  redo:    () => {
    if (!redoStack.length) return toast('nada para refazer');
    undoStack.push(snapshot());
    restore(redoStack.pop());
  },
};

function setHeight(h) {
  h = Math.max(1, Math.min(64, h | 0));
  if (h === S.rows.length) return;
  commit();
  while (S.rows.length > h) { S.rows.pop(); S.colors.pop(); }
  while (S.rows.length < h) { S.rows.push(0); S.colors.push(S.ink); }
  $('#hIn').value = h;
  buildGrid();
}

  else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); ACTIONS.redo(); render(); }

/* --- the screen ----------------------------------------------------------- */
/* NUSIZ0: where the copies land (in colour clocks) and how wide a pixel is.  */
const NUSIZ = [
  { at: [0],        w: 1 },
  { at: [0, 16],    w: 1 },
  { at: [0, 32],    w: 1 },
  { at: [0, 16, 32],w: 1 },
  { at: [0, 64],    w: 1 },
  { at: [0],        w: 2 },
  { at: [0, 32, 64],w: 1 },
  { at: [0],        w: 4 },
];

const CLOCKS = 160;
const PIXEL_ASPECT = 1.6;          // a 4:3 tube, 160 clocks across, 192 lines down

function drawScreen() {
  const cv  = $('#tv');
  const ctx = cv.getContext('2d');
  const h   = S.rows.length;
  const lines = Math.max(h + 26, 56);
  const z   = S.zoom;

  const w = Math.round(CLOCKS * PIXEL_ASPECT * z);
  const ht = lines * z;
  if (cv.width !== w || cv.height !== ht) { cv.width = w; cv.height = ht; }
  cv.style.width  = w + 'px';
  cv.style.height = ht + 'px';

  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = rgbOf(S.bg);
  ctx.fillRect(0, 0, w, ht);

  const cw = CLOCKS * PIXEL_ASPECT * z / CLOCKS;   // width of one colour clock
  const rect = (x, y, cwid, col) => {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x * cw), y * z, Math.round(cwid * cw), z);
  };

  const hasGround = $('#ground').checked;
  const gTop = hasGround ? lines - 11 : lines;

  if (hasGround) {
    ctx.fillStyle = rgbOf(S.pf);
    ctx.fillRect(0, gTop * z, w, (lines - gTop) * z);
    // the playfield draws 4 colour clocks per bit — crenellate the top edge
    ctx.fillStyle = rgbOf(S.bg);
    for (let i = 0; i < CLOCKS / 4; i++) {
      if (i % 3 === 1) ctx.fillRect(Math.round(i * 4 * cw), gTop * z, Math.round(4 * cw), z * 2);
    }
  }

  const spec = NUSIZ[S.nusiz];
  const span = spec.at[spec.at.length - 1] + 8 * spec.w;
  const x0   = Math.round((CLOCKS - span) / 2);
  const y0   = Math.max(2, Math.floor((gTop - h) / 2));

  for (let r = 0; r < h; r++) {
    const byte = S.rows[r];
    if (!byte) continue;
    const col = rgbOf(S.mode === 'single' ? S.ink : S.colors[r]);
    for (let c = 0; c < 8; c++) {
      const bit = S.refp ? c : 7 - c;
      if (!((byte >> bit) & 1)) continue;
      for (const off of spec.at) {
        rect(x0 + off + c * spec.w, y0 + r, spec.w, col);
      }
    }
  }

  if ($('#crt').checked && z >= 2) {
    ctx.fillStyle = 'rgba(0,0,0,.26)';
    for (let y = 0; y < ht; y += z) ctx.fillRect(0, y + z - 1, w, 1);
  }
}

/* --- code output ---------------------------------------------------------- */
function bytesForOutput() {
  const flip = $('#optFlip').checked;
  const rows = flip ? S.rows.slice().reverse() : S.rows.slice();
  const cols = flip ? S.colors.slice().reverse() : S.colors.slice();
  return { rows, cols };
}

function buildCode() {
  const { rows, cols } = bytesForOutput();
  const label = ($('#label').value || 'Sprite').trim();
  const art   = $('#optArt').checked;
  const bin   = S.base === 'bin';
  const out   = [];

  out.push(label + ':');
  for (const b of rows) {
    const val = bin ? '%' + b.toString(2).padStart(8, '0') : hex2(b);
    let line = '       .byte ' + val;
    if (art) {
      const pic = b.toString(2).padStart(8, '0').replace(/1/g, 'X').replace(/0/g, ' ');
      line += (bin ? ' ' : '  ') + '; |' + pic + '|';
    }
    out.push(line);
  }

  if ($('#optCols').checked) {
    out.push('');
    out.push(label + 'Col:');
    for (const c of cols) out.push('       .byte ' + hex2(c) + '  ; COLUP0');
  }

  out.push('');
  out.push('; ' + rows.length + ' scanlines' +
           ($('#optFlip').checked ? ', guardado de baixo para cima' : ', guardado de cima para baixo'));
  if (S.nusiz) out.push('; NUSIZ0 = ' + hex2(S.nusiz));
  if (S.refp)  out.push('; REFP0 = $08');
  return out.join('\n');
}

function renderCode() {
  const txt = buildCode();
  const esc = txt.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  $('#out').innerHTML = esc
    .replace(/(;[^\n]*)/g, '<span class="cm">$1</span>')
    .replace(/(\.byte)/g, '<span class="kw">$1</span>');
}

$('#copy').addEventListener('click', async () => {
  const txt = buildCode();
  try {
    await navigator.clipboard.writeText(txt);
    toast('copiado — cole no .asm');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('copiado — cole no .asm');
  }
});

/* --- reading .byte tables back in ----------------------------------------- */
$('#parse').addEventListener('click', () => {
  const src = $('#in').value;
  const vals = [];
  const re = /%([01]{8})|\$([0-9a-fA-F]{1,2})\b|\b(\d{1,3})\b/g;
  for (const line of src.split('\n')) {
    if (!/\.?byte\b/i.test(line)) continue;
    const body = line.replace(/;.*$/, '').replace(/^.*?\.?byte\b/i, '');
    let m;
    while ((m = re.exec(body))) {
      const v = m[1] ? parseInt(m[1], 2) : m[2] ? parseInt(m[2], 16) : parseInt(m[3], 10);
      if (v >= 0 && v <= 255) vals.push(v);
    }
  }
  if (!vals.length) return toast('não achei nenhuma linha .byte');

  commit();
  const rows = $('#optFlip').checked ? vals.reverse() : vals;
  S.rows = rows.slice(0, 64);
  S.colors = S.rows.map((_, i) => S.colors[i] ?? S.ink);
  $('#hIn').value = S.rows.length;
  buildGrid();
  render();
  toast(S.rows.length + ' bytes carregados');
});

/* --- PNG in --------------------------------------------------------------- */
const nearestTIA = (r, g, b) => {
  let best = 0, bd = Infinity;
  for (let i = 0; i < NTSC.length; i++) {
    const n = NTSC[i];
    const dr = r - parseInt(n.slice(0, 2), 16);
    const dg = g - parseInt(n.slice(2, 4), 16);
    const db = b - parseInt(n.slice(4, 6), 16);
    const d = dr * dr * 0.3 + dg * dg * 0.59 + db * db * 0.11;
    if (d < bd) { bd = d; best = i; }
  }
  return best * 2;
};

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const h = Math.max(1, Math.min(64, Math.round(img.height * 8 / img.width)));
    const cv = document.createElement('canvas');
    cv.width = 8; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, 8, h);
    const data = ctx.getImageData(0, 0, 8, h).data;

    commit();
    const rows = [], cols = [];
    for (let y = 0; y < h; y++) {
      let byte = 0, rs = 0, gs = 0, bs = 0, n = 0;
      for (let x = 0; x < 8; x++) {
        const i = (y * 8 + x) * 4;
        const [r, g, b, a] = [data[i], data[i + 1], data[i + 2], data[i + 3]];
        const lum = (r * 0.3 + g * 0.59 + b * 0.11) * (a / 255);
        if (lum >= 100) { byte |= 1 << (7 - x); rs += r; gs += g; bs += b; n++; }
      }
      rows.push(byte);
      cols.push(n ? nearestTIA(rs / n, gs / n, bs / n) : S.ink);
    }
    S.rows = rows;
    S.colors = cols;
    if ($('#optImportCols').checked) {
      setMode('scanline');
      press('#modeSeg', 'mode', 'scanline');
    }
    $('#hIn').value = h;
    buildGrid();
    render();
    toast(file.name + ' → 8×' + h);
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { toast('não consegui ler essa imagem'); URL.revokeObjectURL(url); };
  img.src = url;
}

$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });

      ? 'Clique num quadradinho para escolher a cor da prévia.'

}

/* ==========================================================================
   Opening a whole .asm: every .byte table in the file becomes a thumbnail
   you can click into. Edits live in a Map keyed by table, so changing one
   sprite's height never disturbs the line numbers of the others — the file
   is only reassembled when you ask for it.
   ========================================================================== */

/* one .byte line: optional label, indent, keyword, then the values */
const BYTE_LINE = /^([A-Za-z_][A-Za-z0-9_]*)?([ \t]*)(\.?byte)\b([ \t]*)(.*)$/i;
const LABEL_ONLY = /^([A-Za-z_][A-Za-z0-9_]*)[ \t]*:?[ \t]*(;.*)?$/;

const FILE = { name: '', lines: [], tables: [], sel: -1, filter: '', eol: '\n', saved: true };
const EDITS = new Map();          // table index -> { rows, colors }

function readByteValues(body) {
  const out = [];
  const re = /%([01]{8})|\$([0-9a-fA-F]{1,2})(?![0-9a-fA-F])|\b(\d{1,3})\b/g;
  let m;
  while ((m = re.exec(body))) {
    const v = m[1] ? parseInt(m[1], 2) : m[2] ? parseInt(m[2], 16) : parseInt(m[3], 10);
    if (v >= 0 && v <= 255) out.push(v);
  }
  return out;
}

function parseAsm(text, name) {
  const lines = text.split(/\r?\n/);
  // hand the file back the line endings it arrived with
  FILE.eol = text.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
  const tables = [];
  let label = null;
  let i = 0;

  while (i < lines.length) {
    const raw = lines[i];
    const bm = raw.match(BYTE_LINE);

    if (!bm) {
      const lm = raw.match(LABEL_ONLY);
      if (lm && !/^[ \t]/.test(raw)) label = lm[1];
      i++;
      continue;
    }

    const from = i;
    const bytes = [];
    let perLine = 1, art = false, style = 'hex';
    let indent = '       ', kw = '.byte', gap = ' ';
    const inlineLabel = bm[1] || null;
    if (bm[1]) label = bm[1];

    while (i < lines.length) {
      const m = lines[i].match(BYTE_LINE);
      if (!m) break;
      const body = m[5];
      const vals = readByteValues(body.replace(/;.*$/, ''));
      if (!vals.length) break;
      if (/;[ \t]*\|/.test(body)) art = true;
      if (/%[01]{8}/.test(body)) style = 'bin';
      if (!m[1]) { indent = m[2] || indent; kw = m[3]; gap = m[4] || ' '; }
      perLine = Math.max(perLine, vals.length);
      bytes.push(...vals);
      i++;
    }

    // a .byte line with nothing numeric in it (a pointer table, say) would
    // otherwise leave i where it was and spin forever
    if (!bytes.length) { i = from + 1; continue; }

    tables.push({
      label: label || ('linha ' + (from + 1)),
      from, to: i - 1, bytes, perLine, art, style, indent, kw, gap, inlineLabel,
    });
    label = null;
  }

  FILE.name = name;
  FILE.lines = lines;
  FILE.tables = tables;
  FILE.sel = -1;
  EDITS.clear();
  return tables;
}

/* worth showing as a sprite: tall enough to be a shape, short enough to be
   one player                                                                */
const looksGraphic = t => t.bytes.length >= 4 && t.bytes.length <= 64 && t.perLine === 1;

const currentBytes = i => (EDITS.get(i) || {}).rows || FILE.tables[i].bytes;

const isDirty = i => {
  const e = EDITS.get(i);
  if (!e) return false;
  const o = FILE.tables[i].bytes;
  return e.rows.length !== o.length || e.rows.some((b, k) => b !== o[k]);
};

/* --- thumbnails ----------------------------------------------------------- */
function drawThumb(cv, bytes) {
  const n = Math.max(bytes.length, 1);
  // scale so the tallest tables still fit the card, but never blow an
  // 8-byte table up so far that it dwarfs the sprites
  const k = Math.max(1, Math.min(5, Math.floor(62 / n)));
  const cw = PIXEL_ASPECT * k;
  cv.width = Math.round(8 * cw);
  cv.height = n * k;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#cdd9e4';
  for (let r = 0; r < bytes.length; r++) {
    for (let c = 0; c < 8; c++) {
      if ((bytes[r] >> (7 - c)) & 1) ctx.fillRect(Math.round(c * cw), r * k, Math.ceil(cw), k);
    }
  }
}

function visibleTables() {
  const onlyGfx = $('#onlyGfx').checked;
  const q = FILE.filter.toLowerCase();
  return FILE.tables
    .map((t, i) => ({ t, i }))
    .filter(o => (!onlyGfx || looksGraphic(o.t)) && (!q || o.t.label.toLowerCase().includes(q)));
}

function renderGallery() {
  const g = $('#gallery');
  g.textContent = '';
  const shown = visibleTables();

  if (!shown.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = FILE.tables.length
      ? 'Nenhuma tabela bate com esse filtro.'
      : 'Não achei nenhuma linha .byte nesse arquivo.';
    g.appendChild(e);
    updateFileMeta();
    return;
  }

  const frag = document.createDocumentFragment();
  for (const o of shown) {
    const card = document.createElement('button');
    card.className = 'card' + (isDirty(o.i) ? ' dirty' : '');
    card.type = 'button';
    card.dataset.idx = o.i;
    card.setAttribute('aria-pressed', String(FILE.sel === o.i));
    card.title = o.t.label + ' — linha ' + (o.t.from + 1);

    const cv = document.createElement('canvas');
    drawThumb(cv, currentBytes(o.i));
    card.appendChild(cv);

    const nm = document.createElement('span');
    nm.className = 'cname';
    nm.textContent = o.t.label;
    card.appendChild(nm);

    const mt = document.createElement('span');
    mt.className = 'cmeta';
    mt.textContent = currentBytes(o.i).length + ' B · L' + (o.t.from + 1);
    card.appendChild(mt);

    const dot = document.createElement('span');
    dot.className = 'dot';
    card.appendChild(dot);

    frag.appendChild(card);
  }
  g.appendChild(frag);
  updateFileMeta();
}

function updateThumb(i) {
  const card = $('#gallery .card[data-idx="' + i + '"]');
  if (!card) return;
  drawThumb(card.querySelector('canvas'), currentBytes(i));
  card.querySelector('.cmeta').textContent =
    currentBytes(i).length + ' B · L' + (FILE.tables[i].from + 1);
  card.classList.toggle('dirty', isDirty(i));
}

function updateFileMeta() {
  if (!FILE.tables.length) return;
  const dirty = FILE.tables.filter((_, i) => isDirty(i)).length;
  $('#fmeta').textContent =
    visibleTables().length + ' de ' + FILE.tables.length + ' tabelas' +
    (dirty ? ' · ' + dirty + ' modificada' + (dirty > 1 ? 's' : '') : '');
}

/* --- selecting a table ---------------------------------------------------- */
function selectTable(i) {
  const t = FILE.tables[i];
  if (!t) return;
  const stored = currentBytes(i);
  if (stored.length > 64) {
    toast(t.label + ' tem ' + stored.length + ' bytes — a grade vai só até 64');
    return;
  }
  if (t.perLine > 1) {
    // several values per line means a playfield or a pointer table, not a
    // player sprite; opening it would rewrite the block one byte per line
    toast(t.label + ' tem ' + t.perLine + ' valores por linha — não é um sprite de player');
    return;
  }
  const flip = $('#optFlip').checked;

  commit();
  S.rows = flip ? stored.slice().reverse() : stored.slice();
  const e = EDITS.get(i);
  S.colors = S.rows.map((_, k) => (e && e.colors[k] != null) ? e.colors[k] : S.ink);
  S.base = t.style === 'bin' ? 'bin' : 'hex';
  FILE.sel = i;

  $('#label').value = t.label;
  $('#hIn').value = S.rows.length;

  buildGrid();
  if (typeof refreshLink === 'function') refreshLink();
  render();
  $$('#gallery .card').forEach(c =>
    c.setAttribute('aria-pressed', String(+c.dataset.idx === i)));
  const card = $('#gallery .card[data-idx="' + i + '"]');
  if (card) card.scrollIntoView({ block: 'nearest' });
}

$('#gallery').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) selectTable(+card.dataset.idx);
});

function step(d) {
  const shown = visibleTables().map(o => o.i);
  if (!shown.length) return;
  const at = shown.indexOf(FILE.sel);
  selectTable(shown[(at + d + shown.length) % shown.length]);
}
$('#prevT').addEventListener('click', () => step(-1));
$('#nextT').addEventListener('click', () => step(1));

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === '[') { e.preventDefault(); step(-1); }
  if (e.key === ']') { e.preventDefault(); step(1); }
});

/* --- writing the file back out -------------------------------------------- */
function emitTable(t, bytes) {
  const bin = t.style === 'bin';
  return bytes.map((b, n) => {
    const val = bin
      ? '%' + b.toString(2).padStart(8, '0')
      : '$' + b.toString(16).toUpperCase().padStart(2, '0');
    // a label sharing the first line has to survive the rewrite
    const head = (n === 0 && t.inlineLabel)
      ? t.inlineLabel + t.indent.slice(Math.min(t.inlineLabel.length, t.indent.length - 1))
      : t.indent;
    let line = head + t.kw + t.gap + val;
    if (t.art) {
      const pic = b.toString(2).padStart(8, '0').replace(/1/g, 'X').replace(/0/g, ' ');
      line += ' ; |' + pic + '|';
    }
    return line;
  });
}

function buildFile() {
  // se a aba de código tem edições ainda não relidas, elas são a verdade
  if (typeof codeDirty !== 'undefined' && codeDirty) absorbCode();
  const out = [];
  const byStart = new Map();
  FILE.tables.forEach((t, i) => { if (isDirty(i)) byStart.set(t.from, i); });

  for (let i = 0; i < FILE.lines.length; i++) {
    if (byStart.has(i)) {
      const idx = byStart.get(i);
      out.push.apply(out, emitTable(FILE.tables[idx], EDITS.get(idx).rows));
      i = FILE.tables[idx].to;
      continue;
    }
    out.push(FILE.lines[i]);
  }
  return out.join(FILE.eol);
}

async function copyText(txt, msg) {
  try {
    await navigator.clipboard.writeText(txt);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(msg);
}

/* drop anything on the page: images go to the grid, text goes to the parser */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  if (++dragDepth === 1) document.body.classList.add('dragging');
});
window.addEventListener('dragover', e => {
  if (e.dataTransfer && e.dataTransfer.types.includes('Files')) e.preventDefault();
});
window.addEventListener('dragleave', () => {
  if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
});
window.addEventListener('drop', e => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (/^image\//.test(f.type)) loadImage(f);
  else openAsm(f);
});

/* --- keep the open table in step with the grid ---------------------------- */
function syncFile() {
  if (FILE.sel < 0) return;
  const flip = $('#optFlip').checked;
  const rows = flip ? S.rows.slice().reverse() : S.rows.slice();
  const prev = EDITS.get(FILE.sel);
  const same = prev && prev.rows.length === rows.length && prev.rows.every((b, k) => b === rows[k]);
  EDITS.set(FILE.sel, { rows, colors: S.colors.slice() });
  updateThumb(FILE.sel);
  updateFileMeta();
  // only a genuine change marks the document unsaved, otherwise every repaint
  // would put the dot back right after a save
  if (!same && isDirty(FILE.sel)) FILE.saved = false;
  if (typeof updateTitle === 'function') updateTitle();
}

/* ==========================================================================
   Menu bar. Saving to disk needs the File System Access API, which the
   published page cannot reach from inside its frame — so the Save item
   renames itself to whatever this browser can actually do.
   ========================================================================== */

/* So conta como enquadrada a moldura de OUTRA origem -- e la que a API de
   arquivos do navegador nao funciona. A casca deste projeto (o index.html) e
   da mesma origem, entao dentro dela o Ctrl+S continua gravando por cima do
   .asm em vez de cair no download. */
const IN_FRAME = (() => {
  try {
    if (window.self === window.top) return false;
    void window.top.document;       // lanca se a moldura for de outra origem
    return false;                   // da para conversar com quem nos abriu
  } catch (e) {
    return true;
  }
})();
const CAN_FS = typeof window.showSaveFilePicker === 'function' && !IN_FRAME;
const CAN_DOWNLOAD = !IN_FRAME;

let fileHandle = null;   // the .asm we opened through the picker, if any

/* The published page runs framed, where the browser's own download is inert.
   The claude.ai viewer grants a `downloads` capability instead; it resolves to
   null anywhere else, so every path below degrades on its own. */
let hostSave = undefined;
async function downloadsApi() {
  if (hostSave === undefined) {
    hostSave = null;
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        hostSave = await window.claude.use('downloads');
      }
    } catch (err) { hostSave = null; }
  }
  return hostSave;
}

/* the viewer only accepts a short list of extensions, and .asm is not on it */
const HOST_OK = /\.(png|txt|json|md|csv|html|svg|pdf)$/i;
const hostName = name => (HOST_OK.test(name) ? name : name + '.txt');

function saveLabel() {
  if (CAN_FS) return 'Salvar .asm';
  if (hostSave) return 'Baixar .asm alterado';
  if (CAN_DOWNLOAD) return 'Baixar .asm';
  return 'Copiar .asm alterado';
}

/* --- helpers over the existing controls ----------------------------------- */
function setCheck(sel, on) {
  const el = $(sel);
  if (el.checked === on) return;
  el.checked = on;
  el.dispatchEvent(new Event('change', { bubbles: true }));
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
const isChecked = sel => $(sel).checked;
const act = name => () => { ACTIONS[name](); render(); };
const hasFile = () => FILE.tables.length > 0;
const hasTable = () => FILE.sel >= 0;

async function writeOut(name, blob, text, handle, adopt) {
  if (CAN_FS) {
    try {
      let h = handle || null;
      if (!h) h = await window.showSaveFilePicker({ suggestedName: name });
      const w = await h.createWritable();
      await w.write(blob);
      await w.close();
      if (adopt) fileHandle = h;        // só o .asm vira o alvo do Ctrl+S
      toast('salvo em ' + h.name);
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;   // the user cancelled
      // anything else means this context cannot write files: fall through
    }
  }
  const host = await downloadsApi();
  if (host) {
    const fn = hostName(name);
    try {
      await host.save({ filename: fn, data: blob });
      toast(fn === name ? 'salvo como ' + fn : 'salvo como ' + fn + ' — renomeie para ' + name);
      return true;
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') { toast('download cancelado'); return false; }
      if (code === 'rate_limited') { toast('espere um instante e tente de novo'); return false; }
      if (code === 'too_large') { toast(name + ' passa de 16 MB'); return false; }
      // anything else: this view cannot save, fall through to the copy
    }
  }

  if (CAN_DOWNLOAD) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('baixado como ' + name);
    return true;
  }
  if (text != null) {
    copyText(text, 'este navegador não deixa gravar arquivos aqui — conteúdo copiado');
    return true;
  }
  toast('não deu para salvar ' + name + ' daqui');
  return false;
}

/* --- file actions --------------------------------------------------------- */
async function openAsmPicker() {
  if (CAN_FS && typeof window.showOpenFilePicker === 'function') {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: 'Fonte 6502', accept: { 'text/plain': ['.asm', '.h', '.s', '.inc', '.txt'] } }],
      });
      fileHandle = h;
      openAsm(await h.getFile());
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  $('#asmFile').click();
}

async function saveAsm(saveAs) {
  if (!hasFile()) { toast('nenhum arquivo aberto'); return; }
  applySprite(true);
  const text = buildFile();
  const blob = new Blob([text], { type: 'text/plain' });
  const ok = await writeOut(FILE.name, blob, text, saveAs ? null : fileHandle, true);
  if (ok) { FILE.saved = true; FILE.dirtyText = false; updateTitle(); }
}

/* put the sprite on screen back into the table it came from */
function applySprite(quiet) {
  if (!hasTable()) { if (!quiet) toast('abra um .asm e escolha um sprite primeiro'); return; }
  syncFile();
  const t = FILE.tables[FILE.sel];
  if (!quiet) {
    toast(isDirty(FILE.sel)
      ? t.label + ' aplicado — ' + S.rows.length + ' bytes na linha ' + (t.from + 1)
      : t.label + ' está igual ao original');
  }
}

function revertSprite() {
  if (!hasTable()) { toast('nenhum sprite aberto'); return; }
  const i = FILE.sel;
  const t = FILE.tables[i];
  commit();
  EDITS.delete(i);
  const flip = isChecked('#optFlip');
  S.rows = flip ? t.bytes.slice().reverse() : t.bytes.slice();
  S.colors = S.rows.map(() => S.ink);
  $('#hIn').value = S.rows.length;
  buildGrid();
  render();                 // re-syncs a copy that matches the original again
  updateThumb(i);
  updateFileMeta();
  toast(t.label + ' voltou ao original');
}

function closeAsm() {
  if (!hasFile()) return;
  FILE.name = '';
  FILE.lines = [];
  FILE.tables = [];
  FILE.sel = -1;
  FILE.saved = true;
  FILE.dirtyText = false;
  EDITS.clear();
  fileHandle = null;
  $('#gallery').textContent = '';
  $('#fname').textContent = 'nenhum arquivo aberto';
  $('#fmeta').textContent = 'Arquivo ▸ Abrir .asm, ou arraste o arquivo para cá';
  ['#search', '#allWrap', '#prevT', '#nextT', '#copyFile', '#shutFile']
    .forEach(sel => { $(sel).hidden = true; });
  $('#filebar').classList.add('shut');
  updateTitle();
  toast('arquivo fechado');
}

function exportPng() {
  const cv = document.createElement('canvas');
  const h = S.rows.length;
  const z = 8;
  cv.width = 8 * z;
  cv.height = h * z;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = rgbOf(S.bg);
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < h; r++) {
    ctx.fillStyle = rgbOf(S.mode === 'single' ? S.ink : S.colors[r]);
    for (let c = 0; c < 8; c++) {
      if ((S.rows[r] >> (7 - c)) & 1) ctx.fillRect(c * z, r * z, z, z);
    }
  }
  const name = (($('#label').value || 'sprite').trim().replace(/[^\w.-]+/g, '_')) + '.png';
  cv.toBlob(blob => { writeOut(name, blob, null, null); }, 'image/png');
}

/* --- compiling ------------------------------------------------------------
   Compilar monta o .asm inteiro — com os sprites editados já aplicados nas
   tabelas — aqui mesmo, com o montador embutido, e entrega a ROM ao emulador
   desta página. Não há servidor, processo externo nem nada instalado: a ROM
   fica na memória e sai por Arquivo ▸ Salvar ROM.

   Pelo terminal, `node tools/build.js <fonte>` faz o mesmo e ainda grava .bin,
   .lst e .sym em disco.
   -------------------------------------------------------------------------- */

let lastRom = null;        // { bytes, name } da última compilação que deu certo

/* os mesmos -D do tools/build.js: fontes que endereçam os registradores de
   leitura da TIA pelo espelho em $30, como as fontes originais faziam */
const BUILD_DEFINES = {
  riverraid: { TIA_BASE_READ_ADDRESS: '$30' },
  pitfall:   { TIA_BASE_READ_ADDRESS: '$30' },
  combat:    { TIA_BASE_READ_ADDRESS: '$30' },
};

const stemOf = name => String(name || '').replace(/\.[^.]*$/, '').toLowerCase();

function showBuild(title, body, log) {
  $('#buildGoto').hidden = true;
  $('#buildTitle').textContent = title;
  $('#buildBody').textContent = body;
  $('#buildLog').textContent = log || '';
  $('#buildLog').hidden = !log;
  $('#dlgBuild').showModal();
}

async function compile(run) {
  if (!hasFile()) {
    say('não há .asm aberto para compilar', 'error');
    showBuild('Não há nada para compilar ainda',
      'O que é compilado é o .asm inteiro, com os sprites que você editou já ' +
      'aplicados nas tabelas. Abra um fonte primeiro — Arquivo ▸ Abrir .asm ' +
      '(Ctrl+O), ou arraste o arquivo para a página — e então Compilar.',
      '');
    return;
  }

  applySprite(true);
  if (CAN_FS && fileHandle) await saveAsm(false);   // disco e ROM combinando

  const t0 = performance.now();
  let res;
  try {
    res = DASM.assemble({
      name: FILE.name,
      source: buildFile(),
      defines: BUILD_DEFINES[stemOf(FILE.name)] || {},
    });
  } catch (err) {
    showBuild('O montador tropeçou',
      'Isso é defeito do montador embutido, não do seu fonte. Se der para ' +
      'reduzir o caso, vale anotar o que estava no arquivo.',
      String(err && err.stack || err));
    return;
  }
  finishBuild(res, Math.round(performance.now() - t0), run);
}

/* o que fazer com o resultado */
function finishBuild(res, ms, run) {
  const stem = stemOf(FILE.name);
  const errors = res.problems.filter(p => p.kind === 'error');
  const warnings = res.problems.filter(p => p.kind === 'warning');
  const from = p => (p.file && p.file !== FILE.name ? p.file + ' ' : '');

  if (res.ok) {
    const kb = (res.size / 1024).toFixed(1);
    lastRom = { bytes: res.rom, name: stem + '.bin' };
    $('#sbuild').innerHTML = 'ROM <b>' + stem + '.bin</b> · ' + res.size + ' B · na memória';
    $('#sbuild').title = 'montada nesta página em ' + ms + ' ms, ' + res.passes +
                         ' passes — Arquivo ▸ Salvar ROM grava em disco';
    emuLoadRom(res.rom, stem + '.bin', !!run);
    if (run) showView('emu');
    if (run) toast('ROM de ' + kb + ' KB — rodando no emulador', 4000, 'ok');
    else toast(stem + '.bin pronta — ' + res.size + ' bytes em ' + ms + ' ms', 4000, 'ok');
    if (warnings.length) {
      showBuild('Compilou com avisos',
        stem + '.bin — ' + res.size + ' bytes. ' + warnings.length + ' aviso(s):',
        warnings.map(p => from(p) + 'linha ' + p.line + ': ' + p.message).join('\n'));
    }
    return;
  }

  const lines = errors.length
    ? errors.map(p => from(p) + 'linha ' + p.line + ': ' + p.kind + ': ' + p.message).join('\n')
    : (res.log || 'o montador não disse por quê');
  const n = errors.length;
  // toast, não say: assim o aviso de "compilando…" some junto com o resultado
  toast(n ? 'recusou ' + FILE.name + ': ' + n + (n === 1 ? ' erro' : ' erros')
          : 'não deu para compilar ' + FILE.name, 4000, 'error');
  $('#sbuild').textContent = '';
  showBuild('O montador recusou o fonte', n === 1 ? 'Um erro:' : n + ' erros:', lines);

  // só dá para pular para a linha se o erro for no fonte que está aberto
  const here = errors.find(p => p.line > 0 && (!p.file || p.file === FILE.name));
  if (here) {
    const go = $('#buildGoto');
    go.hidden = false;
    go.textContent = 'Ir para a linha ' + here.line;
    go.onclick = () => { $('#dlgBuild').close(); gotoLine(here.line, true); };
  }
}

/* a ROM montada aqui só existe na memória até alguém pedir */
async function saveRom() {
  if (!lastRom) { toast('compile primeiro (F5)'); return; }
  const blob = new Blob([lastRom.bytes], { type: 'application/octet-stream' });
  await writeOut(lastRom.name, blob, null, null);
}

  const at = m.label.toLowerCase().indexOf(m.ak.toLowerCase());
